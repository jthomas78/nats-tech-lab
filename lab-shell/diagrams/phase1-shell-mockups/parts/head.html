<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #006fff; text-decoration: none; }
    a:hover { color: #4c9bff; }

    .theme-dark {
      --lab-bg: #131416; --lab-panel-bg: #131416; --lab-panel-border: #2c3138;
      --lab-accent: #006fff; --lab-accent-ink: #06121f; --lab-nav-active-bg: #1c1d1f;
      --p-text-color: #dee0e3; --p-text-muted-color: #b7bcc2; --p-text-disabled-color: #737c87;
      --lab-disabled-bg: #3a4049; --lab-disabled-text: #9aa1a9; --lab-nested-bg: #171c29;
      --ok: #27c07f; --warn: #f0b429; --err: #e5484d;
      --lab-skel-hi: #4d5560;
    }
    .theme-light {
      --lab-bg: #f4f5f7; --lab-panel-bg: #ffffff; --lab-panel-border: #d1d5db;
      --lab-accent: #005fdb; --lab-accent-ink: #ffffff; --lab-nav-active-bg: #ffffff;
      --p-text-color: #1e2328; --p-text-muted-color: #4e5560; --p-text-disabled-color: #9aa1a9;
      --lab-disabled-bg: #e2e5e9; --lab-disabled-text: #9aa1a9; --lab-nested-bg: #eef1f7;
      --ok: #1a8f5e; --warn: #b4770a; --err: #c1373b;
      --lab-skel-hi: #f3f5f8;
    }

    .root {
      width: 1920px; height: 1080px; overflow: hidden;
      background: var(--lab-bg); color: var(--p-text-color);
      font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px; line-height: 20px; -webkit-font-smoothing: antialiased;
    }

    /* ---- shell chrome: values copied from shared/ui-shell/app-shell.css ---- */
    .app { display: flex; flex-direction: column; height: 1080px; }
    .topbar {
      flex-shrink: 0; display: flex; align-items: center; gap: 20px;
      height: 52px; padding: 0 16px; border-bottom: 1px solid var(--lab-panel-border);
    }
    .brandmark {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--p-text-color); font-size: 16px; font-weight: 600; letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .brandmark svg { color: var(--lab-accent); }
    .crumb { display: flex; align-items: center; gap: 6px; color: var(--p-text-muted-color); font-size: 12px; white-space: nowrap; }
    .crumb b { color: var(--p-text-color); font-weight: 600; }
    .crumb .sep { color: var(--p-text-disabled-color); }
    .topbar-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .status-tag {
      display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 100px; border: 1px solid var(--lab-panel-border);
      color: var(--ok); white-space: nowrap;
    }
    .status-tag .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
    .field-inline { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--p-text-muted-color); white-space: nowrap; }
    .field-inline .sel {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--lab-panel-bg); border: 1px solid var(--lab-panel-border);
      color: var(--p-text-color); border-radius: 5px; font-size: 12px; padding: 4px 6px;
    }
    .icon-btn {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; border: 1px solid transparent; color: var(--p-text-muted-color);
    }

    .shell { flex: 1; display: flex; min-height: 0; }
    .sidebar {
      flex-shrink: 0; width: 220px; border-right: 1px solid var(--lab-panel-border);
      display: flex; flex-direction: column; padding: 14px 10px; gap: 14px;
    }
    .nav-scroll { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; }
    .nav-group { display: flex; flex-direction: column; gap: 1px; }
    .eyebrow {
      display: flex; align-items: center; justify-content: space-between; padding: 4px 8px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--p-text-disabled-color);
    }
    .nav-item {
      display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 8px;
      border-left: 2px solid transparent; border-radius: 5px;
      color: var(--p-text-muted-color); font-size: 13px; white-space: nowrap; overflow: hidden;
    }
    .nav-item svg { flex-shrink: 0; opacity: 0.85; }
    .nav-item.active {
      background: var(--lab-nav-active-bg); color: var(--p-text-color);
      border-left-color: var(--lab-accent); font-weight: 600;
    }
    .nav-item.pending { color: var(--p-text-disabled-color); }
    .nav-badge {
      margin-left: auto; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 10px; color: var(--p-text-disabled-color); background: var(--lab-disabled-bg);
      border-radius: 100px; padding: 1px 6px;
    }
    .nav-dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .sidebar-foot { display: flex; align-items: center; justify-content: flex-end; flex-shrink: 0; height: 26px; margin-top: -6px; }
    .sidebar-collapse-btn {
      display: flex; align-items: center; justify-content: center; width: 26px; height: 26px;
      border-radius: 5px; color: var(--p-text-muted-color); padding: 0;
    }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
    .main-inner { width: 100%; flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
    .main-footer { flex-shrink: 0; }

    .lab-panel { background: var(--lab-panel-bg); border: 1px solid var(--lab-panel-border); border-radius: 4px; padding: 12px; }
    .lab-panel h3 {
      margin: 0 0 10px; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.01em;
      text-transform: uppercase; color: var(--p-text-muted-color);
    }
    .lab-muted { color: var(--p-text-muted-color); }
    .lab-dim { color: var(--p-text-disabled-color); }

    /* ---- page content ---- */
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .page-head h1 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: 0.01em; }
    .page-head p { margin: 2px 0 0; font-size: 12px; color: var(--p-text-muted-color); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px;
      border-radius: 5px; font-size: 12px; font-weight: 600;
      background: var(--lab-accent); color: var(--lab-accent-ink);
    }
    .btn.ghost { background: none; border: 1px solid var(--lab-panel-border); color: var(--p-text-color); }

    table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.tbl th {
      text-align: left; font-weight: 700; font-size: 11px; line-height: 16px; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--p-text-muted-color);
      padding: 4px 8px; border-bottom: 1px solid var(--lab-panel-border);
    }
    table.tbl td { padding: 2px 8px; height: 24px; border-bottom: 1px solid color-mix(in srgb, var(--lab-panel-border) 55%, transparent); }
    table.tbl td.mono, table.tbl td .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }

    .pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 100px;
      font-size: 11px; font-weight: 600; border: 1px solid var(--lab-panel-border);
    }
    .pill .pip { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.ok { color: var(--ok); }
    .pill.busy { color: var(--lab-accent); }
    .pill.bad { color: var(--err); }
    .pill.warn { color: var(--warn); }
    .pill.off { color: var(--p-text-disabled-color); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .stack { display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; }

    .footbar {
      display: flex; align-items: center; gap: 18px;
      border-top: 1px solid var(--lab-panel-border); padding: 7px 16px;
      font-size: 11px; color: var(--p-text-muted-color);
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    .footbar .k { color: var(--p-text-disabled-color); }

    /* Loading placeholders (BR-AS08). The sweep is the signal that the shell is
       WORKING, not stalled — a static gray bar is indistinguishable from a
       broken render. Motion stays low-contrast and slow enough not to compete
       with live content in neighbouring panels. */
    @keyframes lab-skel-sweep {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes lab-skel-breathe {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.9; }
    }
    .skel {
      background: linear-gradient(
        90deg,
        var(--lab-disabled-bg) 0%,
        var(--lab-disabled-bg) 35%,
        var(--lab-skel-hi) 50%,
        var(--lab-disabled-bg) 65%,
        var(--lab-disabled-bg) 100%
      );
      background-size: 220% 100%;
      animation: lab-skel-sweep 1.8s linear infinite;
      border-radius: 3px; height: 10px; opacity: 0.5;
    }
    /* Panel-level placeholder for an extension point whose contribution is in
       flight. Deliberately FUZZY: the host reserves the region and says
       "something is arriving here" without drawing a false shape for content
       it has not seen. Each instance offsets its phase so a screen full of
       pending extension points does not pulse in lockstep. */
    .skel-ext {
      position: relative;
      border: 1px dashed var(--lab-panel-border);
      border-radius: 4px;
      background: var(--lab-disabled-bg);
      opacity: 0.5;
      overflow: hidden;
      animation: lab-skel-breathe 2.4s ease-in-out infinite;
    }
    .skel-ext::after {
      content: '';
      position: absolute; inset: -30%;
      background: radial-gradient(
        ellipse at 30% 50%,
        var(--lab-skel-hi) 0%,
        transparent 60%
      );
      filter: blur(14px);
      animation: lab-skel-sweep 2.8s linear infinite;
      background-size: 220% 100%;
    }
    .skel-ext > .skel-ext-label {
      position: absolute; left: 10px; bottom: 8px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--p-text-disabled-color);
    }
    .skel-ext.delay-1 { animation-delay: -0.8s; }
    .skel-ext.delay-2 { animation-delay: -1.6s; }
    .skel.delay-1 { animation-delay: -0.6s; }
    .skel.delay-2 { animation-delay: -1.2s; }

    /* Motion is decoration here, never the only carrier of meaning — the
       "Loading …" text and the footer's stage line say the same thing. */
    @media (prefers-reduced-motion: reduce) {
      .skel, .skel-ext, .skel-ext::after { animation: none; }
      .skel { background: var(--lab-disabled-bg); }
    }
    .tag {
      display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 100px;
      border: 1px solid var(--lab-panel-border); font-size: 11px; color: var(--p-text-muted-color);
    }
  </style>
</helmet>
