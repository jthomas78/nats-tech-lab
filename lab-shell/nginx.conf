# Production shell. This file is the container-side twin of the `server.proxy`
# block in vite.config.js — the two must stay in step, because the security
# properties the shell relies on are enforced here, not in the bundle.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # --- The one auth route the shell is allowed to reach ------------------
    #
    # EXACT match, not a prefix. This is the whole of BR-AS25/BR-AS27 in one
    # line: federated plugin code runs inside the shell's realm and therefore
    # inside this origin, so an `/api/auth/` prefix rule would hand every
    # plugin the operator mint routes (adminConnectInfo among them) for the
    # price of one fetch. `location =` cannot be widened by a path suffix.
    # nginx forwards the query string on its own, matching the dev proxy's
    # `(?:\?.*)?` allowance.
    #
    # Note also what is absent: there is no general `/api/` rule here, unlike
    # every other frontend in this stack. The shell's registry read moved onto
    # NATS in Phase 4 and no HTTP boot fallback survived it, so this container
    # proxies exactly two things — this route, and the bus below.
    location = /api/auth/shellConnectInfo {
        proxy_pass http://accounts-service:8080/api/auth/shellConnectInfo;
    }

    # Everything else under /api/ is refused here rather than falling through
    # to the SPA rule above, which would answer an unproxied /api/auth/
    # adminConnectInfo with 200 and a page of HTML. Nothing leaks either way
    # — the route simply is not proxied — but a silent 200 hides a misroute,
    # and this is the one place where a routing mistake would be a
    # credential-scope mistake. Longest-prefix match puts the exact rule
    # above ahead of this one.
    location /api/ {
        return 404;
    }

    # --- The browser's NATS WebSocket, same-origin -------------------------
    #
    # Same arrangement as the other frontends (see
    # demos/01-dictionary/frontend/admin/nginx.conf for the long form):
    # accounts-service returns the *path* `/nats` in connectInfo and
    # shared/nats/resolveWsUrl.js resolves it against this page's origin, so
    # one config value works on a laptop-local stack and behind a remote TLS
    # proxy alike. The browser never dials the bus directly; it dials nginx,
    # which forwards one path, and it still needs an account-scoped JWT to get
    # past the NATS server's own authorization.
    location /nats/ {
        proxy_pass http://nats:9222/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A NATS client connection is long-lived and can sit idle between
        # messages; nginx's 60s default would drop it mid-session.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # nats-core dials the exact URL it is given, with no trailing slash, so
    # the handshake arrives as /nats — which the prefix rule above does not
    # match. An nginx redirect would drop the Upgrade header, so this exact-
    # match rule serves the handshake directly instead.
    location = /nats {
        proxy_pass http://nats:9222/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
