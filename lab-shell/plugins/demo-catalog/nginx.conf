# The plugin's remote. A static file server and nothing else — read the
# absence of any `proxy_pass` in this file as the point rather than an
# omission. A plugin remote is code the shell fetches and runs; giving its
# origin a route to accounts-service or the bus would put a second, unaudited
# door into the platform beside the narrow one the shell keeps.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;

        # NOT the SPA fallback the other frontends use. `demo-catalog-
        # unreachable` is a curated entry whose URL has no chunk behind it,
        # and the failure state it demonstrates is a fetch that 404s; an
        # `/index.html` fallback would answer 200 with HTML instead and the
        # plugin would fail later, as a module parse error, in the wrong
        # state. The dev server 404s these, so this keeps the two honest.
        try_files $uri =404;

        # Module Federation loads remoteEntry.js and its chunks as ES modules,
        # which are fetched in CORS mode — cross-origin here, since the shell
        # is a different port. Vite's dev server supplies this via `cors: true`
        # and the container has to do it explicitly or every remote fails at
        # the fetch with no useful error.
        #
        # Named origin rather than `*`: this remote exists to be loaded by
        # this platform's shell, and the allowlist on the other side
        # (REGISTRY_ALLOWED_ORIGINS) is only half a statement if this side
        # will hand its code to anyone who asks. `always` so the 404 above
        # carries the header too.
        add_header Access-Control-Allow-Origin "http://localhost:7110" always;
        add_header Vary "Origin" always;
    }
}
