<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="900" viewBox="0 0 1650 900" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <!--UNIFI-ICONS-->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a515b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#27c07f"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a7b1e"/>
    </marker>
  </defs>
  <rect width="1650" height="900" fill="#14171b"/>

  <text x="60" y="42" fill="#dee0e3" font-size="24" font-weight="700">Dictionary POC — Data Types &amp; Retrieval Mechanics</text>
  <text x="60" y="66" fill="#b7bcc2" font-size="13">The 3 governed data-type categories, how a value is actually fetched, and where the Swagger API fits in</text>
  <line x1="60" y1="84" x2="1590" y2="84" stroke="#2c3138" stroke-width="1"/>

  <!-- ================= SECTION 1: 3 data type categories ================= -->
  <text x="60" y="112" fill="#8b929b" font-size="12.5" font-weight="700" letter-spacing="0.5">3 DATA TYPE CATEGORIES — governs who owns a value's meaning</text>

  <rect x="60" y="130" width="500" height="180" rx="14" fill="#1a1e23" stroke="#27c07f" stroke-width="1.6"/>
  <text x="310" y="156" fill="#dee0e3" font-size="15" font-weight="700" text-anchor="middle">standards</text>
  <text x="80" y="180" fill="#b7bcc2" font-size="11.5">e.g. currency · country · incoterm ·</text>
  <text x="80" y="197" fill="#b7bcc2" font-size="11.5">uom · hazard-class</text>
  <text x="80" y="222" fill="#8b929b" font-size="11">Source of truth: external standards bodies</text>
  <text x="80" y="238" fill="#8b929b" font-size="11">(ISO, Incoterms, UNECE, UN)</text>
  <text x="80" y="262" fill="#8b929b" font-size="11">Edited by: data stewards</text>
  <text x="80" y="286" fill="#27c07f" font-size="11" font-weight="600">Codes rarely change — adding one is safe</text>

  <rect x="580" y="130" width="500" height="180" rx="14" fill="#1a1e23" stroke="#9a7b1e" stroke-width="1.6"/>
  <text x="830" y="156" fill="#dee0e3" font-size="15" font-weight="700" text-anchor="middle">domain-enum</text>
  <text x="600" y="180" fill="#b7bcc2" font-size="11.5">e.g. ship-status</text>
  <text x="600" y="204" fill="#8b929b" font-size="11">Source of truth: <tspan fill="#dee0e3">the backend domain</tspan></text>
  <text x="600" y="220" fill="#8b929b" font-size="11">(Go constants — compiled into the binary)</text>
  <text x="600" y="244" fill="#8b929b" font-size="11">Edited by: devs own codes · stewards translate</text>
  <text x="600" y="268" fill="#e0c375" font-size="11" font-weight="600">⚠ adding/removing a code here is meaningless</text>
  <text x="600" y="284" fill="#e0c375" font-size="11" font-weight="600">unless the domain actually emits it</text>

  <rect x="1100" y="130" width="490" height="180" rx="14" fill="#1a1e23" stroke="#006fff" stroke-width="1.6"/>
  <text x="1345" y="156" fill="#dee0e3" font-size="15" font-weight="700" text-anchor="middle">ui-copy / i18n</text>
  <text x="1120" y="180" fill="#b7bcc2" font-size="11.5">e.g. Port UI copy catalog</text>
  <text x="1120" y="204" fill="#8b929b" font-size="11">Source of truth: <tspan fill="#dee0e3">the frontend</tspan></text>
  <text x="1120" y="220" fill="#8b929b" font-size="11">(authored in refdata; generated JS fallback)</text>
  <text x="1120" y="244" fill="#8b929b" font-size="11">Edited by: translators</text>
  <text x="1120" y="268" fill="#8ec4ff" font-size="11" font-weight="600">Keys owned by devs — only labels</text>
  <text x="1120" y="284" fill="#8ec4ff" font-size="11" font-weight="600">are translatable, never the key itself</text>

  <text x="60" y="330" fill="#8b929b" font-size="10.5" font-style="italic">+ a 4th category, <tspan font-family="ui-monospace,Menlo,monospace">config</tspan>, is reserved in the model for tenant/app configuration — zero types registered under it today. See "Outstanding POC Tasks."</text>

  <!-- ================= SECTION 2: retrieval mechanics ================= -->
  <text x="60" y="374" fill="#8b929b" font-size="12.5" font-weight="700" letter-spacing="0.5">RETRIEVAL MECHANICS — three paths to the same value</text>

  <rect x="60" y="392" width="500" height="170" rx="14" fill="#1a1e23" stroke="#27c07f" stroke-width="1.5"/>
  <g color="#fff"><rect x="80" y="410" width="40" height="40" rx="10" fill="#27c07f"/><use href="#ico-db" x="80" y="410" width="40" height="40"/></g>
  <text x="132" y="430" fill="#dee0e3" font-size="14" font-weight="700">Path 1 — Postgres direct</text>
  <text x="80" y="470" fill="#b7bcc2" font-size="11.5">Ground truth — bypasses the</text>
  <text x="80" y="487" fill="#b7bcc2" font-size="11.5">cache entirely</text>
  <text x="80" y="512" fill="#8b929b" font-size="11">Used by: refdata-service's own write</text>
  <text x="80" y="528" fill="#8b929b" font-size="11">path; ad hoc ops/reporting queries</text>
  <text x="80" y="546" fill="#8b929b" font-size="10.5" font-style="italic">Not exposed to other services directly</text>

  <rect x="580" y="392" width="500" height="170" rx="14" fill="#1a1e23" stroke="#006fff" stroke-width="1.8"/>
  <g color="#fff"><rect x="600" y="410" width="40" height="40" rx="10" fill="#006fff"/><use href="#ico-service" x="600" y="410" width="40" height="40"/></g>
  <text x="652" y="430" fill="#dee0e3" font-size="14" font-weight="700">Path 2 — REST API</text>
  <text x="600" y="470" fill="#b7bcc2" font-size="11.5">Cache-first internally — backfills</text>
  <text x="600" y="487" fill="#b7bcc2" font-size="11.5">the KV cache on a miss</text>
  <rect x="600" y="502" width="380" height="24" rx="12" fill="#0f3d66" stroke="#006fff" stroke-width="1.2"/>
  <text x="790" y="518" fill="#8ec4ff" font-size="10.5" font-weight="700" text-anchor="middle">📖 explorable + callable via Swagger UI — /swagger/</text>
  <text x="600" y="546" fill="#8b929b" font-size="10.5" font-family="ui-monospace,Menlo,monospace">GET /api/refdata/{context}/{type}/{code}</text>

  <rect x="1100" y="392" width="490" height="170" rx="14" fill="#1a1e23" stroke="#8ec4ff" stroke-width="1.5"/>
  <g color="#fff"><rect x="1120" y="410" width="40" height="40" rx="10" fill="#006fff"/><use href="#ico-kv" x="1120" y="410" width="40" height="40"/></g>
  <text x="1172" y="430" fill="#dee0e3" font-size="14" font-weight="700">Path 3 — NATS KV direct</text>
  <text x="1120" y="470" fill="#b7bcc2" font-size="11.5">Embedded consumer</text>
  <text x="1120" y="487" fill="#b7bcc2" font-size="11.5">(internal/refdataconsumer)</text>
  <text x="1120" y="512" fill="#8ec4ff" font-size="11" font-weight="600">Zero network call on a hit</text>
  <text x="1120" y="536" fill="#8b929b" font-size="11">Falls back to Path 2 on a cache</text>
  <text x="1120" y="552" fill="#8b929b" font-size="11">miss or version mismatch</text>

  <text x="60" y="588" fill="#8b929b" font-size="10.5" font-style="italic">Non-path, worth knowing: the bounded REFDATA JetStream stream carries only a change-notification pointer — it cannot answer "what is this item's value" by itself.</text>

  <!-- ================= SECTION 3: mechanics flow (Path 3 -> Path 2 fallback) ================= -->
  <text x="60" y="628" fill="#8b929b" font-size="12.5" font-weight="700" letter-spacing="0.5">MECHANICS — version-checked cache read (Q5 protocol), Path 3 falling back to Path 2</text>

  <rect x="60" y="648" width="260" height="70" rx="16" fill="#1a1e23" stroke="#8ec4ff" stroke-width="1.4"/>
  <text x="190" y="678" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">Consumer calls</text>
  <text x="190" y="696" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">Lookup()</text>

  <rect x="360" y="648" width="300" height="70" rx="16" fill="#1a1e23" stroke="#8ec4ff" stroke-width="1.4"/>
  <text x="510" y="678" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">Read KV entry +</text>
  <text x="510" y="696" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">type's _meta version</text>

  <rect x="700" y="648" width="220" height="70" rx="16" fill="#1a1e23" stroke="#dee0e3" stroke-width="1.4"/>
  <text x="810" y="678" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">Version</text>
  <text x="810" y="696" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">matches?</text>

  <rect x="960" y="648" width="330" height="70" rx="16" fill="#132a22" stroke="#27c07f" stroke-width="1.5"/>
  <text x="1125" y="678" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">Return cached value</text>
  <text x="1125" y="696" fill="#8b929b" font-size="10.5" text-anchor="middle">fast path, zero network call</text>

  <rect x="700" y="758" width="590" height="70" rx="16" fill="#0f3d66" stroke="#006fff" stroke-width="1.5"/>
  <text x="995" y="784" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">Call REST API (Swagger-documented) → server backfills KV → return value</text>
  <text x="995" y="802" fill="#8ec4ff" font-size="10.5" text-anchor="middle">this is Path 2, invoked automatically as the fallback — same endpoint you can call yourself via /swagger/</text>

  <g stroke="#4a515b" stroke-width="1.5" fill="none">
    <line x1="320" y1="683" x2="358" y2="683" marker-end="url(#arrow)"/>
    <line x1="660" y1="683" x2="698" y2="683" marker-end="url(#arrow)"/>
  </g>
  <line x1="920" y1="683" x2="958" y2="683" stroke="#27c07f" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="939" y="670" fill="#27c07f" font-size="10" text-anchor="middle">match</text>

  <line x1="810" y1="718" x2="810" y2="756" stroke="#9a7b1e" stroke-width="1.6" marker-end="url(#arrowWarn)"/>
  <text x="866" y="742" fill="#e0c375" font-size="10" text-anchor="middle">miss / mismatch</text>

  <text x="60" y="862" fill="#8b929b" font-size="11" font-style="italic">Green border = standards-grade / ground truth · amber border = domain-owned codes · light-blue border = KV/consumer path · blue border = REST + Swagger-documented path.</text>
</svg>
