<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1020" viewBox="0 0 1260 1020" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <!--UNIFI-ICONS-->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#27c07f"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a7b1e"/>
    </marker>
  </defs>
  <rect width="1260" height="1020" fill="#14171b"/>

  <text x="60" y="42" fill="#dee0e3" font-size="24" font-weight="700">Dictionary Database — Entity Relationship Diagram</text>
  <text x="60" y="66" fill="#b7bcc2" font-size="13">refdata-service's `refdata` Postgres schema — the actual columns, keys, and delete-cascade behavior</text>
  <line x1="60" y1="84" x2="1200" y2="84" stroke="#2c3138" stroke-width="1"/>

  <!-- ================= dictionary_types ================= -->
  <rect x="60" y="120" width="340" height="150" rx="8" fill="#1a1e23" stroke="#006fff" stroke-width="1.6"/>
  <text x="230" y="144" fill="#dee0e3" font-size="14.5" font-weight="700" text-anchor="middle">dictionary_types</text>
  <line x1="60" y1="154" x2="400" y2="154" stroke="#2c3138" stroke-width="1"/>
  <text x="80" y="176" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK type_key    TEXT</text>
  <text x="80" y="196" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   name        TEXT</text>
  <text x="80" y="216" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   description TEXT</text>
  <text x="80" y="248" fill="#8b929b" font-size="10.5" font-style="italic">category (governance field —</text>
  <text x="80" y="262" fill="#8b929b" font-size="10.5" font-style="italic">see "Data Types") lives here too</text>

  <!-- ================= dictionary_set_versions (standalone, no FK) ================= -->
  <rect x="460" y="120" width="340" height="150" rx="8" fill="#1a1e23" stroke="#4a515b" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="630" y="144" fill="#dee0e3" font-size="14.5" font-weight="700" text-anchor="middle">dictionary_set_versions</text>
  <line x1="460" y1="154" x2="800" y2="154" stroke="#2c3138" stroke-width="1"/>
  <text x="480" y="176" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK context   TEXT</text>
  <text x="480" y="196" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK type_key  TEXT</text>
  <text x="480" y="216" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   version   INTEGER</text>
  <text x="480" y="248" fill="#8b929b" font-size="10.5" font-style="italic">No FK — one row per (context, type),</text>
  <text x="480" y="262" fill="#8b929b" font-size="10.5" font-style="italic">bumped atomically by every mutation (BR-D04)</text>

  <!-- ================= dictionary_locales (standalone, no FK) ================= -->
  <rect x="860" y="120" width="340" height="150" rx="8" fill="#1a1e23" stroke="#4a515b" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="1030" y="144" fill="#dee0e3" font-size="14.5" font-weight="700" text-anchor="middle">dictionary_locales</text>
  <line x1="860" y1="154" x2="1200" y2="154" stroke="#2c3138" stroke-width="1"/>
  <text x="880" y="176" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK context    TEXT</text>
  <text x="880" y="196" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK locale     TEXT</text>
  <text x="880" y="216" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   is_default BOOLEAN</text>
  <text x="880" y="248" fill="#8b929b" font-size="10.5" font-style="italic">No FK — per-context config. At most one</text>
  <text x="880" y="262" fill="#8b929b" font-size="10.5" font-style="italic">is_default=true per context, enforced in a transaction</text>

  <!-- ================= dictionary_items (central) ================= -->
  <rect x="60" y="330" width="400" height="240" rx="8" fill="#1a1e23" stroke="#006fff" stroke-width="1.8"/>
  <text x="260" y="354" fill="#dee0e3" font-size="14.5" font-weight="700" text-anchor="middle">dictionary_items</text>
  <line x1="60" y1="364" x2="460" y2="364" stroke="#2c3138" stroke-width="1"/>
  <text x="80" y="386" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK context   TEXT</text>
  <text x="80" y="406" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK,FK type_key TEXT</text>
  <text x="80" y="426" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK code      TEXT</text>
  <text x="80" y="446" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   status    TEXT  (active|deprecated)</text>
  <text x="80" y="466" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   attrs     JSONB</text>
  <text x="80" y="486" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   created_at TIMESTAMPTZ</text>
  <text x="80" y="506" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   updated_at TIMESTAMPTZ</text>
  <text x="80" y="538" fill="#e0c375" font-size="10.5" font-weight="600">No surrogate key — natural composite PK.</text>
  <text x="80" y="554" fill="#8b929b" font-size="10.5" font-style="italic">version column was dropped — versioning is</text>
  <text x="80" y="568" fill="#8b929b" font-size="10.5" font-style="italic">set-level only (dictionary_set_versions), not per-row.</text>

  <!-- ================= dictionary_localizations ================= -->
  <rect x="60" y="630" width="400" height="220" rx="8" fill="#1a1e23" stroke="#27c07f" stroke-width="1.5"/>
  <text x="260" y="654" fill="#dee0e3" font-size="14.5" font-weight="700" text-anchor="middle">dictionary_localizations</text>
  <line x1="60" y1="664" x2="460" y2="664" stroke="#2c3138" stroke-width="1"/>
  <text x="80" y="686" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK,FK context  TEXT</text>
  <text x="80" y="706" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK,FK type_key TEXT</text>
  <text x="80" y="726" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK,FK code     TEXT</text>
  <text x="80" y="746" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK locale      TEXT</text>
  <text x="80" y="766" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   label       TEXT</text>
  <text x="80" y="786" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   description TEXT</text>
  <text x="80" y="806" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   source      TEXT  (manual|ai)</text>
  <text x="80" y="826" fill="#8b929b" font-size="10.5" font-style="italic">source="ai" review-gate (BR-D07) not yet enforced</text>

  <!-- ================= dictionary_references ================= -->
  <rect x="520" y="630" width="460" height="220" rx="8" fill="#1a1e23" stroke="#27c07f" stroke-width="1.5"/>
  <text x="750" y="654" fill="#dee0e3" font-size="14.5" font-weight="700" text-anchor="middle">dictionary_references</text>
  <line x1="520" y1="664" x2="980" y2="664" stroke="#2c3138" stroke-width="1"/>
  <text x="540" y="686" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK,FK context       TEXT</text>
  <text x="540" y="706" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK,FK from_type_key TEXT</text>
  <text x="540" y="726" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK,FK from_code     TEXT</text>
  <text x="540" y="746" fill="#8ec4ff" font-size="11.5" font-family="ui-monospace,Menlo,monospace" font-weight="700">PK    relation      TEXT</text>
  <text x="540" y="766" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   FK to_type_key   TEXT</text>
  <text x="540" y="786" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">   FK to_code       TEXT</text>
  <text x="540" y="806" fill="#b7bcc2" font-size="11.5" font-family="ui-monospace,Menlo,monospace">      created_at    TIMESTAMPTZ</text>
  <text x="540" y="826" fill="#8b929b" font-size="10.5" font-style="italic">target type validated against relation's declared type (BR-D05)</text>

  <!-- ================= relationships ================= -->
  <g fill="none">
    <!-- types -> items : cascade-relevant FK, not itself a delete cascade note here -->
    <line x1="230" y1="270" x2="230" y2="328" stroke="#4a515b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="245" y="300" fill="#8b929b" font-size="10.5">1</text>
    <text x="245" y="322" fill="#8b929b" font-size="10.5">*</text>
    <text x="120" y="312" fill="#8b929b" font-size="10" text-anchor="middle">type_key</text>

    <!-- items -> localizations : CASCADES on delete -->
    <line x1="230" y1="570" x2="230" y2="628" stroke="#27c07f" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="245" y="600" fill="#8b929b" font-size="10.5">1</text>
    <text x="245" y="622" fill="#8b929b" font-size="10.5">*</text>
    <text x="325" y="614" fill="#27c07f" font-size="10" font-weight="600" text-anchor="middle">ON DELETE CASCADE</text>

    <!-- items -> references (from side) : CASCADES -->
    <path d="M460,470 C500,470 500,700 518,700" stroke="#27c07f" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="500" y="500" fill="#27c07f" font-size="10" font-weight="600">from — CASCADES</text>

    <!-- items -> references (to side) : NOT cascaded, BR-D02 -->
    <path d="M460,420 C620,420 620,560 620,628" stroke="#9a7b1e" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowWarn)"/>
    <text x="620" y="600" fill="#e0c375" font-size="10" font-weight="600" text-anchor="middle">to — does NOT cascade</text>
    <text x="620" y="614" fill="#e0c375" font-size="10" text-anchor="middle">(blocked by BR-D02 in the domain layer, not the FK)</text>
  </g>

  <!-- ================= legend ================= -->
  <line x1="60" y1="880" x2="1200" y2="880" stroke="#2c3138" stroke-width="1"/>
  <text x="60" y="908" fill="#8b929b" font-size="11.5"><tspan fill="#8ec4ff" font-weight="700">PK</tspan> = primary key column · <tspan fill="#8ec4ff" font-weight="700">FK</tspan> = foreign key · dashed box = standalone table, no formal FK relationship in this schema</text>
  <text x="60" y="930" fill="#8b929b" font-size="11.5"><tspan fill="#27c07f" font-weight="700">green solid arrow</tspan> = delete cascades · <tspan fill="#e0c375" font-weight="700">amber dashed arrow</tspan> = delete does NOT cascade (enforced by a business rule instead)</text>
  <text x="60" y="958" fill="#8b929b" font-size="11" font-style="italic">One physical Postgres instance, schema `refdata` — isolated from the shipping backend's `public` schema; the backend has no access to any table shown here.</text>
  <text x="60" y="980" fill="#8b929b" font-size="11" font-style="italic">Source: refdata-service/internal/postgres/migrate.go — see "3. POC Design and Architecture" for how this schema is read (Postgres direct / REST / NATS KV).</text>
</svg>
