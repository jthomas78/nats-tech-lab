<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="780" viewBox="0 0 1450 780" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <!--UNIFI-ICONS-->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a515b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#27c07f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#006fff"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a7b1e"/>
    </marker>
  </defs>
  <rect width="1450" height="780" fill="#14171b"/>

  <text x="60" y="42" fill="#dee0e3" font-size="24" font-weight="700">Cross-Service Consumption</text>
  <text x="60" y="66" fill="#b7bcc2" font-size="13">How the shipping backend reads refdata-service's data today — read-side only, and less wired-in than it might look</text>
  <line x1="60" y1="84" x2="1390" y2="84" stroke="#2c3138" stroke-width="1"/>

  <!-- ================= column boundaries ================= -->
  <rect x="40" y="130" width="420" height="530" rx="14" fill="none" stroke="#4a515b" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="60" y="118" fill="#8b929b" font-size="12" font-weight="700" letter-spacing="0.4">SHIPPING BACKEND</text>

  <rect x="500" y="130" width="280" height="530" rx="14" fill="none" stroke="#4a515b" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="520" y="118" fill="#8b929b" font-size="12" font-weight="700" letter-spacing="0.4">SHARED NATS SERVER (nats:4222)</text>

  <rect x="820" y="130" width="420" height="530" rx="14" fill="none" stroke="#4a515b" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="850" y="118" fill="#8b929b" font-size="12" font-weight="700" letter-spacing="0.4">REFDATA-SERVICE</text>

  <!-- ================= Shipping backend boxes ================= -->
  <rect x="70" y="160" width="360" height="110" rx="10" fill="#1a1e23" stroke="#4a515b" stroke-width="1.5"/>
  <text x="250" y="188" fill="#dee0e3" font-size="14" font-weight="700" text-anchor="middle">Shape A/B/C query</text>
  <text x="250" y="208" fill="#b7bcc2" font-size="11.5" text-anchor="middle">(read side, reconstruction)</text>
  <text x="250" y="238" fill="#8b929b" font-size="10.5" text-anchor="middle">queries/, eventhandler/ — neither</text>
  <text x="250" y="254" fill="#8b929b" font-size="10.5" text-anchor="middle">package references refdata at all</text>

  <rect x="70" y="440" width="360" height="110" rx="10" fill="#1a1e23" stroke="#8ec4ff" stroke-width="1.6"/>
  <text x="250" y="468" fill="#dee0e3" font-size="14" font-weight="700" text-anchor="middle">refdataconsumer.Lookup</text>
  <text x="250" y="488" fill="#b7bcc2" font-size="11.5" text-anchor="middle">the actual integration point</text>
  <text x="250" y="518" fill="#8b929b" font-size="10.5" text-anchor="middle">exercised only by the standalone demo</text>
  <text x="250" y="534" fill="#8b929b" font-size="10.5" text-anchor="middle">route below — not called by the above</text>

  <line x1="250" y1="270" x2="250" y2="438" stroke="#9a7b1e" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#arrowWarn)"/>
  <rect x="90" y="330" width="320" height="46" rx="8" fill="#1f1a0c" stroke="#9a7b1e" stroke-width="1.3"/>
  <text x="250" y="348" fill="#e0c375" font-size="11" font-weight="700" text-anchor="middle">NOT wired in today — demo route only</text>
  <text x="250" y="364" fill="#e0c375" font-size="10" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">GET /api/refdata-demo/{context}/{type}/{code}</text>

  <!-- ================= NATS column ================= -->
  <rect x="530" y="340" width="240" height="120" rx="10" fill="#132a22" stroke="#27c07f" stroke-width="1.6"/>
  <g color="#fff"><rect x="550" y="358" width="40" height="40" rx="10" fill="#27c07f"/><use href="#ico-kv" x="550" y="358" width="40" height="40"/></g>
  <text x="650" y="378" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">KV bucket</text>
  <text x="650" y="396" fill="#b7bcc2" font-size="11" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">refdata-{context}</text>
  <text x="650" y="436" fill="#8b929b" font-size="10" text-anchor="middle">lives on the NATS server, not inside</text>
  <text x="650" y="450" fill="#8b929b" font-size="10" text-anchor="middle">either process — reachable from both</text>

  <!-- ================= refdata-service boxes ================= -->
  <rect x="850" y="160" width="320" height="110" rx="10" fill="#1a1e23" stroke="#006fff" stroke-width="1.6"/>
  <text x="1010" y="188" fill="#dee0e3" font-size="14" font-weight="700" text-anchor="middle">REST API</text>
  <text x="1010" y="208" fill="#b7bcc2" font-size="11.5" text-anchor="middle">GET /api/refdata/{context}/{type}/{code}</text>
  <text x="1010" y="238" fill="#8b929b" font-size="10.5" text-anchor="middle">what internal/refdataconsumer falls</text>
  <text x="1010" y="254" fill="#8b929b" font-size="10.5" text-anchor="middle">back to on a cache miss</text>

  <rect x="850" y="340" width="320" height="110" rx="10" fill="#1a1e23" stroke="#006fff" stroke-width="1.5"/>
  <text x="1010" y="368" fill="#dee0e3" font-size="14" font-weight="700" text-anchor="middle">kvcache.Projector</text>
  <text x="1010" y="388" fill="#b7bcc2" font-size="11.5" text-anchor="middle">writes on every mutation</text>
  <text x="1010" y="418" fill="#8b929b" font-size="10.5" text-anchor="middle">the only writer of refdata-{context} —</text>
  <text x="1010" y="434" fill="#8b929b" font-size="10.5" text-anchor="middle">shipping backend only ever reads it</text>

  <rect x="850" y="500" width="320" height="130" rx="10" fill="#1a1e23" stroke="#27c07f" stroke-width="1.6"/>
  <g color="#fff"><rect x="870" y="518" width="40" height="40" rx="10" fill="#27c07f"/><use href="#ico-db" x="870" y="518" width="40" height="40"/></g>
  <text x="922" y="538" fill="#dee0e3" font-size="14" font-weight="700">Postgres</text>
  <text x="870" y="562" fill="#b7bcc2" font-size="11.5">refdata schema</text>
  <text x="870" y="590" fill="#e0c375" font-size="10.5" font-weight="600">backend has NO access —</text>
  <text x="870" y="606" fill="#e0c375" font-size="10.5" font-weight="600">genuinely isolated, not just convention</text>

  <!-- ================= arrows ================= -->
  <!-- RC -> KV : cache-hit read -->
  <line x1="430" y1="490" x2="528" y2="420" stroke="#27c07f" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="340" y="400" fill="#27c07f" font-size="10.5" font-weight="600">1: read directly</text>
  <text x="340" y="414" fill="#27c07f" font-size="10.5" font-weight="600">(cache hit — no REST call)</text>

  <!-- RC -> REST : miss/stale fallback, routed via the margin at x=475 to clear the RQ box and KV box -->
  <path d="M430,455 L475,455 L475,215 L848,215" fill="none" stroke="#006fff" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="500" y="205" fill="#8ec4ff" font-size="10.5" font-weight="600">2: miss / stale → REST call</text>

  <!-- REST -> KV : backfills -->
  <line x1="848" y1="245" x2="772" y2="400" stroke="#4a515b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="270" fill="#8b929b" font-size="10" text-anchor="middle">backfills</text>

  <!-- PROJ -> KV : writes -->
  <line x1="848" y1="395" x2="772" y2="395" stroke="#4a515b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="810" y="386" fill="#8b929b" font-size="10" text-anchor="middle">writes</text>

  <!-- REST -> PG : reads/writes, routed via right margin at x=1200 to clear PROJ -->
  <path d="M1170,222 L1200,222 L1200,565 L1172,565" fill="none" stroke="#4a515b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1210" y="395" fill="#8b929b" font-size="10" text-anchor="middle" transform="rotate(90,1210,395)">reads / writes (authoritative)</text>

  <!-- PROJ -> PG : reads -->
  <line x1="1010" y1="450" x2="1010" y2="498" stroke="#4a515b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1050" y="478" fill="#8b929b" font-size="10" text-anchor="middle">reads</text>

  <line x1="60" y1="700" x2="1390" y2="700" stroke="#2c3138" stroke-width="1"/>
  <text x="60" y="726" fill="#8b929b" font-size="11" font-style="italic">Net effect: if reconstruction ever needed a reference-data label, it would be a read-only, KV-first lookup — cheap on a hit, falling through to REST only on a miss or stale version.</text>
  <text x="60" y="750" fill="#8b929b" font-size="11" font-style="italic">There is no NATS-level access control between the two services (no accounts/permissions) — bucket ownership is a codebase convention. Postgres isolation, by contrast, is real.</text>
</svg>
