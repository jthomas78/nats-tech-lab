<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="960" viewBox="0 0 1650 960" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <!--UNIFI-ICONS-->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a7b1e"/>
    </marker>
  </defs>
  <rect width="1650" height="960" fill="#14171b"/>

  <text x="60" y="42" fill="#dee0e3" font-size="24" font-weight="700">Dictionary POC — Use Case Diagram</text>
  <text x="60" y="66" fill="#b7bcc2" font-size="13">Who/what uses the dictionary service, and for what — actors on the left, use cases inside the service boundary</text>
  <line x1="60" y1="84" x2="1590" y2="84" stroke="#2c3138" stroke-width="1"/>

  <!-- ================= system boundary ================= -->
  <rect x="220" y="110" width="1370" height="560" rx="16" fill="none" stroke="#4a515b" stroke-width="1.5"/>
  <text x="244" y="138" fill="#dee0e3" font-size="14.5" font-weight="700">refdata-service — Dictionary-as-a-Service</text>

  <!-- ================= actors (evenly spaced, no overlap) ================= -->
  <g stroke="#b7bcc2" stroke-width="2.2" fill="none" stroke-linecap="round">
    <!-- Dictionary Admin -->
    <circle cx="110" cy="180" r="14" fill="#14171b"/>
    <line x1="110" y1="194" x2="110" y2="224"/>
    <line x1="90" y1="206" x2="130" y2="206"/>
    <line x1="110" y1="224" x2="95" y2="254"/>
    <line x1="110" y1="224" x2="125" y2="254"/>
  </g>
  <text x="110" y="276" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">Dictionary Admin</text>
  <text x="110" y="292" fill="#8b929b" font-size="10" text-anchor="middle">(data steward)</text>

  <g stroke="#b7bcc2" stroke-width="2.2" fill="none" stroke-linecap="round">
    <!-- End User / Frontend viewer -->
    <circle cx="110" cy="330" r="14" fill="#14171b"/>
    <line x1="110" y1="344" x2="110" y2="374"/>
    <line x1="90" y1="356" x2="130" y2="356"/>
    <line x1="110" y1="374" x2="95" y2="404"/>
    <line x1="110" y1="374" x2="125" y2="404"/>
  </g>
  <text x="110" y="426" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">End User</text>
  <text x="110" y="442" fill="#8b929b" font-size="10" text-anchor="middle">(views localized UI)</text>

  <g stroke="#8ec4ff" stroke-width="2.2" fill="none" stroke-linecap="round">
    <!-- Shipping Backend (system actor) -->
    <rect x="88" y="462" width="44" height="34" rx="6"/>
    <line x1="110" y1="496" x2="110" y2="518"/>
    <line x1="95" y1="518" x2="125" y2="518"/>
  </g>
  <text x="110" y="538" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">Shipping Backend</text>
  <text x="110" y="554" fill="#8b929b" font-size="10" text-anchor="middle">(system actor)</text>

  <g stroke="#b7bcc2" stroke-width="2.2" fill="none" stroke-linecap="round">
    <!-- Platform Engineer -->
    <circle cx="110" cy="594" r="14" fill="#14171b"/>
    <line x1="110" y1="608" x2="110" y2="638"/>
    <line x1="90" y1="620" x2="130" y2="620"/>
    <line x1="110" y1="638" x2="95" y2="668"/>
    <line x1="110" y1="638" x2="125" y2="668"/>
  </g>
  <text x="110" y="690" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">Platform Engineer</text>
  <text x="110" y="706" fill="#8b929b" font-size="10" text-anchor="middle">(debugging)</text>

  <g stroke="#e0c375" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4,3">
    <!-- Linebooker CLI (optional actor) -->
    <circle cx="110" cy="750" r="14" fill="#14171b"/>
    <line x1="110" y1="764" x2="110" y2="794"/>
    <line x1="90" y1="776" x2="130" y2="776"/>
    <line x1="110" y1="794" x2="95" y2="824"/>
    <line x1="110" y1="794" x2="125" y2="824"/>
  </g>
  <text x="110" y="846" fill="#dee0e3" font-size="12" font-weight="600" text-anchor="middle">Linebooker CLI</text>
  <rect x="58" y="852" width="104" height="16" rx="8" fill="#3a2e0d" stroke="#9a7b1e" stroke-width="1"/>
  <text x="110" y="863" fill="#e0c375" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.3">OPTIONAL</text>

  <!-- ================= row A: type & item management ================= -->
  <text x="250" y="168" fill="#8b929b" font-size="11" font-weight="700" letter-spacing="0.4">TYPE &amp; ITEM MANAGEMENT</text>
  <rect x="250" y="178" width="310" height="58" rx="24" fill="#1a1e23" stroke="#006fff" stroke-width="1.4"/>
  <text x="405" y="211" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Register dictionary type</text>

  <rect x="580" y="178" width="310" height="58" rx="24" fill="#1a1e23" stroke="#006fff" stroke-width="1.4"/>
  <text x="735" y="203" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Register / deprecate /</text>
  <text x="735" y="220" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">reactivate item</text>

  <rect x="910" y="178" width="310" height="58" rx="24" fill="#1a1e23" stroke="#006fff" stroke-width="1.4"/>
  <text x="1065" y="211" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Patch item attributes</text>

  <rect x="1240" y="178" width="310" height="58" rx="24" fill="#1a1e23" stroke="#006fff" stroke-width="1.4"/>
  <text x="1395" y="203" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Register reference</text>
  <text x="1395" y="220" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">between items</text>

  <!-- ================= row B: localization ================= -->
  <text x="250" y="266" fill="#8b929b" font-size="11" font-weight="700" letter-spacing="0.4">LOCALIZATION</text>
  <rect x="250" y="276" width="420" height="58" rx="24" fill="#1a1e23" stroke="#006fff" stroke-width="1.4"/>
  <text x="460" y="309" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Register locale</text>

  <rect x="690" y="276" width="420" height="58" rx="24" fill="#1a1e23" stroke="#006fff" stroke-width="1.4"/>
  <text x="900" y="309" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Register localization</text>

  <rect x="1130" y="276" width="420" height="58" rx="24" fill="#1a1e23" stroke="#27c07f" stroke-width="1.4"/>
  <text x="1340" y="301" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Resolve label</text>
  <text x="1340" y="318" fill="#8b929b" font-size="10.5" text-anchor="middle">(BR-D03 fallback chain)</text>

  <!-- ================= row C: query & sync ================= -->
  <text x="250" y="364" fill="#8b929b" font-size="11" font-weight="700" letter-spacing="0.4">QUERY &amp; SYNC</text>
  <rect x="250" y="374" width="310" height="58" rx="24" fill="#1a1e23" stroke="#27c07f" stroke-width="1.4"/>
  <text x="405" y="399" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Query item</text>
  <text x="405" y="416" fill="#8b929b" font-size="10.5" text-anchor="middle">(locale + expand)</text>

  <rect x="580" y="374" width="310" height="58" rx="24" fill="#1a1e23" stroke="#4a515b" stroke-width="1.4"/>
  <text x="735" y="399" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Check type</text>
  <text x="735" y="416" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">completeness</text>

  <rect x="910" y="374" width="310" height="58" rx="24" fill="#1a1e23" stroke="#4a515b" stroke-width="1.4"/>
  <text x="1065" y="407" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">View cache-status</text>

  <rect x="1240" y="374" width="310" height="58" rx="24" fill="#1a1e23" stroke="#27c07f" stroke-width="1.4"/>
  <text x="1395" y="399" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Watch live changes</text>
  <text x="1395" y="416" fill="#8b929b" font-size="10.5" text-anchor="middle">(SSE)</text>

  <!-- ================= row D: shipping-backend consumption ================= -->
  <text x="250" y="462" fill="#8b929b" font-size="11" font-weight="700" letter-spacing="0.4">SHIPPING-BACKEND CONSUMPTION (internal/refdataconsumer)</text>
  <rect x="250" y="472" width="645" height="58" rx="24" fill="#1a1e23" stroke="#8ec4ff" stroke-width="1.4"/>
  <text x="572" y="497" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Lookup via KV cache</text>
  <text x="572" y="514" fill="#8b929b" font-size="10.5" text-anchor="middle">(fast path — zero network call on a hit)</text>

  <rect x="915" y="472" width="645" height="58" rx="24" fill="#1a1e23" stroke="#8ec4ff" stroke-width="1.4"/>
  <text x="1237" y="497" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Fallback to REST (+ server-side backfill)</text>
  <text x="1237" y="514" fill="#8b929b" font-size="10.5" text-anchor="middle">on cache miss / version mismatch</text>

  <line x1="915" y1="480" x2="905" y2="480" stroke="#9a7b1e" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="910" y="465" fill="#e0c375" font-size="9.5" text-anchor="middle">«extends»</text>

  <!-- ================= row E: platform debugging ================= -->
  <text x="250" y="560" fill="#8b929b" font-size="11" font-weight="700" letter-spacing="0.4">PLATFORM DEBUGGING</text>
  <rect x="250" y="570" width="645" height="58" rx="24" fill="#1a1e23" stroke="#4a515b" stroke-width="1.4"/>
  <text x="572" y="595" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Inspect KV buckets</text>
  <text x="572" y="612" fill="#8b929b" font-size="10.5" text-anchor="middle">(KV Inspector — bucket browser + live watch)</text>

  <rect x="915" y="570" width="645" height="58" rx="24" fill="#1a1e23" stroke="#4a515b" stroke-width="1.4"/>
  <text x="1237" y="595" fill="#dee0e3" font-size="12.5" font-weight="600" text-anchor="middle">Inspect JetStream streams</text>
  <text x="1237" y="612" fill="#8b929b" font-size="10.5" text-anchor="middle">(stream / consumer introspection)</text>

  <!-- ================= actor connectors (orthogonal: travel above pill rows, drop straight down onto the target) ================= -->
  <g stroke="#4a515b" stroke-width="1.3" fill="none">
    <!-- Dictionary Admin -> row A (safe_y=176, just above pill top 178) -->
    <path d="M132,206 L210,176 L405,176 L405,180"/>
    <path d="M132,206 L210,176 L735,176 L735,180"/>
    <path d="M132,206 L210,176 L1065,176 L1065,180"/>
    <path d="M132,206 L210,176 L1395,176 L1395,180"/>
    <!-- Dictionary Admin -> row B (safe_y=274, just above pill top 276) -->
    <path d="M132,206 L210,274 L460,274 L460,278"/>
    <path d="M132,206 L210,274 L900,274 L900,278"/>

    <!-- End User -> row B (safe_y=274) -->
    <path d="M132,356 L210,274 L1340,274 L1340,278"/>
    <!-- End User -> row C (safe_y=372, just above pill top 374) -->
    <path d="M132,356 L210,372 L405,372 L405,376"/>
    <path d="M132,356 L210,372 L1395,372 L1395,376"/>

    <!-- Shipping Backend -> row D (safe_y=470, just above pill top 472) -->
    <path d="M132,479 L210,470 L572,470 L572,474"/>
    <path d="M132,479 L210,470 L1237,470 L1237,474"/>

    <!-- Platform Engineer -> row C (safe_y=372) -->
    <path d="M132,620 L180,372 L1065,372 L1065,376"/>
    <!-- Platform Engineer -> row E (safe_y=568, just above pill top 570) -->
    <path d="M132,620 L210,568 L572,568 L572,572"/>
    <path d="M132,620 L210,568 L1237,568 L1237,572"/>
  </g>

  <!-- Linebooker CLI (optional) -> row A item mgmt + row C query, dashed to mark optional.
       Routed as a right-angle stub (right, then up at x=200, clear of every other actor icon) rather
       than a long diagonal, since it has to travel past all four other actors' vertical positions. -->
  <g stroke="#9a7b1e" stroke-width="1.3" fill="none" stroke-dasharray="5,3">
    <path d="M132,776 L200,776 L200,176 L735,176 L735,180"/>
    <path d="M132,776 L200,776 L200,372 L405,372 L405,376"/>
  </g>

  <text x="60" y="900" fill="#8b929b" font-size="11" font-style="italic">Blue border = admin write-path · green border = read/sync path · light-blue border = internal service-to-service consumption · grey border = debugging/introspection.</text>
  <text x="60" y="924" fill="#e0c375" font-size="11" font-style="italic">Dashed amber actor + connectors = optional / not yet a confirmed integration (Linebooker CLI).</text>
</svg>
