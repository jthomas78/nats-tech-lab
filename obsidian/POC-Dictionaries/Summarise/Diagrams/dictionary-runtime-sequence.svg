<svg xmlns="http://www.w3.org/2000/svg" width="2120" height="1220" viewBox="0 0 2120 1220" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <!--UNIFI-ICONS-->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b929b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#006fff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#27c07f"/>
    </marker>
  </defs>
  <rect width="2120" height="1220" fill="#14171b"/>

  <text x="60" y="42" fill="#dee0e3" font-size="24" font-weight="700">Shipping UI — Dictionary Read Sequence</text>
  <text x="60" y="66" fill="#b7bcc2" font-size="13">KV-first client reads, REST fallback on a miss or stale entry, and live refresh after a dictionary mutation</text>
  <line x1="60" y1="84" x2="2060" y2="84" stroke="#2c3138" stroke-width="1"/>

  <!-- ================= lifeline headers ================= -->
  <!-- C1=160 Port UI · C2=405 useUiCopy · C3=650 Shipping backend · C4=895 NATS KV · C5=1140 refdata-service · C6=1385 Postgres · C7=1630 SSE watch · C8=1940 Dictionary Admin -->

  <rect x="50" y="100" width="220" height="66" rx="10" fill="#1a1e23" stroke="#006fff" stroke-width="1.5"/>
  <g color="#fff"><rect x="66" y="116" width="34" height="34" rx="8" fill="#006fff"/><use href="#ico-browser" x="66" y="116" width="34" height="34"/></g>
  <text x="170" y="131" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">Port UI</text>
  <text x="170" y="150" fill="#8ec4ff" font-size="10.5" text-anchor="middle">frontend-port</text>

  <rect x="295" y="100" width="220" height="66" rx="10" fill="#1a1e23" stroke="#006fff" stroke-width="1.5"/>
  <g color="#fff"><rect x="311" y="116" width="34" height="34" rx="8" fill="#006fff"/><use href="#ico-cache" x="311" y="116" width="34" height="34"/></g>
  <text x="415" y="131" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">useUiCopy</text>
  <text x="415" y="150" fill="#8ec4ff" font-size="10.5" text-anchor="middle">useRefdataLabels</text>

  <rect x="540" y="100" width="220" height="66" rx="10" fill="#1a1e23" stroke="#006fff" stroke-width="1.5"/>
  <g color="#fff"><rect x="556" y="116" width="34" height="34" rx="8" fill="#006fff"/><use href="#ico-service" x="556" y="116" width="34" height="34"/></g>
  <text x="660" y="131" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">Shipping backend</text>
  <text x="660" y="150" fill="#8ec4ff" font-size="10.5" text-anchor="middle">/api/refdata route</text>

  <rect x="785" y="100" width="220" height="66" rx="10" fill="#132a22" stroke="#27c07f" stroke-width="1.5"/>
  <g color="#fff"><rect x="801" y="116" width="34" height="34" rx="8" fill="#27c07f"/><use href="#ico-kv" x="801" y="116" width="34" height="34"/></g>
  <text x="905" y="131" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">NATS KV</text>
  <text x="905" y="150" fill="#8ec4ff" font-size="10.5" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">refdata-{context}</text>

  <rect x="1030" y="100" width="220" height="66" rx="10" fill="#1a1e23" stroke="#006fff" stroke-width="1.5"/>
  <g color="#fff"><rect x="1046" y="116" width="34" height="34" rx="8" fill="#006fff"/><use href="#ico-service" x="1046" y="116" width="34" height="34"/></g>
  <text x="1150" y="131" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">refdata-service</text>
  <text x="1150" y="150" fill="#8ec4ff" font-size="10.5" text-anchor="middle">REST + projector</text>

  <rect x="1275" y="100" width="220" height="66" rx="10" fill="#132a22" stroke="#27c07f" stroke-width="1.5"/>
  <g color="#fff"><rect x="1291" y="116" width="34" height="34" rx="8" fill="#27c07f"/><use href="#ico-db" x="1291" y="116" width="34" height="34"/></g>
  <text x="1395" y="131" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">Postgres</text>
  <text x="1395" y="150" fill="#8ec4ff" font-size="10.5" text-anchor="middle">refdata schema</text>

  <rect x="1520" y="100" width="220" height="66" rx="10" fill="#1a1e23" stroke="#006fff" stroke-width="1.5"/>
  <g color="#fff"><rect x="1536" y="116" width="34" height="34" rx="8" fill="#006fff"/><use href="#ico-sse" x="1536" y="116" width="34" height="34"/></g>
  <text x="1640" y="131" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">SSE watch</text>
  <text x="1640" y="150" fill="#8ec4ff" font-size="10.5" text-anchor="middle">EventSource</text>

  <rect x="1830" y="100" width="220" height="66" rx="10" fill="#1a1e23" stroke="#9a7b1e" stroke-width="1.5"/>
  <g color="#fff"><rect x="1846" y="116" width="34" height="34" rx="8" fill="#9a7b1e"/><use href="#ico-browser" x="1846" y="116" width="34" height="34"/></g>
  <text x="1950" y="131" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">Dictionary Admin</text>
  <text x="1950" y="150" fill="#c9a54a" font-size="10.5" text-anchor="middle">frontend-dict / API</text>

  <!-- fragment background panels (painted first so lifelines draw on top) -->
  <rect x="40" y="185" width="2040" height="390" rx="14" fill="#181b20" stroke="#4a515b" stroke-width="1.3"/>
  <rect x="40" y="595" width="2040" height="225" rx="14" fill="#1f1a0c" stroke="#9a7b1e" stroke-width="1.3"/>
  <rect x="40" y="840" width="2040" height="280" rx="14" fill="#0f1f18" stroke="#27c07f" stroke-width="1.3"/>

  <!-- lifelines (on top of fragment panels) -->
  <g stroke="#5a6270" stroke-width="1.8" stroke-dasharray="6,5">
    <line x1="160" y1="166" x2="160" y2="1120"/>
    <line x1="405" y1="166" x2="405" y2="1120"/>
    <line x1="650" y1="166" x2="650" y2="1120"/>
    <line x1="895" y1="166" x2="895" y2="1120"/>
    <line x1="1140" y1="166" x2="1140" y2="1120"/>
    <line x1="1385" y1="166" x2="1385" y2="1120"/>
    <line x1="1630" y1="166" x2="1630" y2="1120"/>
    <line x1="1940" y1="166" x2="1940" y2="1120"/>
  </g>

  <!-- ================= fragment 1 ================= -->
  <text x="60" y="208" fill="#8b929b" font-size="12.5" font-weight="700" letter-spacing="0.4">1 · INITIAL LOCALE LOAD / CACHE HIT</text>

  <line x1="160" y1="252" x2="405" y2="252" stroke="#006fff" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="282" y="238" fill="#8ec4ff" font-size="11" text-anchor="middle">01 startup / selectedLocale = en</text>

  <line x1="405" y1="292" x2="650" y2="292" stroke="#8b929b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="527" y="278" fill="#b7bcc2" font-size="11" text-anchor="middle">02 GET /api/refdata/types/ui-copy?locale=en</text>

  <line x1="650" y1="332" x2="895" y2="332" stroke="#27c07f" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="772" y="318" fill="#8fdba8" font-size="11" text-anchor="middle">03 read ui-copy entry + _meta</text>

  <line x1="895" y1="372" x2="650" y2="372" stroke="#8b929b" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="772" y="358" fill="#b7bcc2" font-size="11" text-anchor="middle">04 cache hit · version current</text>

  <line x1="650" y1="412" x2="405" y2="412" stroke="#8b929b" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="527" y="398" fill="#b7bcc2" font-size="11" text-anchor="middle">05 items with localized labels</text>

  <line x1="405" y1="452" x2="160" y2="452" stroke="#8b929b" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="282" y="438" fill="#b7bcc2" font-size="11" text-anchor="middle">06 setLocaleMessage(en, overlay)</text>

  <!-- 07 self-loop at Port UI -->
  <path d="M160,494 L230,494 L230,512 L162,512" fill="none" stroke="#27c07f" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="238" y="497" fill="#8fdba8" font-size="11">07 render live labels over generated fallback</text>

  <text x="60" y="552" fill="#8b929b" font-size="10.5" font-style="italic">The same flow is used for ship-status; the composable changes only the type key and response map.</text>

  <!-- ================= fragment 2 ================= -->
  <text x="60" y="618" fill="#c9a54a" font-size="12.5" font-weight="700" letter-spacing="0.4">2 · CACHE MISS OR STALE ENTRY / REST FALLBACK</text>

  <line x1="650" y1="662" x2="895" y2="662" stroke="#006fff" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="772" y="648" fill="#8ec4ff" font-size="11" text-anchor="middle">08 miss or stale version detected</text>

  <line x1="650" y1="702" x2="1140" y2="702" stroke="#8b929b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="895" y="688" fill="#b7bcc2" font-size="11" text-anchor="middle">09 GET authoritative item list ?locale=en</text>

  <line x1="1140" y1="742" x2="1385" y2="742" stroke="#8b929b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1262" y="728" fill="#b7bcc2" font-size="11" text-anchor="middle">10 resolve label from Postgres</text>

  <line x1="1140" y1="782" x2="895" y2="782" stroke="#27c07f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowGreen)"/>
  <text x="1017" y="768" fill="#8fdba8" font-size="11" text-anchor="middle">11 backfill KV entry + _meta</text>

  <!-- ================= fragment 3 ================= -->
  <text x="60" y="863" fill="#8fdba8" font-size="12.5" font-weight="700" letter-spacing="0.4">3 · DICTIONARY MUTATION / LIVE REFRESH</text>

  <line x1="1940" y1="920" x2="1142" y2="920" stroke="#27c07f" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="1541" y="906" fill="#8fdba8" font-size="11" text-anchor="middle">12 dictionary mutation: ui-copy.es label changed</text>

  <line x1="1140" y1="960" x2="895" y2="960" stroke="#27c07f" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="1017" y="946" fill="#8fdba8" font-size="11" text-anchor="middle">13 project update + publish change pointer</text>

  <line x1="895" y1="1000" x2="1630" y2="1000" stroke="#8b929b" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="1262" y="986" fill="#b7bcc2" font-size="11" text-anchor="middle">kv.Watch() fires — direct KV subscription, not the REFDATA stream</text>

  <line x1="1630" y1="1044" x2="160" y2="1044" stroke="#006fff" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="895" y="1030" fill="#8ec4ff" font-size="11" text-anchor="middle">14 SSE signal → refetch active locale</text>

  <line x1="60" y1="1150" x2="2060" y2="1150" stroke="#2c3138" stroke-width="1"/>
  <text x="60" y="1176" fill="#8b929b" font-size="11" font-style="italic">Blue = client-boundary trigger · green = KV/cache path (writes, cache hits, projector) · grey dashed = return values / fallback detection.</text>
  <text x="60" y="1198" fill="#8b929b" font-size="11" font-style="italic">Redrawn from refdata-service/ARCHITECTURE-DICTIONARY.md's "Runtime sequence" (originally a Draw.io export) — message numbering (01–14) preserved for cross-reference.</text>
</svg>
