<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <!--UNIFI-ICONS-->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b929b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#006fff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#27c07f"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#14171b"/>

  <!-- Title -->
  <text x="600" y="46" fill="#dee0e3" font-size="26" font-weight="700" text-anchor="middle">Event Sourcing + CQRS</text>
  <text x="600" y="72" fill="#b7bcc2" font-size="12" text-anchor="middle">Command–Query Responsibility Segregation with an append-only event log</text>

  <!-- Vertical divider -->
  <line x1="600" y1="100" x2="600" y2="820" stroke="#2c3138" stroke-width="1.5" stroke-dasharray="8,6"/>

  <!-- Command / Queries labels -->
  <text x="300" y="860" fill="#8ec4ff" font-size="16" font-weight="700" text-anchor="middle">Command</text>
  <text x="900" y="860" fill="#8fdba8" font-size="16" font-weight="700" text-anchor="middle">Queries</text>

  <!-- ===== LEFT ACTOR: Command user ===== -->
  <rect x="60" y="108" width="140" height="70" rx="10" fill="#1a1e23" stroke="#006fff" stroke-width="1.5"/>
  <g color="#fff"><rect x="76" y="120" width="28" height="28" rx="6" fill="#006fff"/><use href="#ico-browser" x="76" y="120" width="28" height="28"/></g>
  <text x="140" y="140" fill="#dee0e3" font-size="11" font-weight="700" text-anchor="middle">User</text>
  <text x="140" y="155" fill="#8ec4ff" font-size="9" text-anchor="middle">Create / Update / Delete</text>

  <!-- ===== RIGHT ACTOR: Query user ===== -->
  <rect x="1000" y="108" width="140" height="70" rx="10" fill="#1a1e23" stroke="#27c07f" stroke-width="1.5"/>
  <g color="#fff"><rect x="1016" y="120" width="28" height="28" rx="6" fill="#27c07f"/><use href="#ico-browser" x="1016" y="120" width="28" height="28"/></g>
  <text x="1070" y="140" fill="#dee0e3" font-size="11" font-weight="700" text-anchor="middle">User</text>
  <text x="1070" y="155" fill="#8fdba8" font-size="9" text-anchor="middle">Get / Query</text>

  <!-- ===== API (center) ===== -->
  <rect x="490" y="120" width="220" height="56" rx="10" fill="#1a1e23" stroke="#006fff" stroke-width="1.5"/>
  <g color="#fff"><rect x="506" y="132" width="32" height="32" rx="7" fill="#006fff"/><use href="#ico-service" x="506" y="132" width="32" height="32"/></g>
  <text x="610" y="150" fill="#dee0e3" font-size="14" font-weight="700" text-anchor="middle">API</text>
  <text x="610" y="166" fill="#8ec4ff" font-size="9.5" text-anchor="middle">REST / gRPC endpoint</text>

  <!-- Actor → API arrows -->
  <line x1="200" y1="143" x2="488" y2="143" stroke="#006fff" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <line x1="998" y1="143" x2="712" y2="143" stroke="#27c07f" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <!-- ===== COMMAND SIDE ===== -->

  <!-- Command Processor -->
  <rect x="190" y="270" width="220" height="70" rx="10" fill="#1a1e23" stroke="#006fff" stroke-width="1.5"/>
  <g color="#fff"><rect x="206" y="286" width="28" height="28" rx="6" fill="#006fff"/><use href="#ico-service" x="206" y="286" width="28" height="28"/></g>
  <text x="310" y="302" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">Command Processor</text>
  <text x="310" y="320" fill="#8ec4ff" font-size="9.5" text-anchor="middle">Validates + applies business logic</text>

  <!-- API → Command Processor -->
  <line x1="540" y1="176" x2="540" y2="220" stroke="#8b929b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="540" y1="220" x2="310" y2="220" stroke="#8b929b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="310" y1="220" x2="310" y2="268" stroke="#006fff" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- Write Model -->
  <rect x="190" y="400" width="220" height="70" rx="10" fill="#1a1e23" stroke="#006fff" stroke-width="1.5"/>
  <g color="#fff"><rect x="206" y="416" width="28" height="28" rx="6" fill="#006fff"/><use href="#ico-db" x="206" y="416" width="28" height="28"/></g>
  <text x="310" y="432" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">Write Model</text>
  <text x="310" y="450" fill="#8ec4ff" font-size="9.5" text-anchor="middle">Domain aggregates / state</text>

  <!-- Command Processor → Write Model -->
  <line x1="300" y1="340" x2="300" y2="398" stroke="#006fff" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- Event Log -->
  <rect x="170" y="560" width="180" height="80" rx="14" fill="#132a22" stroke="#27c07f" stroke-width="1.5"/>
  <g color="#fff"><rect x="186" y="578" width="32" height="32" rx="7" fill="#27c07f"/><use href="#ico-stream" x="186" y="578" width="32" height="32"/></g>
  <text x="280" y="596" fill="#dee0e3" font-size="14" font-weight="700" text-anchor="middle">Event Log</text>
  <text x="280" y="616" fill="#8fdba8" font-size="9.5" text-anchor="middle">JetStream (append-only)</text>
  <text x="280" y="632" fill="#8b929b" font-size="8.5" text-anchor="middle">Immutable system of record</text>

  <!-- Write Model → Event Log -->
  <line x1="300" y1="470" x2="300" y2="558" stroke="#006fff" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="310" y="520" fill="#8ec4ff" font-size="9.5">emit events</text>

  <!-- Queue / Message Bus -->
  <rect x="460" y="680" width="280" height="60" rx="30" fill="#132a22" stroke="#27c07f" stroke-width="1.5"/>
  <g color="#fff"><rect x="486" y="694" width="28" height="28" rx="6" fill="#27c07f"/><use href="#ico-nats" x="486" y="694" width="28" height="28"/></g>
  <text x="610" y="710" fill="#dee0e3" font-size="14" font-weight="700" text-anchor="middle">Message Bus</text>
  <text x="610" y="726" fill="#8fdba8" font-size="9.5" text-anchor="middle">NATS JetStream consumers</text>

  <!-- Event Log → Queue -->
  <line x1="350" y1="620" x2="460" y2="700" stroke="#27c07f" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="370" y="660" fill="#8fdba8" font-size="9.5">publish</text>

  <!-- ===== QUERY SIDE ===== -->

  <!-- Query Processor -->
  <rect x="790" y="270" width="220" height="70" rx="10" fill="#1a1e23" stroke="#27c07f" stroke-width="1.5"/>
  <g color="#fff"><rect x="806" y="286" width="28" height="28" rx="6" fill="#27c07f"/><use href="#ico-service" x="806" y="286" width="28" height="28"/></g>
  <text x="910" y="302" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">Query Processor</text>
  <text x="910" y="320" fill="#8fdba8" font-size="9.5" text-anchor="middle">Reads from materialized views</text>

  <!-- API → Query Processor -->
  <line x1="660" y1="176" x2="660" y2="220" stroke="#8b929b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="660" y1="220" x2="900" y2="220" stroke="#8b929b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="900" y1="220" x2="900" y2="268" stroke="#27c07f" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <!-- Read Model -->
  <rect x="790" y="400" width="220" height="70" rx="10" fill="#1a1e23" stroke="#27c07f" stroke-width="1.5"/>
  <g color="#fff"><rect x="806" y="416" width="28" height="28" rx="6" fill="#27c07f"/><use href="#ico-cache" x="806" y="416" width="28" height="28"/></g>
  <text x="910" y="432" fill="#dee0e3" font-size="13" font-weight="700" text-anchor="middle">Read Model</text>
  <text x="910" y="450" fill="#8fdba8" font-size="9.5" text-anchor="middle">Projections / denormalized views</text>

  <!-- Query Processor → Read Model -->
  <line x1="900" y1="340" x2="900" y2="398" stroke="#27c07f" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <!-- View Store -->
  <rect x="830" y="560" width="180" height="80" rx="14" fill="#132a22" stroke="#27c07f" stroke-width="1.5"/>
  <g color="#fff"><rect x="846" y="578" width="32" height="32" rx="7" fill="#27c07f"/><use href="#ico-kv" x="846" y="578" width="32" height="32"/></g>
  <text x="940" y="596" fill="#dee0e3" font-size="14" font-weight="700" text-anchor="middle">View Store</text>
  <text x="940" y="616" fill="#8fdba8" font-size="9.5" text-anchor="middle">NATS KV / Postgres</text>
  <text x="940" y="632" fill="#8b929b" font-size="8.5" text-anchor="middle">Optimised for reads</text>

  <!-- Read Model → View Store -->
  <line x1="900" y1="470" x2="900" y2="558" stroke="#27c07f" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="910" y="520" fill="#8fdba8" font-size="9.5">query</text>

  <!-- Queue → View Store (projection) -->
  <line x1="740" y1="700" x2="920" y2="642" stroke="#27c07f" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="850" y="686" fill="#8fdba8" font-size="9.5">project</text>

  <!-- ===== LEGEND ===== -->
  <line x1="60" y1="820" x2="1140" y2="820" stroke="#2c3138" stroke-width="1"/>
  <rect x="60" y="836" width="12" height="12" rx="3" fill="#006fff"/>
  <text x="80" y="847" fill="#8ec4ff" font-size="10">Command path (writes)</text>
  <rect x="240" y="836" width="12" height="12" rx="3" fill="#27c07f"/>
  <text x="260" y="847" fill="#8fdba8" font-size="10">Query path (reads) + event infrastructure</text>
  <line x1="500" y1="842" x2="540" y2="842" stroke="#8b929b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="550" y="847" fill="#8b929b" font-size="10">Routing / dispatch</text>
</svg>
