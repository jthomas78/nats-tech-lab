<svg xmlns="http://www.w3.org/2000/svg" width="880" height="872" viewBox="0 0 880 872" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <!--
    UniFi-theme icon library for architecture diagrams (dark theme).
    Each icon is a 72x72 symbol element drawn in currentColor line art, so the
    consuming tile controls the glyph colour (set white on a coloured tile).
    This file is BOTH the canonical source and a visual index — open it to
    browse the set.

    Reuse: diagram SVGs place the marker UNIFI-ICONS (as an XML comment) inside
    their defs block and reference glyphs by id; render-diagram.sh inlines the
    symbols below into that marker at build time. Convention: accent-blue tile
    (#006fff) for UI/compute, green (#27c07f) for stateful data stores.
  -->
  <defs>
    <!-- frontend / browser window -->
    <symbol id="ico-browser" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">
      <rect x="15" y="20" width="42" height="32" rx="4"/>
      <line x1="15" y1="29" x2="57" y2="29"/>
      <circle cx="22" cy="24.5" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="28" cy="24.5" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="34" cy="24.5" r="1.5" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- backend service / hexagon container -->
    <symbol id="ico-service" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">
      <path d="M36 13 L55 24 L55 46 L36 57 L17 46 L17 24 Z"/>
      <rect x="29" y="28" width="14" height="14" rx="3" stroke-width="2.4"/>
      <line x1="36" y1="42" x2="36" y2="49" stroke-width="2.4"/>
    </symbol>

    <!-- NATS / message mesh -->
    <symbol id="ico-nats" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
      <line x1="25" y1="27" x2="47" y2="27"/>
      <line x1="25" y1="27" x2="36" y2="48"/>
      <line x1="47" y1="27" x2="36" y2="48"/>
      <circle cx="25" cy="27" r="6"/>
      <circle cx="47" cy="27" r="6"/>
      <circle cx="36" cy="48" r="6"/>
      <circle cx="25" cy="27" r="2" fill="currentColor" stroke="none"/>
      <circle cx="47" cy="27" r="2" fill="currentColor" stroke="none"/>
      <circle cx="36" cy="48" r="2" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- database / Postgres cylinder -->
    <symbol id="ico-db" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">
      <ellipse cx="36" cy="22" rx="15" ry="6"/>
      <path d="M21 22 L21 50 A15 6 0 0 0 51 50 L51 22"/>
      <path d="M21 36 A15 6 0 0 0 51 36" stroke-width="2.2"/>
    </symbol>

    <!-- key-value / lookup map -->
    <symbol id="ico-kv" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <rect x="18" y="24" width="6" height="6" rx="1.5" fill="currentColor" stroke="none"/>
      <line x1="30" y1="27" x2="54" y2="27"/>
      <rect x="18" y="34" width="6" height="6" rx="1.5" fill="currentColor" stroke="none"/>
      <line x1="30" y1="37" x2="54" y2="37"/>
      <rect x="18" y="44" width="6" height="6" rx="1.5" fill="currentColor" stroke="none"/>
      <line x1="30" y1="47" x2="48" y2="47"/>
    </symbol>

    <!-- event stream -->
    <symbol id="ico-stream" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="16" y1="36" x2="48" y2="36"/>
      <path d="M46 30 L54 36 L46 42"/>
      <circle cx="22" cy="36" r="2" fill="currentColor" stroke="none"/>
      <circle cx="31" cy="36" r="2" fill="currentColor" stroke="none"/>
      <circle cx="40" cy="36" r="2" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- cache / fast path -->
    <symbol id="ico-cache" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
      <path d="M39 15 L25 40 L35 40 L32 57 L48 31 L38 31 Z" stroke-linecap="round"/>
    </symbol>

    <!-- SSE / live broadcast -->
    <symbol id="ico-sse" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <circle cx="25" cy="47" r="3" fill="currentColor" stroke="none"/>
      <path d="M25 38 A9 9 0 0 1 34 47"/>
      <path d="M25 30 A17 17 0 0 1 42 47"/>
      <path d="M25 22 A25 25 0 0 1 50 47"/>
    </symbol>

    <!-- Docker container / isometric microservice box -->
    <symbol id="ico-container" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
      <path d="M18 26 L36 16 L54 26 L36 36 Z"/>
      <path d="M18 26 L36 36 L36 58 L18 48 Z"/>
      <path d="M54 26 L36 36 L36 58 L54 48 Z"/>
      <line x1="18" y1="26" x2="18" y2="48" stroke-width="2.2"/>
      <line x1="54" y1="26" x2="54" y2="48" stroke-width="2.2"/>
    </symbol>

    <!-- person / actor -->
    <symbol id="ico-actor" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="36" cy="24" r="9"/>
      <path d="M18 58 C18 44.5 25.6 38 36 38 C46.4 38 54 44.5 54 58"/>
    </symbol>

    <!-- persisted volume / disk -->
    <symbol id="ico-volume" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round">
      <rect x="19" y="17" width="34" height="38" rx="6"/>
      <circle cx="36" cy="28" r="4.5"/>
      <line x1="27" y1="41" x2="45" y2="41" stroke-width="2.2"/>
      <line x1="27" y1="47" x2="45" y2="47" stroke-width="2.2"/>
    </symbol>
  </defs>

  <!-- ================= visual index ================= -->
  <rect width="880" height="872" fill="#14171b"/>
  <text x="48" y="54" fill="#dee0e3" font-size="26" font-weight="700">UniFi diagram icons</text>
  <text x="48" y="82" fill="#b7bcc2" font-size="14">shared/unifi-theme/icons.svg · currentColor line art · eleven 72×72 symbols</text>
  <line x1="48" y1="106" x2="832" y2="106" stroke="#2c3138" stroke-width="1"/>

  <!-- component cards: 4 cols x 2 rows -->
  <!-- row 1 -->
  <g color="#fff">
    <rect x="48"  y="140" width="178" height="148" rx="14" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="101" y="160" width="72" height="72" rx="14" fill="#006fff"/><use href="#ico-browser" x="101" y="160" width="72" height="72"/>
    <rect x="250" y="140" width="178" height="148" rx="14" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="303" y="160" width="72" height="72" rx="14" fill="#006fff"/><use href="#ico-service" x="303" y="160" width="72" height="72"/>
    <rect x="452" y="140" width="178" height="148" rx="14" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="505" y="160" width="72" height="72" rx="14" fill="#27c07f"/><use href="#ico-nats"    x="505" y="160" width="72" height="72"/>
    <rect x="654" y="140" width="178" height="148" rx="14" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="707" y="160" width="72" height="72" rx="14" fill="#27c07f"/><use href="#ico-db"      x="707" y="160" width="72" height="72"/>
  </g>
  <text x="137" y="256" fill="#dee0e3" font-size="14" font-weight="600" text-anchor="middle">ico-browser</text>
  <text x="339" y="256" fill="#dee0e3" font-size="14" font-weight="600" text-anchor="middle">ico-service</text>
  <text x="541" y="256" fill="#dee0e3" font-size="14" font-weight="600" text-anchor="middle">ico-nats</text>
  <text x="743" y="256" fill="#dee0e3" font-size="14" font-weight="600" text-anchor="middle">ico-db</text>
  <text x="137" y="276" fill="#8b929b" font-size="11.5" text-anchor="middle">frontend</text>
  <text x="339" y="276" fill="#8b929b" font-size="11.5" text-anchor="middle">Go service</text>
  <text x="541" y="276" fill="#8b929b" font-size="11.5" text-anchor="middle">message mesh</text>
  <text x="743" y="276" fill="#8b929b" font-size="11.5" text-anchor="middle">database</text>

  <!-- row 2 -->
  <g color="#fff">
    <rect x="48"  y="308" width="178" height="148" rx="14" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="101" y="328" width="72" height="72" rx="14" fill="#006fff"/><use href="#ico-kv"     x="101" y="328" width="72" height="72"/>
    <rect x="250" y="308" width="178" height="148" rx="14" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="303" y="328" width="72" height="72" rx="14" fill="#006fff"/><use href="#ico-stream" x="303" y="328" width="72" height="72"/>
    <rect x="452" y="308" width="178" height="148" rx="14" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="505" y="328" width="72" height="72" rx="14" fill="#006fff"/><use href="#ico-cache"  x="505" y="328" width="72" height="72"/>
    <rect x="654" y="308" width="178" height="148" rx="14" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="707" y="328" width="72" height="72" rx="14" fill="#006fff"/><use href="#ico-sse"    x="707" y="328" width="72" height="72"/>
  </g>
  <text x="137" y="424" fill="#dee0e3" font-size="14" font-weight="600" text-anchor="middle">ico-kv</text>
  <text x="339" y="424" fill="#dee0e3" font-size="14" font-weight="600" text-anchor="middle">ico-stream</text>
  <text x="541" y="424" fill="#dee0e3" font-size="14" font-weight="600" text-anchor="middle">ico-cache</text>
  <text x="743" y="424" fill="#dee0e3" font-size="14" font-weight="600" text-anchor="middle">ico-sse</text>
  <text x="137" y="444" fill="#8b929b" font-size="11.5" text-anchor="middle">key-value</text>
  <text x="339" y="444" fill="#8b929b" font-size="11.5" text-anchor="middle">event stream</text>
  <text x="541" y="444" fill="#8b929b" font-size="11.5" text-anchor="middle">cache</text>
  <text x="743" y="444" fill="#8b929b" font-size="11.5" text-anchor="middle">SSE / live</text>

  <!-- row 3 -->
  <g color="#fff">
    <rect x="48"  y="476" width="178" height="148" rx="14" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="101" y="496" width="72" height="72" rx="14" fill="#006fff"/><use href="#ico-container" x="101" y="496" width="72" height="72"/>
    <rect x="250" y="476" width="178" height="148" rx="14" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="303" y="496" width="72" height="72" rx="14" fill="#8b929b"/><use href="#ico-actor"     x="303" y="496" width="72" height="72"/>
    <rect x="452" y="476" width="178" height="148" rx="14" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="505" y="496" width="72" height="72" rx="14" fill="#27c07f"/><use href="#ico-volume"    x="505" y="496" width="72" height="72"/>
  </g>
  <text x="137" y="592" fill="#dee0e3" font-size="14" font-weight="600" text-anchor="middle">ico-container</text>
  <text x="339" y="592" fill="#dee0e3" font-size="14" font-weight="600" text-anchor="middle">ico-actor</text>
  <text x="541" y="592" fill="#dee0e3" font-size="14" font-weight="600" text-anchor="middle">ico-volume</text>
  <text x="137" y="612" fill="#8b929b" font-size="11.5" text-anchor="middle">Docker container</text>
  <text x="339" y="612" fill="#8b929b" font-size="11.5" text-anchor="middle">person / user</text>
  <text x="541" y="612" fill="#8b929b" font-size="11.5" text-anchor="middle">persisted volume</text>

  <!-- usage -->
  <text x="48" y="684" fill="#dee0e3" font-size="15" font-weight="600">Usage</text>
  <text x="48" y="708" fill="#8b929b" font-size="12.5">Set the tile fill; the glyph inherits white from the wrapping group's <tspan font-family="ui-monospace, Menlo, monospace" fill="#b7bcc2">color</tspan>.</text>
  <rect x="48" y="724" width="784" height="46" rx="8" fill="#0f1216" stroke="#2c3138" stroke-width="1"/>
  <text x="66" y="752" fill="#b7bcc2" font-size="12.5" font-family="ui-monospace, Menlo, monospace">&lt;g color="#fff"&gt;&lt;rect … fill="#006fff"/&gt;&lt;use href="#ico-browser" width="72" height="72"/&gt;&lt;/g&gt;</text>
  <text x="48" y="806" fill="#8b929b" font-size="12.5">Tile colour convention: <tspan fill="#4d9bff" font-weight="600">#006fff</tspan> for UI / compute · <tspan fill="#27c07f" font-weight="600">#27c07f</tspan> for stateful data stores.</text>
  <text x="48" y="828" fill="#8b929b" font-size="12.5">ico-container = Docker microservice tile (isometric box) · ico-actor = neutral grey <tspan fill="#dee0e3" font-weight="600">#8b929b</tspan> tile · ico-volume = persisted mount, styled dashed when drawn.</text>
</svg>
