# Demo 07, exercise 01 — one bare nats-server in operator mode.
#
# This file lists NO user and NO authorization block. Who may connect is
# decided by the operator -> account -> user chain, and for account AUTH by
# the auth callout service named in AUTH's account JWT (nsc edit authcallout).
#
# .run/trust.conf is generated by `lab/nsc.sh generate config --nats-resolver`.
# It holds the operator JWT, system_account and the full resolver. Its
# resolver dir './jwt' is relative to the working directory, so lab/up.sh
# starts the server from .run/.

server_name: d07-server
listen: 127.0.0.1:4822
http: 127.0.0.1:8822

include ../../.run/trust.conf
