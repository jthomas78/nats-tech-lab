services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    # Host ports are remapped (14222/18222) because dev machines often
    # already run a NATS on the default 4222. The backend talks to NATS over
    # the compose network (nats:4222), so these mappings are only for
    # debugging from the host (e.g. the nats CLI).
    ports:
      - "14222:4222"
      - "18222:8222" # monitoring
    networks:
      - backend
    volumes:
      - nats-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dict
      POSTGRES_PASSWORD: dict
      POSTGRES_DB: dictionary
    # Remapped for the same reason as NATS: avoid clashing with a local
    # Postgres. The backend uses the compose-internal postgres:5432.
    ports:
      - "15432:5432"
    networks:
      - backend
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dict -d dictionary"]
      interval: 2s
      timeout: 2s
      retries: 15

  shipping-service:
    build: ./backend/shipping-service
    networks:
      - backend
      - frontend
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://dict:dict@postgres:5432/dictionary?sslmode=disable
      HTTP_ADDR: ":8080"
      # Phase 11.3 cross-service consumer demo (/api/refdata-demo/...) —
      # only hit on a KV cache miss/stale entry; the compose-internal address,
      # not the host-mapped 18081.
      REFDATA_SERVICE_URL: http://refdata-service:8080
    ports:
      - "18080:8080"
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  refdata-service:
    build: ./backend/refdata-service
    networks:
      - backend
      - frontend
    environment:
      # Same Postgres instance/database as `shipping-service`, own `refdata`
      # schema — no shared tables (Phase 11, Dictionary-Service-Plan.md).
      DATABASE_URL: postgres://dict:dict@postgres:5432/dictionary?sslmode=disable
      # Same NATS server as `shipping-service` — used only for the KV cache
      # (refdata-{context}) and the bounded REFDATA change-event stream,
      # never as this service's source of truth (Q6).
      NATS_URL: nats://nats:4222
      HTTP_ADDR: ":8080"
    ports:
      - "18081:8080"
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  admin:
    build:
      # Context is the repo root so the build can copy the shared UniFi
      # theme preset (shared/unifi-theme) alongside the app source.
      context: ../..
      dockerfile: demos/01-dictionary/frontend/admin/Dockerfile
    ports:
      - "5173:80"
    networks:
      - frontend
    depends_on:
      - shipping-service

  seafreight-app:
    build:
      context: ../..
      dockerfile: demos/01-dictionary/frontend/seafreight-app/Dockerfile
    ports:
      - "5174:80"
    networks:
      - frontend
    depends_on:
      - shipping-service

  refdata:
    build:
      context: ../..
      dockerfile: demos/01-dictionary/frontend/refdata/Dockerfile
    ports:
      - "5175:80"
    networks:
      - frontend
    depends_on:
      - refdata-service

networks:
  # Trust-tier split (not per-service-pair): anything needing NATS/Postgres
  # joins `backend`; anything the browser talks to joins `frontend`.
  # shipping-service/refdata-service straddle both — they're the only bridge
  # point, so frontend apps can reach them but never nats/postgres directly.
  backend:
  frontend:

volumes:
  nats-data:
  pg-data:
