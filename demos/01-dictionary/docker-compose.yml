      - ./nats/keys/publisher-example-plugin-slow.nk:/etc/plugin/signing.nk:ro
      - ../../lab-shell/plugins/example-plugin-slow/public/manifest.json:/etc/plugin/manifest.json:ro
      - example-plugin-slow-release:/var/lib/announcer
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
      mfe-registry-service:
        condition: service_started
      # Decision 6's boot gate. Starting before the trust table exists earns
