  # The application shell (lab-shell/) — the micro-frontend host. Its two
  # nginx routes are the whole of its backend surface: the single exact
  # /api/auth/shellConnectInfo mint route and the /nats WebSocket. It has no
  # general /api/ rule, because the shell's registry read moved onto NATS in
