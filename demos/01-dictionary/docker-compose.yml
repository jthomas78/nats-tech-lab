name: poc

services:
  nats:
    image: nats:2.14.3-alpine3.22
    container_name: lb-nats
    # nats-server runs as root and creates log_file at 0640 by default —
    # unreadable by shipping-service's own container, which deliberately
    # runs as a non-root, non-root-group user (see its Dockerfile) rather
    # than being loosened to read this one file. Pre-creating the file at
    # 0644 before nats-server starts sidesteps that: nats-server opens an
    # existing log file for append without resetting its mode.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /logs && touch /logs/nats.log && chmod 644 /logs/nats.log && exec nats-server -c /etc/nats/nats.conf
    ports:
      - "4222:4222"
      - "8222:8222" # monitoring
      - "9222:9222" # websocket (nats-ui, under review)
    networks:
      - backend
    volumes:
      - nats-data:/data
      - nats-logs:/logs
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - ./nats/operator.jwt:/etc/nats/operator.jwt:ro

  postgres:
    image: postgres:16-alpine
    container_name: lb-shipping-postgres
    environment:
      POSTGRES_USER: dict
      POSTGRES_PASSWORD: dict
      POSTGRES_DB: dictionary
    ports:
      - "5432:5432"
    networks:
      - backend
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dict -d dictionary"]
      interval: 2s
      timeout: 2s
      retries: 15

  # refdata-service's own Postgres instance — deliberately separate from
  # `postgres` above (not just a private schema on it) so refdata-service has
  # no shared infrastructure with shipping-service beyond NATS, matching the
  # database-per-service isolation level (BR-D28 already made backend-to-
  # backend *calls* NATS-only; this closes the remaining shared-datastore gap
  # — see Dictionary-Service-Plan.md Q1).
  refdata-postgres:
    image: postgres:16-alpine
    container_name: lb-refdata-postgres
    environment:
      POSTGRES_USER: refdata
      POSTGRES_PASSWORD: refdata
      POSTGRES_DB: refdata
    ports:
      - "5433:5432"
    networks:
      - backend
    volumes:
      - pg-refdata-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refdata -d refdata"]
      interval: 2s
      timeout: 2s
      retries: 15

  # accounts-service's own Postgres instance (Phase 14b) — same
  # database-per-service isolation as refdata-postgres above; stores account
  # metadata (name, public key, JetStream limits), never NATS credentials'
  # private seeds for the three pre-existing accounts (those are seeded
  # read-only from nats/resolver/*.jwt at startup, see cmd/main.go).
  accounts-postgres:
    image: postgres:16-alpine
    container_name: lb-accounts-postgres
    environment:
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: accounts
      POSTGRES_DB: accounts
    ports:
      - "5434:5432"
    networks:
      - backend
    volumes:
      - pg-accounts-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts -d accounts"]
      interval: 2s
      timeout: 2s
      retries: 15

  # pricing-service's own Postgres instance (Phase 25) — same
  # database-per-service isolation as refdata-postgres/accounts-postgres.
  # This domain is write-adjacent in the source system it was ported from
  # (unlike refdata-service's read-only boundary), so it gets the same
  # isolated datastore rigor rather than a shared schema.
  pricing-postgres:
    image: postgres:16-alpine
    container_name: lb-pricing-postgres
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
      POSTGRES_DB: pricing
    ports:
      - "5435:5432"
    networks:
      - backend
    volumes:
      - pg-pricing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing"]
      interval: 2s
      timeout: 2s
      retries: 15

  # trading-partner-service's own Postgres instance (Phase 26) — same
  # database-per-service isolation as refdata-postgres/accounts-postgres/
  # pricing-postgres.
  trading-partner-postgres:
    image: postgres:16-alpine
    container_name: lb-trading-partner-postgres
    environment:
      POSTGRES_USER: trading_partner
      POSTGRES_PASSWORD: trading_partner
      POSTGRES_DB: trading_partner
    ports:
      - "5436:5432"
    networks:
      - backend
    volumes:
      - pg-trading-partner-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_partner -d trading_partner"]
      interval: 2s
      timeout: 2s
      retries: 15

  shipping-service:
    build:
      # Phase 35: context is the repo root so the build can copy
      # shared/natstrace alongside the service source (same pattern the
      # frontend build blocks already use for shared/unifi-theme).
      context: ../..
      dockerfile: demos/01-dictionary/backend/shipping-service/Dockerfile
    container_name: lb-shipping-service
    networks:
      - backend
      - frontend
    environment:
      NATS_URL: nats://nats:4222
      # Phase 14a — operator mode: every tenant account is now a .creds file,
      # not a bare user/password. NATS_CREDS_DIR is the directory
      # rest.Handlers.SwitchTenant scans for <tenant>.creds files.
      NATS_CREDS_DIR: /etc/nats/creds
      NATS_ADMIN_CREDS_PATH: /etc/nats/creds/shipping-admin.creds
      DATABASE_URL: postgres://dict:dict@postgres:5432/dictionary?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "7200:8080"
    volumes:
      - ./nats/creds:/etc/nats/creds:ro
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  refdata-service:
    build:
      # Phase 35: context is the repo root so the build can copy
      # shared/natstrace alongside the service source (same pattern the
      # frontend build blocks already use for shared/unifi-theme).
      context: ../..
      dockerfile: demos/01-dictionary/backend/refdata-service/Dockerfile
    container_name: lb-refdata-service
    networks:
      - backend
      - frontend
    environment:
      # Own Postgres instance (`refdata-postgres`, not `postgres`) — no
      # datastore of any kind is shared with `shipping-service` (Phase 11,
      # Dictionary-Service-Plan.md; isolation tightened per the Q1 follow-up
      # decision to go database-per-service rather than schema-per-service).
      DATABASE_URL: postgres://refdata:refdata@refdata-postgres:5432/refdata?sslmode=disable
      # Same NATS server as `shipping-service` — used only for the KV cache
      # (refdata-{context}) and the bounded REFDATA change-event stream,
      # never as this service's source of truth (Q6).
      NATS_URL: nats://nats:4222
      # Phase 14a — refdata-service's rpc.* adapter is cross-tenant
      # (BR-D08), so it always connects as PLATFORM, never a per-tenant
      # account, over this one connection.
      NATS_CREDS_PATH: /etc/nats/creds/platform.creds
      # Phase 32 (BR-D40) — additive per-tenant connections for the new
      # api.* surface: one NATS connection per known tenant, discovered from
      # the same shared creds directory pricing-service/trading-partner-service
      # already read (read-only here — refdata-service never mints creds
      # itself).
      NATS_CREDS_DIR: /etc/nats/creds
      HTTP_ADDR: ":8080"
    ports:
      - "7201:8080"
    volumes:
      - ./nats/creds:/etc/nats/creds:ro
    depends_on:
      nats:
        condition: service_started
      refdata-postgres:
        condition: service_healthy

  # Phase 14b — mints/revokes NATS accounts at runtime via decentralized
  # JWTs (accounts/provisioner.go), replacing nats/bootstrap-operator.sh's
  # one-shot nsc invocation with a live API. Shares the `./nats/creds` host
  # directory with shipping-service (read-write here, read-only there) —
  # newly-minted .creds files land in the same place bootstrap-operator.sh
  # put the original platform/acme/globex.creds, so shipping-service's
  # directory scan sees new tenants without a restart.
  #
  # Phase 19 folded the former auth-service (Phase 15c) into this same
  # binary: it mints short-lived, permission-restricted NATS user JWTs so
  # the Sea Freight Flow browser can connect directly to NATS over WebSocket
  # (api.*/notify.* only, see auth/token.go) instead of REST + SSE for every
  # read and write. That package used to be its own service reading
  # accounts-postgres read-only as a cross-service coupling
  # (Main-POC-Plan.md Phase 15c's "known POC trade-offs"); it now reads the
  # same Store this service already owns, in-process — see
  # BUSINESS_RULES-ACCOUNTS.md's merge note.
  accounts-service:
    build:
      # Phase 35: context is the repo root so the build can copy
      # shared/natstrace alongside the service source (same pattern the
      # frontend build blocks already use for shared/unifi-theme).
      context: ../..
      dockerfile: demos/01-dictionary/backend/accounts-service/Dockerfile
    container_name: lb-accounts-service
    networks:
      - backend
      - frontend
    environment:
      DATABASE_URL: postgres://accounts:accounts@accounts-postgres:5432/accounts?sslmode=disable
      NATS_URL: nats://nats:4222
      # $SYS.REQ.CLAIMS.* (mint/revoke) is only reachable authenticated as
      # the SYS account.
      NATS_CREDS_PATH: /etc/nats/creds/sys.creds
      # Phase 16h/BR-AC08 — a second, PLATFORM-account connection used only to
      # publish notify.accounts.account.created, so shipping-service can
      # provision a newly-minted tenant's resources immediately (BR-030)
      # instead of waiting for an operator to switch the Admin UI to it.
      # Already readable here: ./nats/creds below mounts the whole shared
      # directory, platform.creds included.
      NATS_PLATFORM_CREDS_PATH: /etc/nats/creds/platform.creds
      OPERATOR_SIGNING_KEY_FILE: /etc/nats/keys/operator-signing-key.nk
      NATS_CREDS_DIR: /etc/nats/creds
      RESOLVER_SEED_DIR: /etc/nats/resolver
      # BR-AC19 — bootstrap-operator.sh's per-account signing key seeds, in the
      # same directory as the operator's. Adopted at startup so platform/acme/
      # globex keep a stable identity across `docker compose down -v` rather
      # than being handed a fresh random key whenever accounts Postgres is empty.
      ACCOUNT_SIGNING_KEYS_DIR: /etc/nats/keys
      # Spike-only shared secret (see accounts/middleware.go) — same
      # plaintext-fixture precedent as nats/creds/*.creds; WorkOS-backed
      # human auth is a later phase (.claude/memory/accounts_service_plan.md).
      ACCOUNTS_AUTH_SECRET: accounts-spike-pass
      # Phase 19 (folded in from auth-service) — returned verbatim in
      # connectInfo as the address the browser itself should dial — not the
      # in-cluster `nats:9222` hostname, since the browser resolves DNS from
      # the host, not the backend network.
      NATS_WS_URL: ws://localhost:9222
      # Phase 2 / BR-AC12 — proxies the NATS server's /jsz monitoring endpoint
      # (same pattern as shipping-service's NATS_MONITOR_URL) to serve the
      # GET /api/accounts/usage endpoint used by the Admin UI's usage column.
      NATS_MONITOR_URL: http://nats:8222
      HTTP_ADDR: ":8080"
      # Phase 22: used by accounts-service to register/hide BU contexts in
      # refdata-service when BUs are created or their visibility is toggled.
      REFDATA_URL: http://refdata-service:8080
    ports:
      - "7202:8080"
    volumes:
      - ./nats/creds:/etc/nats/creds
      - ./nats/keys:/etc/nats/keys:ro
      - ./nats/resolver:/etc/nats/resolver:ro
    depends_on:
      nats:
        condition: service_started
      accounts-postgres:
        condition: service_healthy
      refdata-service:
        condition: service_started

  # Phase 25 — pricing/rate domain ported from Linebooker
  # (RateSheet/FeeScale/FixedRate). No NATS wiring yet: Postgres + REST
  # only, since whether shipping-service ever consults it is still
  # undecided (Phase 25e, see BUSINESS_RULES-PRICING.md).
  pricing-service:
    build:
      # Phase 35: context is the repo root so the build can copy
      # shared/natstrace alongside the service source (same pattern the
      # frontend build blocks already use for shared/unifi-theme).
      context: ../..
      dockerfile: demos/01-dictionary/backend/pricing-service/Dockerfile
    container_name: lb-pricing-service
    networks:
      - backend
      - frontend
    environment:
      DATABASE_URL: postgres://pricing:pricing@pricing-postgres:5432/pricing?sslmode=disable
      HTTP_ADDR: ":8080"
      # Phase 25f — api.* adapter: one NATS connection per known tenant,
      # discovered from NATS_CREDS_DIR, same shared directory
      # shipping-service/accounts-service read (read-only here — unlike
      # accounts-service, pricing-service never mints creds itself).
      NATS_URL: nats://nats:4222
      NATS_CREDS_DIR: /etc/nats/creds
    ports:
      - "7203:8080"
    volumes:
      - ./nats/creds:/etc/nats/creds:ro
    depends_on:
      nats:
        condition: service_started
      pricing-postgres:
        condition: service_healthy

  # Phase 26 — Shipper/Transporter registration, ported from Linebooker
  # (BusinessEntity/TransporterProfileEntity/TransporterDocumentEntity/
  # FleetAssetEntity). Own Postgres + REST, same isolation level as
  # accounts-service/pricing-service. It holds a tenant-scoped NATS
  # connection per known tenant (same NATS_CREDS_DIR mount as
  # pricing-service), used for BR-TP14's vehicleTypeCode rpc.* validation
  # against refdata-service, and — as of Phase 26g — a micro-service
  # registration per connection so it's discoverable in the Admin UI's
  # Services panel. The Admin UI still reaches its data over REST: the
  # api.* endpoints that will replace that are Phase 26h, and REST stays
  # afterwards as a dual transport (pricing-service's pattern).
  trading-partner-service:
    build:
      # Phase 35: context is the repo root so the build can copy
      # shared/natstrace alongside the service source (same pattern the
      # frontend build blocks already use for shared/unifi-theme).
      context: ../..
      dockerfile: demos/01-dictionary/backend/trading-partner-service/Dockerfile
    container_name: lb-trading-partner-service
    networks:
      - backend
      - frontend
    environment:
      DATABASE_URL: postgres://trading_partner:trading_partner@trading-partner-postgres:5432/trading_partner?sslmode=disable
      HTTP_ADDR: ":8080"
      NATS_URL: nats://nats:4222
      NATS_CREDS_DIR: /etc/nats/creds
    ports:
      - "7204:8080"
    volumes:
      - ./nats/creds:/etc/nats/creds:ro
    depends_on:
      nats:
        condition: service_started
      trading-partner-postgres:
        condition: service_healthy

  # Phase 30c — cross-account NATS/JetStream diagnostics and the trace store,
  # extracted from shipping-service (Main-POC-Plan.md's Phase 30 Goal: none
  # of it is shipping domain logic, and shipping-service only ever held it
  # for the cross-account connections it happened to already have). Owns no
  # datastore of its own — NATS only, no Postgres — and its cross-account
  # reach comes from BR-AC31/BR-AC32's per-tenant service imports, resolved
  # through the one restricted `observability.creds` connection below, not a
  # per-tenant credential fan-out.
  observability-service:
    build: ./backend/observability-service
    container_name: lb-observability-service
    networks:
      - backend
      - frontend
    environment:
      NATS_URL: nats://nats:4222
      NATS_CREDS_PATH: /etc/nats/creds/observability.creds
      HTTP_ADDR: ":8080"
      # Phase 17c — Connections/AccountActivity proxy the NATS server's HTTP
      # monitoring port (distinct from NATS_URL's client port 4222).
      NATS_MONITOR_URL: http://nats:8222
      # Admin UI Log panel — same nats-logs volume shipping-service mounts
      # read-only, not a second write path.
      NATS_LOG_PATH: /var/log/nats/nats.log
      # Phase 30d — GET /api/accounts for tenantLabel resolution
      # (accounts_client.go), replacing shipping-service's original
      # LocalAddr-matching trick. Best-effort: connections/account-activity
      # still work with no labels if accounts-service is unreachable.
      ACCOUNTS_URL: http://accounts-service:8080
      ACCOUNTS_AUTH_SECRET: accounts-spike-pass
    ports:
      - "7205:8080"
    volumes:
      - ./nats/creds/observability.creds:/etc/nats/creds/observability.creds:ro
      - nats-logs:/var/log/nats:ro
    depends_on:
      nats:
        condition: service_started

  admin-frontend:
    build:
      # Context is the repo root so the build can copy the shared UniFi
      # theme preset (shared/unifi-theme) alongside the app source.
      context: ../..
      dockerfile: demos/01-dictionary/frontend/admin/Dockerfile
    container_name: lb-admin-frontend
    restart: on-failure # nginx resolves upstream hostnames at startup; retry if accounts-service DNS isn't ready yet
    ports:
      - "7100:80"
    networks:
      - frontend
    depends_on:
      - shipping-service
      - accounts-service
      - trading-partner-service

  shipping-frontend:
    build:
      context: ../..
      dockerfile: demos/01-dictionary/frontend/seafreight-app/Dockerfile
    container_name: lb-shipping-frontend
    ports:
      - "7101:80"
    networks:
      - frontend
    depends_on:
      - shipping-service
      - accounts-service

  refdata-frontend:
    build:
      context: ../..
      dockerfile: demos/01-dictionary/frontend/refdata/Dockerfile
    container_name: lb-refdata-frontend
    # Phase 32: nginx.conf now also proxies /api/auth/ to accounts-service,
    # which nginx resolves at startup (a static proxy_pass, not a variable)
    # — restart if that DNS name isn't ready yet, same race admin-frontend's
    # own restart: on-failure already guards against.
    restart: on-failure
    ports:
      - "7102:80"
    networks:
      - frontend
    depends_on:
      - refdata-service
      - accounts-service

  # Under review — third-party NATS monitoring UI, not part of the demo's
  # own frontend set. Uses the published image directly: the upstream
  # project's own compose file builds from local source (`context: ..`,
  # `docker/Dockerfile`), which only resolves inside a checkout of that
  # repo, not this one.
  nats-ui:
    image: ghcr.io/gastbob40/nats-ui:latest
    container_name: nats-ui
    ports:
      - "7103:3000"
    networks:
      - backend
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - NODE_ENV=production

  # Under review — alongside nats-ui above, for comparison. Unlike nats-ui
  # (a browser-side app that connects to NATS directly over WebSocket from
  # the client), NUI's server connects to NATS itself, so the connection
  # (nats://nats:4222) is added from its UI, not an env var — it needs the
  # `backend` network to reach that hostname.
  nui:
    image: ghcr.io/nats-nui/nui:latest
    container_name: nui
    ports:
      - "7104:31311"
    networks:
      - backend
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped
    volumes:
      - nui-data:/db
      - ./nats/creds:/etc/nats/creds:ro

  # Under review — a third comparison alongside nats-ui/nui. Server-side
  # app (Pocketbase/SQLite under the hood), so it needs the `backend`
  # network to reach `nats:4222`; the connection itself is registered
  # from its UI ("+ Add installation"), not an env var. Pinned to a
  # semver tag per the project's own install docs, which warn against
  # tracking `main`.
  nats-tower:
    image: ghcr.io/nats-tower/nats-tower:v0.6.0
    # amd64-only image (no arm64 manifest as of v0.6.0) — force emulation
    # on Apple Silicon. Fine for a review-only container.
    platform: linux/amd64
    container_name: nats-tower
    command: ["serve", "--http", "0.0.0.0:8099"]
    ports:
      - "7105:8099"
    networks:
      - backend
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped
    volumes:
      - nats-tower-data:/pb_data

  # Phase 28g — the OTLP exporter pair (ARCHITECTURE-COMMUNICATIONS.md § 6).
  # Both behind the `otlp` profile so a bare `docker compose up` is
  # unaffected: `docker compose --profile otlp up` starts them together,
  # `docker compose up` (no profile) leaves both off. This is the "no-code
  # toggling" the design calls for — two services added or removed, not an
  # env flag threaded through five service binaries.
  #
  # Jaeger keeps its own widely-recognized conventional ports (16686 UI,
  # 4318 OTLP/HTTP receiver) rather than the 7100-7199/7200-7299 pool —
  # same rationale CLAUDE.md already gives NATS/Postgres for staying on
  # their own conventional ports.
  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    container_name: lb-jaeger
    profiles: ["otlp"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # web UI
      - "4318:4318"   # OTLP/HTTP receiver
    networks:
      - backend

  otlp-bridge:
    build: ./backend/otlp-bridge
    container_name: lb-otlp-bridge
    profiles: ["otlp"]
    networks:
      - backend
    environment:
      NATS_URL: nats://nats:4222
      # otlp-bridge only ever reads (JetStream consume on TRACES) — reusing
      # platform.creds rather than minting a dedicated credential mirrors
      # refdata-service's own PLATFORM connection (docker-compose.yml above)
      # rather than adding new NATS account provisioning for a demo-only
      # exporter.
      NATS_CREDS_PATH: /etc/nats/creds/platform.creds
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # OTLP_BRIDGE_REPLAY=true re-exports the whole TRACES retained window
      # (the "start the collector late" case) instead of live-tailing —
      # see otlp-bridge/cmd/main.go's openConsumer doc comment.
      OTLP_BRIDGE_REPLAY: "false"
    volumes:
      - ./nats/creds/platform.creds:/etc/nats/creds/platform.creds:ro
    depends_on:
      nats:
        condition: service_started
      jaeger:
        condition: service_started

networks:
  # Trust-tier split (not per-service-pair): anything needing NATS/Postgres
  # joins `backend`; anything the browser talks to joins `frontend`.
  # shipping-service/refdata-service straddle both — they're the only bridge
  # point, so frontend apps can reach them but never nats/postgres directly.
  backend:
  frontend:

volumes:
  nats-data:
  nats-logs:
  pg-data:
  pg-refdata-data:
  pg-accounts-data:
  pg-pricing-data:
  pg-trading-partner-data:
  nui-data:
  nats-tower-data:
