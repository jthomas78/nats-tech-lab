name: poc

services:
  nats:
    image: nats:2.14.3-alpine3.22
    container_name: lb-nats
    # nats-server runs as root and creates log_file at 0640 by default —
    # unreadable by shipping-service's own container, which deliberately
    # runs as a non-root, non-root-group user (see its Dockerfile) rather
    # than being loosened to read this one file. Pre-creating the file at
    # 0644 before nats-server starts sidesteps that: nats-server opens an
    # existing log file for append without resetting its mode.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /logs && touch /logs/nats.log && chmod 644 /logs/nats.log && exec nats-server -c /etc/nats/nats.conf
    ports:
      - "4222:4222"
      - "8222:8222" # monitoring
      # Still published for the nats-ui container (under review), whose
      # browser page dials this host port directly. The demo's own three
      # frontends no longer do — since Phase 45 they reach the listener
      # through their own nginx at /nats (same origin), which is what makes
      # them work behind a remote TLS proxy.
      - "9222:9222" # websocket
    networks:
      - backend
      # Phase 45 — reachable by the frontend nginx containers so they can
      # proxy /nats. This does not put the browser on the bus: nginx exposes
      # exactly one location for it, and nothing else on `frontend` gains a
      # NATS credential by being able to resolve the hostname.
      - frontend
    volumes:
      - nats-data:/data
      - nats-logs:/logs
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - ./nats/operator.jwt:/etc/nats/operator.jwt:ro

  postgres:
    image: postgres:16-alpine
    container_name: lb-shipping-postgres
    environment:
      POSTGRES_USER: dict
      POSTGRES_PASSWORD: dict
      POSTGRES_DB: dictionary
    ports:
      - "5432:5432"
    networks:
      - backend
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dict -d dictionary"]
      interval: 2s
      timeout: 2s
      retries: 15

  # refdata-service's own Postgres instance — deliberately separate from
  # `postgres` above (not just a private schema on it) so refdata-service has
  # no shared infrastructure with shipping-service beyond NATS, matching the
  # database-per-service isolation level (BR-D28 already made backend-to-
  # backend *calls* NATS-only; this closes the remaining shared-datastore gap
  # — see Dictionary-Service-Plan.md Q1).
  refdata-postgres:
    image: postgres:16-alpine
    container_name: lb-refdata-postgres
    environment:
      POSTGRES_USER: refdata
      POSTGRES_PASSWORD: refdata
      POSTGRES_DB: refdata
    ports:
      - "5433:5432"
    networks:
      - backend
    volumes:
      - pg-refdata-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refdata -d refdata"]
      interval: 2s
      timeout: 2s
      retries: 15

  # accounts-service's own Postgres instance (Phase 14b) — same
  # database-per-service isolation as refdata-postgres above; stores account
  # metadata (name, public key, JetStream limits), never NATS credentials'
  # private seeds for the three pre-existing accounts (those are seeded
  # read-only from nats/resolver/*.jwt at startup, see cmd/main.go).
  accounts-postgres:
    image: postgres:16-alpine
    container_name: lb-accounts-postgres
    environment:
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: accounts
      POSTGRES_DB: accounts
    ports:
      - "5434:5432"
    networks:
      - backend
    volumes:
      - pg-accounts-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts -d accounts"]
      interval: 2s
      timeout: 2s
      retries: 15

  # mfe-registry-service's own Postgres instance — same
  # database-per-service isolation as accounts-postgres. The registry left
  # accounts-service with its schema intact precisely because it shared no
  # table and no foreign key with accounts (decision 39); giving it its own
  # instance is what makes that true at the infrastructure layer too.
  mfe-registry-postgres:
    image: postgres:16-alpine
    container_name: lb-mfe-registry-postgres
    environment:
      POSTGRES_USER: mfe_registry
      POSTGRES_PASSWORD: mfe_registry
      POSTGRES_DB: mfe_registry
    ports:
      - "5437:5432"
    networks:
      - backend
    volumes:
      - pg-mfe-registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfe_registry -d mfe_registry"]
      interval: 2s
      timeout: 2s
      retries: 15

  # pricing-service's own Postgres instance (Phase 25) — same
  # database-per-service isolation as refdata-postgres/accounts-postgres.
  # This domain is write-adjacent in the source system it was ported from
  # (unlike refdata-service's read-only boundary), so it gets the same
  # isolated datastore rigor rather than a shared schema.
  pricing-postgres:
    image: postgres:16-alpine
    container_name: lb-pricing-postgres
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
      POSTGRES_DB: pricing
    ports:
      - "5435:5432"
    networks:
      - backend
    volumes:
      - pg-pricing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing"]
      interval: 2s
      timeout: 2s
      retries: 15

  # organizations-service's own Postgres instance (Phase 26) — same
  # database-per-service isolation as refdata-postgres/accounts-postgres/
  # pricing-postgres.
  organizations-postgres:
    image: postgres:16-alpine
    container_name: lb-organizations-postgres
    # Legacy DB/role names are deliberately retained to preserve the existing dev volume.
    environment:
      POSTGRES_USER: trading_partner
      POSTGRES_PASSWORD: trading_partner
      POSTGRES_DB: trading_partner
    ports:
      - "5436:5432"
    networks:
      - backend
    volumes:
      - pg-trading-partner-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_partner -d trading_partner"]
      interval: 2s
      timeout: 2s
      retries: 15

  temporal-postgres:
    image: postgres:16-alpine
    container_name: lb-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    networks:
      - backend
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 2s
      timeout: 2s
      retries: 15

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: lb-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "7233:7233" # Temporal frontend/gRPC
    networks:
      - backend
    depends_on:
      temporal-postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: lb-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080" # Temporal Web UI
    networks:
      - backend
      - frontend
    depends_on:
      - temporal

  shipping-service:
    build:
      # Phase 35: context is the repo root so the build can copy
      # shared/natstrace alongside the service source (same pattern the
      # frontend build blocks already use for shared/unifi-theme).
      context: ../..
      dockerfile: demos/01-dictionary/backend/shipping-service/Dockerfile
    container_name: lb-shipping-service
    networks:
      - backend
      - frontend
    environment:
      NATS_URL: nats://nats:4222
      # Phase 14a — operator mode: every tenant account is now a .creds file,
      # not a bare user/password. NATS_CREDS_DIR is the directory
      # rest.Handlers.SwitchTenant scans for <tenant>.creds files.
      NATS_CREDS_DIR: /etc/nats/creds
      NATS_ADMIN_CREDS_PATH: /etc/nats/creds/shipping-admin.creds
      DATABASE_URL: postgres://dict:dict@postgres:5432/dictionary?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "7200:8080"
    volumes:
      - ./nats/creds:/etc/nats/creds:ro
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  refdata-service:
    build:
      # Phase 35: context is the repo root so the build can copy
      # shared/natstrace alongside the service source (same pattern the
      # frontend build blocks already use for shared/unifi-theme).
      context: ../..
      dockerfile: demos/01-dictionary/backend/refdata-service/Dockerfile
    container_name: lb-refdata-service
    networks:
      - backend
      - frontend
    environment:
      # Own Postgres instance (`refdata-postgres`, not `postgres`) — no
      # datastore of any kind is shared with `shipping-service` (Phase 11,
      # Dictionary-Service-Plan.md; isolation tightened per the Q1 follow-up
      # decision to go database-per-service rather than schema-per-service).
      DATABASE_URL: postgres://refdata:refdata@refdata-postgres:5432/refdata?sslmode=disable
      # Same NATS server as `shipping-service` — used only for the KV cache
      # (refdata-{context}) and the bounded REFDATA change-event stream,
      # never as this service's source of truth (Q6).
      NATS_URL: nats://nats:4222
      # Phase 14a — refdata-service's rpc.* adapter is cross-tenant
      # (BR-D08), so it always connects as PLATFORM, never a per-tenant
      # account, over this one connection.
      NATS_CREDS_PATH: /etc/nats/creds/platform.creds
      # Phase 32 (BR-D40) — additive per-tenant connections for the new
      # api.* surface: one NATS connection per known tenant, discovered from
      # the same shared creds directory pricing-service/organizations-service
      # already read (read-only here — refdata-service never mints creds
      # itself).
      NATS_CREDS_DIR: /etc/nats/creds
      HTTP_ADDR: ":8080"
    ports:
      - "7201:8080"
    volumes:
      - ./nats/creds:/etc/nats/creds:ro
    depends_on:
      nats:
        condition: service_started
      refdata-postgres:
        condition: service_healthy

  # Phase 14b — mints/revokes NATS accounts at runtime via decentralized
  # JWTs (accounts/provisioner.go), replacing nats/bootstrap-operator.sh's
  # one-shot nsc invocation with a live API. Shares the `./nats/creds` host
  # directory with shipping-service (read-write here, read-only there) —
  # newly-minted .creds files land in the same place bootstrap-operator.sh
  # put the original platform/acme/globex.creds, so shipping-service's
  # directory scan sees new tenants without a restart.
  #
  # Phase 19 folded the former auth-service (Phase 15c) into this same
  # binary: it mints short-lived, permission-restricted NATS user JWTs so
  # the Sea Freight Flow browser can connect directly to NATS over WebSocket
  # (api.*/notify.* only, see auth/token.go) instead of REST + SSE for every
  # read and write. That package used to be its own service reading
  # accounts-postgres read-only as a cross-service coupling
  # (Main-POC-Plan.md Phase 15c's "known POC trade-offs"); it now reads the
  # same Store this service already owns, in-process — see
  # BUSINESS_RULES-ACCOUNTS.md's merge note.
  accounts-service:
    build:
      # Phase 35: context is the repo root so the build can copy
      # shared/natstrace alongside the service source (same pattern the
      # frontend build blocks already use for shared/unifi-theme).
      context: ../..
      dockerfile: demos/01-dictionary/backend/accounts-service/Dockerfile
    container_name: lb-accounts-service
    networks:
      - backend
      - frontend
    environment:
      DATABASE_URL: postgres://accounts:accounts@accounts-postgres:5432/accounts?sslmode=disable
      NATS_URL: nats://nats:4222
      # $SYS.REQ.CLAIMS.* (mint/revoke) is only reachable authenticated as
      # the SYS account.
      NATS_CREDS_PATH: /etc/nats/creds/sys.creds
      # Phase 16h/BR-AC08 — a second, PLATFORM-account connection used only to
      # publish notify.accounts.account.created, so shipping-service can
      # provision a newly-minted tenant's resources immediately (BR-030)
      # instead of waiting for an operator to switch the Admin UI to it.
      # Already readable here: ./nats/creds below mounts the whole shared
      # directory, platform.creds included.
      NATS_PLATFORM_CREDS_PATH: /etc/nats/creds/platform.creds
      OPERATOR_SIGNING_KEY_FILE: /etc/nats/keys/operator-signing-key.nk
      NATS_CREDS_DIR: /etc/nats/creds
      RESOLVER_SEED_DIR: /etc/nats/resolver
      # BR-AC19 — bootstrap-operator.sh's per-account signing key seeds, in the
      # same directory as the operator's. Adopted at startup so platform/acme/
      # globex keep a stable identity across `docker compose down -v` rather
      # than being handed a fresh random key whenever accounts Postgres is empty.
      ACCOUNT_SIGNING_KEYS_DIR: /etc/nats/keys
      # Spike-only shared secret (see accounts/middleware.go) — same
      # plaintext-fixture precedent as nats/creds/*.creds; WorkOS-backed
      # human auth is a later phase (.claude/memory/accounts_service_plan.md).
      ACCOUNTS_AUTH_SECRET: accounts-spike-pass
      # Phase 19 (folded in from auth-service) — returned verbatim in
      # connectInfo as the address the browser itself should dial. Phase 45
      # made that a *path* rather than an absolute URL: each frontend's nginx
      # proxies /nats to the websocket listener below, and the browser
      # resolves the path against the origin it was served from
      # (shared/nats/resolveWsUrl.js). The previous `ws://localhost:9222`
      # was correct only when the browser and the stack shared a machine —
      # remotely, `localhost` is the viewer's own box, and a ws:// dial from
      # an https:// page is blocked as mixed content. An absolute ws://wss://
      # value still works if a deployment prefers a dedicated NATS hostname.
      NATS_WS_URL: /nats
      # Phase 2 / BR-AC12 — proxies the NATS server's /jsz monitoring endpoint
      # (same pattern as shipping-service's NATS_MONITOR_URL) to serve the
      # GET /api/accounts/usage endpoint used by the Admin UI's usage column.
      NATS_MONITOR_URL: http://nats:8222
      HTTP_ADDR: ":8080"
      # Phase 22: used by accounts-service to register/hide BU contexts in
      # refdata-service when BUs are created or their visibility is toggled.
      REFDATA_URL: http://refdata-service:8080
      # Phase 52 (BR-AC44/BR-AC45) — the session reaper. Every browser connect
      # writes a registry row (BR-AC38) and nothing used to delete one.
      #
      # Two knobs, deliberately separate. RETENTION is the operator knob: how
      # long an expired session row survives past its own expires_at. 24h is
      # roughly how long the row stays explainable — beyond it the /connz
      # closed ring feeding the panel's Last outcome column has rolled over.
      # INTERVAL is a load knob only: one minimum-TTL period, ~1% overshoot
      # against a 24h window.
      #
      # Both shown at their defaults rather than omitted, so the values are
      # discoverable here instead of only in accounts/reaper.go. Setting
      # RETENTION to 0 DISABLES the reaper; it does not mean reap-on-expiry.
      ACCOUNTS_SESSION_RETENTION: 24h
      ACCOUNTS_REAPER_INTERVAL: 15m
    ports:
      - "7202:8080"
    volumes:
      - ./nats/creds:/etc/nats/creds
      - ./nats/keys:/etc/nats/keys:ro
      - ./nats/resolver:/etc/nats/resolver:ro
    depends_on:
      nats:
        condition: service_started
      accounts-postgres:
        condition: service_healthy
      refdata-service:
        condition: service_started

  # The curated micro-frontend registry: which micro-frontends the platform
  # will let an application shell load, from which origins, at which revision.
  # Was a bounded context inside accounts-service until the split.
  #
  # Note there is no port mapping for an API: browsers use api.*; publishers
  # announce on a separate rpc.* subject. Both frontends use NATS, unchanged
  # when it moved out. 7206 exposes /healthz and nothing else.
  mfe-registry-service:
    build:
      # Context is the repo root so the build can copy the shared modules
      # alongside the service source.
      context: ../..
      dockerfile: demos/01-dictionary/backend/mfe-registry-service/Dockerfile
    container_name: lb-mfe-registry-service
    networks:
      - backend
      - frontend
    environment:
      DATABASE_URL: postgres://mfe_registry:mfe_registry@mfe-registry-postgres:5432/mfe_registry?sslmode=disable
      NATS_URL: nats://nats:4222
      # PLATFORM: the registry's subjects are all _platform-context, and core
      # NATS never crosses an account boundary — a connection on any other
      # account would register endpoints no browser could reach. Its own
      # credential, not platform.creds: the grant is narrow enough to state
      # (see nats/bootstrap-operator.sh) and a shared one would say nothing.
      NATS_CREDS_PATH: /etc/nats/creds/mfe-registry-service.creds
      HTTP_ADDR: ":8080"
      # Phase 2a (application shell) — the origins this platform will let a
      # shell fetch plugin code from (BR-AS20). Configuration, never a stored
      # row: the allowlist is the envelope the registry itself sits inside, so
      # a compromised write path must not be able to widen it. Empty permits
      # nothing. 7111 is the example plugin's remote — the same origin whether
      # it is served by its container (example-plugin-frontend, below) or by
      # its dev server, which is why one value covers both. The catalog owns
      # 7112; the independent failure fixtures own 7113–7115. Each origin
      # has a running service and a manifest in the mounted preload file.
      REGISTRY_ALLOWED_ORIGINS: "http://localhost:7111,http://localhost:7112,http://localhost:7113,http://localhost:7114,http://localhost:7115"
      # Browser localhost is not this container's localhost. These translate
      # existing grants only; missing mappings leave drift as not checked.
      REGISTRY_FETCH_ORIGINS: >-
        {"http://localhost:7111":"http://example-plugin-frontend:80",
         "http://localhost:7112":"http://demo-catalog-frontend:80",
         "http://localhost:7113":"http://example-plugin-slow-frontend:80",
         "http://localhost:7114":"http://example-plugin-activate-throws-frontend:80",
         "http://localhost:7115":"http://example-plugin-incompatible-frontend:80"}
      # Phase 5d (BR-AS61/AS62/AS65) — the health plane, deployment-owned end
      # to end. Both maps are configuration and never manifest data: a
      # publisher that could name its own probe target would be choosing what
      # the platform dials, and could read the answer back out of the health
      # decoration.
      #
      # Frontend: browser origin -> the address this container reaches it on,
      # same translation REGISTRY_FETCH_ORIGINS makes and for the same reason
      # (browser localhost is not this container's localhost). "/healthz" is
      # appended by the registry; each plugin's nginx.conf serves it.
      REGISTRY_HEALTH_ORIGINS: >-
        {"http://localhost:7111":"http://example-plugin-frontend:80",
         "http://localhost:7112":"http://demo-catalog-frontend:80",
         "http://localhost:7113":"http://example-plugin-slow-frontend:80",
         "http://localhost:7114":"http://example-plugin-activate-throws-frontend:80",
         "http://localhost:7115":"http://example-plugin-incompatible-frontend:80"}
      # Backend: plugin id -> the services it cannot work without. An id
      # missing here is "not configured"; an id mapped to [] is a
      # frontend-only plugin, which is "not applicable" — a different fact,
      # and the shell shows it as one. Only refdata-service answers the
      # readiness question today (see shared/natsready), so it is the only
      # service named.
      REGISTRY_HEALTH_TARGETS: >-
        {"demo-catalog":["refdata-service"],
         "example-plugin":[],
         "example-plugin-slow":[],
         "example-plugin-activate-throws":[],
         "example-plugin-incompatible":[]}
      REGISTRY_PRELOAD_FILE: /etc/registry/registry.json
    ports:
      - "7206:8080"
    volumes:
      - ./nats/creds:/etc/nats/creds
      - ./registry.json:/etc/registry/registry.json:ro
    depends_on:
      nats:
        condition: service_started
      mfe-registry-postgres:
        condition: service_healthy

  # App-shell Phase 13d — publisher trust seeding, as a one-shot.
  #
  # Reuses mfe-registry-service's image (a second binary in it, not a second
  # image) and overrides the entrypoint. It reads nats/keys/publishers.json —
  # the public halves bootstrap-operator.sh minted in 13c — and writes the
  # publisher rows through api._platform.registry.publishers.write.v1, the
  # same operator endpoint the Registry Publishers panel uses. No boot-time
  # bypass of the revision check or the audit trail (decision 7).
  #
  # It runs on every `up`, so it converges rather than replays: it reads
  # first, writes only what is missing, and never reverses an operator
  # decision — a revoked key stays revoked (BR-AS68). Neither accounts-service
  # nor mfe-registry-service has a healthcheck, so service_started is all
  # Compose can offer here; the seeder does its own bounded, logged wait on
  # the registry's read subject rather than racing it and dying.
  #
  # This is the ordering gate decision 6 requires: the announcer sidecars
  # added in 13e hang off it with
  #   depends_on: { registry-publisher-seed: { condition: service_completed_successfully } }
  # so no announcer can start before the trust table it will be judged
  # against exists. Without that they race the seed and exit on `not-owned`.
  registry-publisher-seed:
    build:
      context: ../..
      dockerfile: demos/01-dictionary/backend/mfe-registry-service/Dockerfile
    container_name: lb-registry-publisher-seed
    entrypoint: ["seed-publishers"]
    networks:
      - backend
    environment:
      NATS_URL: nats://nats:4222
      # The operator credential is minted by accounts-service, which owns the
      # trust chain, even though the subjects called are served by the
      # registry — the same split cmd/seed-registry's own doc comment records.
      ACCOUNTS_URL: http://accounts-service:8080
      PUBLISHERS_FILE: /etc/registry/publishers.json
    restart: "no"
    volumes:
      - ./nats/keys/publishers.json:/etc/registry/publishers.json:ro
    depends_on:
      nats:
        condition: service_started
      accounts-service:
        condition: service_started
      mfe-registry-service:
        condition: service_started

  # Phase 25 — pricing/rate domain ported from Linebooker
  # (RateSheet/FeeScale/FixedRate). No NATS wiring yet: Postgres + REST
  # only, since whether shipping-service ever consults it is still
  # undecided (Phase 25e, see BUSINESS_RULES-PRICING.md).
  pricing-service:
    build:
      # Phase 35: context is the repo root so the build can copy
      # shared/natstrace alongside the service source (same pattern the
      # frontend build blocks already use for shared/unifi-theme).
      context: ../..
      dockerfile: demos/01-dictionary/backend/pricing-service/Dockerfile
    container_name: lb-pricing-service
    networks:
      - backend
      - frontend
    environment:
      DATABASE_URL: postgres://pricing:pricing@pricing-postgres:5432/pricing?sslmode=disable
      HTTP_ADDR: ":8080"
      # Phase 25f — api.* adapter: one NATS connection per known tenant,
      # discovered from NATS_CREDS_DIR, same shared directory
      # shipping-service/accounts-service read (read-only here — unlike
      # accounts-service, pricing-service never mints creds itself).
      NATS_URL: nats://nats:4222
      NATS_CREDS_DIR: /etc/nats/creds
    ports:
      - "7203:8080"
    volumes:
      - ./nats/creds:/etc/nats/creds:ro
    depends_on:
      nats:
        condition: service_started
      pricing-postgres:
        condition: service_healthy

  # Phase 26 — Shipper/Transporter registration, ported from Linebooker
  # (BusinessEntity/TransporterProfileEntity/TransporterDocumentEntity/
  # FleetAssetEntity). Own Postgres + REST, same isolation level as
  # accounts-service/pricing-service. It holds a tenant-scoped NATS
  # connection per known tenant (same NATS_CREDS_DIR mount as
  # pricing-service), used for BR-TP14's vehicleTypeCode rpc.* validation
  # against refdata-service, and — as of Phase 26g — a micro-service
  # registration per connection so it's discoverable in the Admin UI's
  # Services panel. The Admin UI still reaches its data over REST: the
  # api.* endpoints that will replace that are Phase 26h, and REST stays
  # afterwards as a dual transport (pricing-service's pattern).
  organizations-service:
    build:
      # Phase 35: context is the repo root so the build can copy
      # shared/natstrace alongside the service source (same pattern the
      # frontend build blocks already use for shared/unifi-theme).
      context: ../..
      dockerfile: demos/01-dictionary/backend/organizations-service/Dockerfile
    container_name: lb-organizations-service
    networks:
      - backend
      - frontend
    environment:
      DATABASE_URL: postgres://trading_partner:trading_partner@organizations-postgres:5432/trading_partner?sslmode=disable
      HTTP_ADDR: ":8080"
      NATS_URL: nats://nats:4222
      NATS_CREDS_DIR: /etc/nats/creds
      # BR-TP52 — seals tracking-credential payloads (AES-256-GCM) before
      # they reach the organizations-secrets KV bucket. 64 hex chars = 32
      # bytes. A lab-only fixed value: a real deployment injects this from a
      # secret manager and never commits it. Unset disables tracking
      # credentials entirely rather than storing them in the clear, and a
      # malformed value stops the service rather than running degraded.
      ORGANIZATIONS_SECRETS_KEY: "6c61622d6f6e6c792d6b65792d646f2d6e6f742d7573652d696e2d70726f6421"
      # BR-TP58 — the vetting worker's Temporal endpoint. Phase 38b built the
      # saga but never gave the service a Temporal connection, so the
      # organizations-vetting task queue had no pollers and no profile could
      # leave AwaitingDocumentation.
      TEMPORAL_ADDRESS: temporal:7233
      # Selects activities.MockGitVerifier's outcome — pass | fail | timeout.
      # There is no real GIT/insurance system in this lab; this is what keeps
      # BR-TP22's compensation branch reachable by hand. Default: pass.
      ORGANIZATIONS_GIT_OUTCOME: pass
      # BR-TP28 — how often the GIT monitor re-checks a vetted transporter's
      # cover. Short for a lab: a drop nobody can watch happen is not a
      # demonstration. Production would measure this in hours.
    ports:
      - "7204:8080"
    volumes:
      - ./nats/creds:/etc/nats/creds:ro
    depends_on:
      nats:
        condition: service_started
      organizations-postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  # Phase 30c — cross-account NATS/JetStream diagnostics and the trace store,
  # extracted from shipping-service (Main-POC-Plan.md's Phase 30 Goal: none
  # of it is shipping domain logic, and shipping-service only ever held it
  # for the cross-account connections it happened to already have). Owns no
  # datastore of its own — NATS only, no Postgres — and its cross-account
  # reach comes from BR-AC31/BR-AC32's per-tenant service imports, resolved
  # through the one restricted `observability.creds` connection below, not a
  # per-tenant credential fan-out.
  observability-service:
    build:
      # Phase 43d/43e: context is the repo root so the build can copy the
      # shared modules (natsnotify, natstrace) alongside the service source.
      context: ../..
      dockerfile: demos/01-dictionary/backend/observability-service/Dockerfile
    container_name: lb-observability-service
    networks:
      - backend
      - frontend
    environment:
      NATS_URL: nats://nats:4222
      NATS_CREDS_PATH: /etc/nats/creds/observability.creds
      HTTP_ADDR: ":8080"
      # Phase 17c — Connections/AccountActivity proxy the NATS server's HTTP
      # monitoring port (distinct from NATS_URL's client port 4222).
      NATS_MONITOR_URL: http://nats:8222
      # Admin UI Log panel — same nats-logs volume shipping-service mounts
      # read-only, not a second write path.
      NATS_LOG_PATH: /var/log/nats/nats.log
      # Phase 30d — GET /api/accounts for tenantLabel resolution
      # (accounts_client.go), replacing shipping-service's original
      # LocalAddr-matching trick. Best-effort: connections/account-activity
      # still work with no labels if accounts-service is unreachable.
      ACCOUNTS_URL: http://accounts-service:8080
      ACCOUNTS_AUTH_SECRET: accounts-spike-pass
    ports:
      - "7205:8080"
    volumes:
      - ./nats/creds/observability.creds:/etc/nats/creds/observability.creds:ro
      - nats-logs:/var/log/nats:ro
    depends_on:
      nats:
        condition: service_started

  admin-frontend:
    build:
      # Context is the repo root so the build can copy the shared UniFi
      # theme preset (shared/unifi-theme) alongside the app source.
      context: ../..
      dockerfile: demos/01-dictionary/frontend/admin/Dockerfile
    container_name: lb-admin-frontend
    restart: on-failure # nginx resolves upstream hostnames at startup; retry if accounts-service DNS isn't ready yet
    ports:
      - "7100:80"
    networks:
      - frontend
    depends_on:
      - shipping-service
      - accounts-service
      - organizations-service

  shipping-frontend:
