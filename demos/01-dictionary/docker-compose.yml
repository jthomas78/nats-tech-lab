      registry-publisher-seed:
        condition: service_completed_successfully

  # Under review — third-party NATS monitoring UI, not part of the demo's
  # own frontend set. Uses the published image directly: the upstream
  # project's own compose file builds from local source (`context: ..`,
  # `docker/Dockerfile`), which only resolves inside a checkout of that
  # repo, not this one.
  nats-ui:
    image: ghcr.io/gastbob40/nats-ui:latest
    container_name: nats-ui
    ports:
      - "7103:3000"
    networks:
      - backend
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - NODE_ENV=production

  # Under review — alongside nats-ui above, for comparison. Unlike nats-ui
  # (a browser-side app that connects to NATS directly over WebSocket from
  # the client), NUI's server connects to NATS itself, so the connection
  # (nats://nats:4222) is added from its UI, not an env var — it needs the
  # `backend` network to reach that hostname.
  nui:
    image: ghcr.io/nats-nui/nui:latest
    container_name: nui
    ports:
      - "7104:31311"
    networks:
      - backend
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped
    volumes:
      - nui-data:/db
      - ./nats/creds:/etc/nats/creds:ro

  # Under review — a third comparison alongside nats-ui/nui. Server-side
  # app (Pocketbase/SQLite under the hood), so it needs the `backend`
  # network to reach `nats:4222`; the connection itself is registered
  # from its UI ("+ Add installation"), not an env var. Pinned to a
  # semver tag per the project's own install docs, which warn against
  # tracking `main`.
  nats-tower:
    image: ghcr.io/nats-tower/nats-tower:v0.6.0
    # amd64-only image (no arm64 manifest as of v0.6.0) — force emulation
    # on Apple Silicon. Fine for a review-only container.
    platform: linux/amd64
    container_name: nats-tower
    command: ["serve", "--http", "0.0.0.0:8099"]
    ports:
      - "7105:8099"
    networks:
      - backend
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped
    volumes:
      - nats-tower-data:/pb_data

  # Phase 28g — the OTLP exporter pair (ARCHITECTURE-COMMUNICATIONS.md § 6).
  # Both behind the `otlp` profile so a bare `docker compose up` is
  # unaffected: `docker compose --profile otlp up` starts them together,
  # `docker compose up` (no profile) leaves both off. This is the "no-code
  # toggling" the design calls for — two services added or removed, not an
  # env flag threaded through five service binaries.
  #
  # Jaeger keeps its own widely-recognized conventional ports (16686 UI,
  # 4318 OTLP/HTTP receiver) rather than the 7100-7199/7200-7299 pool —
  # same rationale CLAUDE.md already gives NATS/Postgres for staying on
  # their own conventional ports.
  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    container_name: lb-jaeger
    profiles: ["otlp"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # web UI
      - "4318:4318"   # OTLP/HTTP receiver
    networks:
      - backend

  otlp-bridge:
    build:
      # Repo root, so the build can copy shared/natsconn (see the Dockerfile).
      context: ../..
      dockerfile: demos/01-dictionary/backend/otlp-bridge/Dockerfile
    container_name: lb-otlp-bridge
    profiles: ["otlp"]
    networks:
      - backend
    environment:
      NATS_URL: nats://nats:4222
      # otlp-bridge only ever reads (JetStream consume on TRACES) — reusing
      # platform.creds rather than minting a dedicated credential mirrors
      # refdata-service's own PLATFORM connection (docker-compose.yml above)
      # rather than adding new NATS account provisioning for a demo-only
      # exporter.
      NATS_CREDS_PATH: /etc/nats/creds/platform.creds
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # OTLP_BRIDGE_REPLAY=true re-exports the whole TRACES retained window
      # (the "start the collector late" case) instead of live-tailing —
      # see otlp-bridge/cmd/main.go's openConsumer doc comment.
      OTLP_BRIDGE_REPLAY: "false"
    volumes:
      - ./nats/creds/platform.creds:/etc/nats/creds/platform.creds:ro
    depends_on:
      nats:
        condition: service_started
      jaeger:
        condition: service_started

networks:
  # Trust-tier split (not per-service-pair): anything needing NATS/Postgres
  # joins `backend`; anything the browser talks to joins `frontend`.
  # shipping-service/refdata-service straddle both — they're the only bridge
  # point for REST, so frontend apps can reach them but never postgres
  # directly. Phase 45 added `nats` to `frontend` as well, so each frontend's
  # nginx can proxy the browser's WebSocket at /nats. The invariant that
  # rule protects is unchanged and in fact tighter: what must not reach the
  # bus directly is the *browser*, and it still cannot — it dials nginx,
  # which forwards one path, and it still needs an account-scoped JWT from
  # accounts-service to get past the NATS server's own authorization.
  backend:
  frontend:

