  example-plugin-incompatible-announcer:
    build:
      context: ../..
      dockerfile: demos/01-dictionary/backend/mfe-registry-service/Dockerfile
    container_name: lb-example-plugin-incompatible-announcer
    entrypoint: ["announce-plugin"]
    networks:
