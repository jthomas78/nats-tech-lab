basePath: /
definitions:
  commands.ShipInput:
    properties:
      cargo:
        $ref: '#/definitions/domain.Cargo'
      context:
        description: fleet / KV-bucket qualifier
        type: string
      port:
        type: string
      shipID:
        type: string
      shipName:
        description: used on first Arrive
        type: string
    type: object
  domain.Cargo:
    properties:
      description:
        type: string
      units:
        type: integer
    type: object
  domain.ShipState:
    properties:
      cargo:
        items:
          $ref: '#/definitions/domain.Cargo'
        type: array
      context:
        description: fleet / KV-bucket qualifier
        type: string
      currentPort:
        description: '"" = at sea'
        type: string
      shipID:
        type: string
      shipName:
        type: string
      updatedAt:
        type: string
    type: object
  rest.errorResponse:
    properties:
      error:
        type: string
    type: object
  rest.fleetResponse:
    properties:
      fleet:
        items:
          $ref: '#/definitions/domain.ShipState'
        type: array
    type: object
  rest.shipBResponse:
    properties:
      cacheHit:
        type: boolean
      ship:
        $ref: '#/definitions/domain.ShipState'
      source:
        description: '"kv-cache" or "postgres"'
        type: string
    type: object
  rest.shipResponse:
    properties:
      ship:
        $ref: '#/definitions/domain.ShipState'
    type: object
host: localhost:18080
info:
  contact: {}
  description: Shipping domain backend for the NATS Tech Lab POC. Demonstrates JetStream
    event sourcing, NATS KV projections (Shape A / Shape B), and pure event reconstruction
    (Shape C).
  title: EventSourcing CQRS POC — Shipping API
  version: "1.0"
paths:
  /api/jetstream/stream:
    get:
      description: Server-Sent Events stream of raw DICTIONARY.* JetStream messages
        using DeliverAll policy — replays from seq=1, then continues with live messages.
        Each event is a JSON-encoded jsEvent object.
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE stream — data: {jsEvent JSON}'
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: JetStream full replay + live stream (SSE)
      tags:
      - streams
  /api/jetstream/watch:
    get:
      description: Server-Sent Events stream of raw DICTIONARY.* JetStream messages
        using DeliverNew policy — only messages published after the connection opens.
        Each event is a JSON-encoded jsEvent object.
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE stream — data: {jsEvent JSON}'
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: JetStream live watch (SSE)
      tags:
      - streams
  /api/shape-b/cache/{context}/{shipID}:
    delete:
      description: Deletes the KV cache entry for a ship in the Shape B bucket. The
        next read will miss and fall through to Postgres, demonstrating the cache-miss
        path.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier
        in: path
        name: shipID
        required: true
        type: string
      responses:
        "204":
          description: Cache entry evicted
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Evict Shape B cache entry
      tags:
      - shape-b
  /api/shape-b/ships/{context}/{shipID}:
    get:
      description: 'Returns current ship state from the Shape B read model: checks
        KV cache first, falls through to Postgres on a miss and backfills the cache.'
      parameters:
      - description: Fleet context (e.g. global, atlantic-fleet)
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier (e.g. orient-express)
        in: path
        name: shipID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.shipBResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Get ship (Shape B — KV cache → Postgres)
      tags:
      - shape-b
  /api/shape-c/fleet:
    get:
      description: Replays the full JetStream event log from seq=1 and reconstructs
        the current fleet state by folding all ship events through ShipAggregate.Apply.
        No KV or Postgres involved.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.fleetResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Reconstruct fleet (Shape C — pure event sourcing)
      tags:
      - shape-c
  /api/ships/arrive:
    post:
      consumes:
      - application/json
      description: Ship arrives at a port. Validates domain rules (must not already
        be docked), then publishes a ship.arrived event to JetStream.
      parameters:
      - description: context, shipID, shipName (first arrival only), port
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Arrive at port
      tags:
      - ships
  /api/ships/cargo/load:
    post:
      consumes:
      - application/json
      description: Loads a cargo item onto a ship. The ship must be docked in port.
        Publishes a cargo.loaded event.
      parameters:
      - description: context, shipID, cargo (description + units)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Ship not docked
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Load cargo
      tags:
      - cargo
  /api/ships/cargo/unload:
    post:
      consumes:
      - application/json
      description: Removes a cargo item from a ship's manifest by description. The
        ship must be docked in port. Publishes a cargo.unloaded event.
      parameters:
      - description: context, shipID, cargo (description + units)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Ship not docked
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Unload cargo
      tags:
      - cargo
  /api/ships/depart:
    post:
      consumes:
      - application/json
      description: Ship departs from a port. Validates that the ship is currently
        docked at the named port, then publishes a ship.departed event.
      parameters:
      - description: context, shipID, port
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Depart from port
      tags:
      - ships
  /api/watch/{context}:
    get:
      description: Server-Sent Events stream of NATS KV changes for both the Shape
        A and Shape B buckets in the given context. Replays current bucket state first
        (snapshot), then delivers live updates. Each event is a JSON-encoded watchEvent
        object.
      parameters:
      - description: Fleet context (e.g. global, atlantic-fleet)
        in: path
        name: context
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE stream — data: {watchEvent JSON}'
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: KV watch stream (SSE)
      tags:
      - streams
swagger: "2.0"
