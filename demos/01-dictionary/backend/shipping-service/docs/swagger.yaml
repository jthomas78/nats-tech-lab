basePath: /
definitions:
  commands.ContainerInput:
    properties:
      cargo:
        description: register
        type: string
      containerID:
        description: ISO 6346, e.g. TCKU1234567
        type: string
      context:
        description: fleet / KV-bucket qualifier
        type: string
      destPort:
        description: register
        type: string
      originPort:
        description: register
        type: string
      shipID:
        description: load / unload
        type: string
    type: object
  commands.ShipCorrectionInput:
    properties:
      context:
        type: string
      newShipID:
        type: string
      shipID:
        type: string
    type: object
  commands.ShipInput:
    properties:
      context:
        description: fleet / KV-bucket qualifier
        type: string
      port:
        type: string
      shipID:
        type: string
      shipName:
        description: used on Register / first Arrive
        type: string
    type: object
  domain.ContainerState:
    properties:
      cargo:
        description: description of contents
        type: string
      containerID:
        description: ISO 6346 natural key, e.g. TCKU1234567
        type: string
      context:
        description: fleet / KV-key-prefix qualifier
        type: string
      destPort:
        type: string
      id:
        description: surrogate key (UUID) — aggregate identity
        type: string
      onShipID:
        description: set iff Status == on-ship
        type: string
      originPort:
        type: string
      status:
        $ref: '#/definitions/domain.ContainerStatus'
      terminalPort:
        description: set iff Status == in-terminal
        type: string
      updatedAt:
        type: string
    type: object
  domain.ContainerStatus:
    enum:
    - in-terminal
    - on-ship
    type: string
    x-enum-comments:
      ContainerInTerminal: in a port terminal yard
      ContainerOnShip: crane-loaded onto a ship
    x-enum-descriptions:
    - in a port terminal yard
    - crane-loaded onto a ship
    x-enum-varnames:
    - ContainerInTerminal
    - ContainerOnShip
  domain.PortRecord:
    properties:
      createdAt:
        type: string
      name:
        type: string
    type: object
  domain.ShipState:
    properties:
      context:
        description: fleet / KV-key-prefix qualifier
        type: string
      currentPort:
        description: '"" = at sea'
        type: string
      id:
        description: surrogate key (UUID) — aggregate identity
        type: string
      shipID:
        description: mutable natural key (call-sign / fleet code)
        type: string
      shipName:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.ShipStatus'
        description: AIS navigational status
      updatedAt:
        type: string
    type: object
  domain.ShipStatus:
    enum:
    - in-transit
    - docked
    - at-anchor
    - not-under-command
    - restricted-manoeuvrability
    type: string
    x-enum-comments:
      StatusAtAnchor: amber
      StatusDocked: green
      StatusInTransit: blue
      StatusNotUnderCommand: red
      StatusRestrictedManoeuvrability: orange
    x-enum-descriptions:
    - blue
    - green
    - amber
    - red
    - orange
    x-enum-varnames:
    - StatusInTransit
    - StatusDocked
    - StatusAtAnchor
    - StatusNotUnderCommand
    - StatusRestrictedManoeuvrability
  rest.containerResponse:
    properties:
      container:
        $ref: '#/definitions/domain.ContainerState'
    type: object
  rest.containersResponse:
    properties:
      containers:
        items:
          $ref: '#/definitions/domain.ContainerState'
        type: array
    type: object
  rest.errorResponse:
    properties:
      error:
        type: string
    type: object
  rest.metaValuesResponse:
    properties:
      values:
        items:
          type: string
        type: array
    type: object
  rest.portsTableResponse:
    properties:
      rows:
        items:
          $ref: '#/definitions/domain.PortRecord'
        type: array
    type: object
  rest.refdataDemoResponse:
    properties:
      code:
        type: string
      description:
        type: string
      label:
        type: string
      source:
        description: '"kv-cache" | "api-refetch"'
        type: string
      status:
        type: string
    type: object
  rest.refdataItemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.refdataDemoResponse'
        type: array
    type: object
  rest.registerPortInput:
    properties:
      context:
        type: string
      name:
        type: string
    type: object
  rest.shipBResponse:
    properties:
      cacheHit:
        type: boolean
      ship:
        $ref: '#/definitions/domain.ShipState'
      source:
        description: '"kv-cache" or "postgres"'
        type: string
    type: object
  rest.shipResponse:
    properties:
      ship:
        $ref: '#/definitions/domain.ShipState'
    type: object
  rest.switchTenantRequest:
    properties:
      tenant:
        type: string
    type: object
  rest.tenantResponse:
    properties:
      available:
        items:
          type: string
        type: array
      tenant:
        type: string
    type: object
host: localhost:7200
info:
  contact: {}
  description: Shipping domain backend for the NATS Tech Lab POC. Demonstrates JetStream
    event sourcing with a NATS KV cache in front of a canonical Postgres projection.
  title: EventSourcing CQRS POC — Shipping API
  version: "1.0"
paths:
  /api/admin/ports/{context}:
    get:
      description: Every row of the Postgres ports table for the fleet context — name
        and registration time. Backs the admin "Postgres Tables" panel; distinct from
        GET /api/ports/{context}, which returns names only for dropdowns.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.portsTableResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Raw ports table (admin)
      tags:
      - admin
  /api/containers/{context}:
    get:
      description: Returns every container state in the context's KV projection.
      parameters:
      - description: Fleet context (e.g. acme)
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.containersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List all containers
      tags:
      - terminal
  /api/containers/load:
    post:
      consumes:
      - application/json
      description: Crane-loads a container onto a docked ship. Enforces BR-008, BR-010,
        BR-012 and BR-014 from one atomic replay of the SHIPPING stream (both aggregates
        share it in Phase 8). Publishes a container.loaded event.
      parameters:
      - description: context, containerID, shipID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ContainerInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.containerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "404":
          description: Container not registered
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Load container onto ship
      tags:
      - containers
  /api/containers/register:
    post:
      consumes:
      - application/json
      description: 'Registers a new container in its origin port''s terminal yard
        (BR-015: a container ID can only be registered once; BR-016: container ID
        must be TCKU + 7 digits). Publishes a container.registered event.'
      parameters:
      - description: context, containerID (ISO 6346), cargo, originPort, destPort
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ContainerInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.containerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Register container
      tags:
      - containers
  /api/containers/unload:
    post:
      consumes:
      - application/json
      description: Crane-unloads a container into the terminal at the ship's current
        port. Enforces BR-009, BR-011, BR-012 and BR-013. Publishes a container.unloaded
        event.
      parameters:
      - description: context, containerID, shipID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ContainerInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.containerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "404":
          description: Container not registered
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Unload container from ship
      tags:
      - containers
  /api/manifest/{context}/{shipID}:
    get:
      description: Returns the containers currently on the named ship (onShipID join)
        — the ship aggregate no longer carries a manifest itself.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier
        in: path
        name: shipID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.containersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Ship manifest
      tags:
      - terminal
  /api/meta/{context}/known-containers:
    get:
      description: Every container ID ever registered in the context. Backed by the
        meta.known-containers KV projection.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Known container IDs
      tags:
      - meta
  /api/ports:
    post:
      consumes:
      - application/json
      description: Adds a port to the fleet context's ports registry. Direct Postgres
        write, not an event — ports are reference data, not an event-sourced aggregate.
        Idempotent.
      parameters:
      - description: context, name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.registerPortInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Register a port
      tags:
      - ports
  /api/ports/{context}:
    get:
      description: Every port registered for the fleet context. Backed by the Postgres
        ports reference table (BR-017, BR-018) — plain master data, not event-derived.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List registered ports
      tags:
      - ports
  /api/refdata-demo/{context}/{type}/{code}:
    get:
      description: 'Demonstrates the Q5 versioned-read protocol from the consuming
        side: reads the refdata-service''s KV cache directly, falling through to its
        REST API (which also backfills the cache) on a miss or a stale entry.'
      parameters:
      - description: company/business-unit context (e.g. acme)
        in: path
        name: context
        required: true
        type: string
      - description: dictionary type key (e.g. hazard-class)
        in: path
        name: type
        required: true
        type: string
      - description: item code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.refdataDemoResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Get a reference-data item (Phase 11.3 cross-service consumer demo)
      tags:
      - refdata-demo
  /api/refdata-watch:
    get:
      description: 'Server-Sent Events stream of refdata-service''s evt.{tenant}.refdata.*.changed
        change-event pointers (the REFDATA JetStream stream) — drives live label refresh
        in the shipping UIs. This subscribes to refdata-service''s published event
        contract rather than watching its KV cache directly (BR-D08: that cache is
        internal to refdata-service). No historical replay — a client refetches its
        label map once via REST on connect, so this stream only needs to signal "something
        changed" going forward. No fleet-context param — the refdata company context
        is derived from the active tenant (Phase 16f, refdataCompanyContext), not
        a path param.'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE stream — data: {watchEvent JSON}'
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Refdata change-event stream (SSE, Phase 12.12)
      tags:
      - streams
  /api/refdata/contexts:
    get:
      description: Returns the context values visible to the currently active tenant
        — its own contexts plus the shared "_"-reserved platform roots — replacing
        the frontend's previously hardcoded context list.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List this tenant's reference-data contexts (Phase 16f)
      tags:
      - refdata
  /api/refdata/locales:
    get:
      description: Returns the locales registered for the active tenant's refdata
        company context (Phase 16f), for the frontend locale switcher.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List reference-data locales (Phase 11.6)
      tags:
      - refdata
  /api/refdata/types/{type}:
    get:
      description: Returns every item of a dictionary type under the active tenant's
        refdata company context (Phase 16f), each with its label resolved for the
        requested locale (BR-D03 fallback). Read KV-first via the Q5 protocol; per-item
        source is "kv-cache" or "api-refetch".
      parameters:
      - description: dictionary type key (e.g. ship-status)
        in: path
        name: type
        required: true
        type: string
      - description: locale to resolve labels in (e.g. en, es)
        in: query
        name: locale
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.refdataItemsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Resolve all items of a reference-data type (Phase 11.6)
      tags:
      - refdata
  /api/shape-b/cache/{context}/{shipID}:
    delete:
      description: Deletes the KV cache entry for a ship in the Shape B bucket. The
        next read will miss and fall through to Postgres, demonstrating the cache-miss
        path.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier
        in: path
        name: shipID
        required: true
        type: string
      responses:
        "204":
          description: Cache entry evicted
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Evict Shape B cache entry
      tags:
      - shape-b
  /api/shape-b/ships/{context}/{shipID}:
    get:
      description: 'Returns current ship state from the Shape B read model: checks
        KV cache first, falls through to Postgres on a miss and backfills the cache.'
      parameters:
      - description: Fleet context (e.g. acme, acme-atlantic-fleet)
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier (e.g. orient-express)
        in: path
        name: shipID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.shipBResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Get ship (Shape B — KV cache → Postgres)
      tags:
      - shape-b
  /api/ships/arrive:
    post:
      consumes:
      - application/json
      description: Ship arrives at a port. Validates domain rules (must not already
        be docked), then publishes a ship.arrived event to JetStream.
      parameters:
      - description: context, shipID, shipName (first arrival only), port
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Arrive at port
      tags:
      - ships
  /api/ships/correct-id:
    post:
      consumes:
      - application/json
      description: 'Renames a registered ship''s natural key (BR-022: newShipID must
        be valid and not currently in use by another ship in the context), preserving
        its surrogate identity. Publishes a ship.corrected event.'
      parameters:
      - description: context, shipID, newShipID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipCorrectionInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Correct a ship's shipID
      tags:
      - ships
  /api/ships/depart:
    post:
      consumes:
      - application/json
      description: Ship departs from a port. Validates that the ship is currently
        docked at the named port, then publishes a ship.departed event.
      parameters:
      - description: context, shipID, port
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Depart from port
      tags:
      - ships
  /api/ships/register:
    post:
      consumes:
      - application/json
      description: 'Mints a ship''s surrogate identity explicitly (BR-021: a shipID
        can only be registered once). Optional — ArrivePort mints one implicitly on
        a ship''s first arrival. Publishes a ship.registered event.'
      parameters:
      - description: context, shipID, shipName
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Register ship
      tags:
      - ships
  /api/tenant:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.tenantResponse'
      summary: Active tenant + switchable tenant list
      tags:
      - tenant
  /api/tenant/switch:
    post:
      consumes:
      - application/json
      description: Reconnects shipping-service's tenant-scoped NATS connection under
        a different account and rebinds every ship/container resource to it. The previous
        tenant's data becomes unreachable because the server enforces the account
        boundary, not because of an application-level filter.
      parameters:
      - description: target tenant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.switchTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.tenantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Switch the active tenant (Phase 13b)
      tags:
      - tenant
  /api/terminal/{context}/{port}:
    get:
      description: Returns the containers currently in-terminal at the given port
        (terminalPort match — no status branching).
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      - description: Port name (e.g. Hamburg)
        in: path
        name: port
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.containersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Containers in a terminal yard
      tags:
      - terminal
swagger: "2.0"
