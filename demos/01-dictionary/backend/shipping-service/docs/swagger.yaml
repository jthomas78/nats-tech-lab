basePath: /
definitions:
  commands.ContainerInput:
    properties:
      cargo:
        description: register
        type: string
      containerID:
        description: ISO 6346, e.g. TCKU1234567
        type: string
      context:
        description: fleet / KV-bucket qualifier
        type: string
      destPort:
        description: register
        type: string
      originPort:
        description: register
        type: string
      shipID:
        description: load / unload
        type: string
    type: object
  commands.ShipCorrectionInput:
    properties:
      context:
        type: string
      newShipID:
        type: string
      shipID:
        type: string
    type: object
  commands.ShipInput:
    properties:
      context:
        description: fleet / KV-bucket qualifier
        type: string
      port:
        type: string
      shipID:
        type: string
      shipName:
        description: used on Register / first Arrive
        type: string
    type: object
  domain.ContainerState:
    properties:
      cargo:
        description: description of contents
        type: string
      containerID:
        description: ISO 6346 natural key, e.g. TCKU1234567
        type: string
      context:
        description: fleet / KV-key-prefix qualifier
        type: string
      destPort:
        type: string
      id:
        description: surrogate key (UUID) — aggregate identity
        type: string
      onShipID:
        description: set iff Status == on-ship
        type: string
      originPort:
        type: string
      status:
        $ref: '#/definitions/domain.ContainerStatus'
      terminalPort:
        description: set iff Status == in-terminal
        type: string
      updatedAt:
        type: string
    type: object
  domain.ContainerStatus:
    enum:
    - in-terminal
    - on-ship
    type: string
    x-enum-comments:
      ContainerInTerminal: in a port terminal yard
      ContainerOnShip: crane-loaded onto a ship
    x-enum-descriptions:
    - in a port terminal yard
    - crane-loaded onto a ship
    x-enum-varnames:
    - ContainerInTerminal
    - ContainerOnShip
  domain.PortRecord:
    properties:
      createdAt:
        type: string
      name:
        type: string
    type: object
  domain.ShipState:
    properties:
      context:
        description: fleet / KV-key-prefix qualifier
        type: string
      currentPort:
        description: '"" = at sea'
        type: string
      id:
        description: surrogate key (UUID) — aggregate identity
        type: string
      shipID:
        description: mutable natural key (call-sign / fleet code)
        type: string
      shipName:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.ShipStatus'
        description: AIS navigational status
      updatedAt:
        type: string
    type: object
  domain.ShipStatus:
    enum:
    - in-transit
    - docked
    - at-anchor
    - not-under-command
    - restricted-manoeuvrability
    type: string
    x-enum-comments:
      StatusAtAnchor: amber
      StatusDocked: green
      StatusInTransit: blue
      StatusNotUnderCommand: red
      StatusRestrictedManoeuvrability: orange
    x-enum-descriptions:
    - blue
    - green
    - amber
    - red
    - orange
    x-enum-varnames:
    - StatusInTransit
    - StatusDocked
    - StatusAtAnchor
    - StatusNotUnderCommand
    - StatusRestrictedManoeuvrability
  queries.FleetReconstruction:
    properties:
      containers:
        items:
          $ref: '#/definitions/domain.ContainerState'
        type: array
      fleet:
        items:
          $ref: '#/definitions/queries.ShipWithManifest'
        type: array
    type: object
  queries.ShipWithManifest:
    properties:
      context:
        description: fleet / KV-key-prefix qualifier
        type: string
      currentPort:
        description: '"" = at sea'
        type: string
      id:
        description: surrogate key (UUID) — aggregate identity
        type: string
      manifest:
        items:
          $ref: '#/definitions/domain.ContainerState'
        type: array
      shipID:
        description: mutable natural key (call-sign / fleet code)
        type: string
      shipName:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.ShipStatus'
        description: AIS navigational status
      updatedAt:
        type: string
    type: object
  rest.accountActivity:
    properties:
      account:
        type: string
      connections:
        type: integer
      inBytes:
        type: integer
      inMsgs:
        type: integer
      leafNodes:
        type: integer
      outBytes:
        type: integer
      outMsgs:
        type: integer
      slowConsumers:
        description: |-
          SlowConsumers is the one field on this endpoint an operator has to act
          on — a subscriber on this account isn't draining fast enough and the
          server is dropping messages to it. Every other field here is routine
          traffic; the Admin UI renders this one as an alarm, not a stat (see
          AccountActivityPanel.vue).
        type: integer
      subscriptions:
        type: integer
      tenantLabel:
        type: string
      totalConnections:
        type: integer
    type: object
  rest.connzPage:
    properties:
      limit:
        type: integer
      numConnections:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  rest.containerResponse:
    properties:
      container:
        $ref: '#/definitions/domain.ContainerState'
    type: object
  rest.containersResponse:
    properties:
      containers:
        items:
          $ref: '#/definitions/domain.ContainerState'
        type: array
    type: object
  rest.errorResponse:
    properties:
      error:
        type: string
    type: object
  rest.jsEvent:
    properties:
      payload:
        type: object
      seq:
        type: integer
      subject:
        type: string
      timestamp:
        type: string
    type: object
  rest.jsStream:
    properties:
      account:
        type: string
      bytes:
        type: integer
      consumers:
        type: integer
      firstSeq:
        type: integer
      lastSeq:
        type: integer
      messages:
        type: integer
      stream:
        type: string
      subjects:
        type: integer
    type: object
  rest.jsStreamsResponse:
    properties:
      streams:
        items:
          $ref: '#/definitions/rest.jsStream'
        type: array
    type: object
  rest.kvBucket:
    properties:
      account:
        type: string
      backingStore:
        type: string
      bucket:
        type: string
      bytes:
        type: integer
      history:
        type: integer
      ttlSeconds:
        type: integer
      values:
        type: integer
    type: object
  rest.kvBucketsResponse:
    properties:
      buckets:
        items:
          $ref: '#/definitions/rest.kvBucket'
        type: array
    type: object
  rest.kvChange:
    properties:
      created:
        type: string
      key:
        type: string
      op:
        description: PUT, DEL, PURGE
        type: string
      revision:
        type: integer
      value:
        type: object
    type: object
  rest.metaValuesResponse:
    properties:
      values:
        items:
          type: string
        type: array
    type: object
  rest.natsAccountActivityResponse:
    properties:
      accounts:
        items:
          $ref: '#/definitions/rest.accountActivity'
        type: array
    type: object
  rest.natsConnection:
    properties:
      account:
        type: string
      cid:
        type: integer
      idle:
        type: string
      inBytes:
        type: integer
      inMsgs:
        type: integer
      ip:
        type: string
      lang:
        type: string
      lastActivity:
        type: string
      name:
        type: string
      outBytes:
        type: integer
      outMsgs:
        type: integer
      port:
        type: integer
      rtt:
        type: string
      start:
        type: string
      subscriptions:
        type: integer
      subscriptionsList:
        items:
          type: string
        type: array
      tenantLabel:
        description: |-
          TenantLabel is set when this connection is one shipping-service holds
          itself (matched by local socket address — see tenantLabelsByLocalAddr)
          — "PLATFORM" for deps.NC, or the friendly tenant name (e.g. "acme") for
          a TenantResources entry. Empty for every connection this process
          doesn't own (browser tabs, the nats CLI, refdata-service, ...): the
          raw Account NKey above is all that's available for those.
        type: string
      type:
        description: '"nats" | "websocket"'
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  rest.natsConnectionsResponse:
    properties:
      connections:
        items:
          $ref: '#/definitions/rest.natsConnection'
        type: array
      page:
        $ref: '#/definitions/rest.connzPage'
      server:
        $ref: '#/definitions/rest.natsServerLimits'
    type: object
  rest.natsEndpoint:
    properties:
      averageProcessingTimeMs:
        type: integer
      lastError:
        type: string
      name:
        type: string
      numErrors:
        type: integer
      numRequests:
        type: integer
      queueGroup:
        type: string
      subject:
        type: string
    type: object
  rest.natsLogResponse:
    properties:
      lines:
        items:
          type: string
        type: array
      truncated:
        description: |-
          Truncated is true when more matching lines existed than natsLogMaxTail
          (or the caller's smaller ?tail=) could return — lets the UI say "showing
          the most recent N" instead of implying this is the complete history.
        type: boolean
    type: object
  rest.natsServerLimits:
    properties:
      maxConnections:
        type: integer
    type: object
  rest.natsService:
    properties:
      instances:
        items:
          $ref: '#/definitions/rest.natsServiceInstance'
        type: array
      name:
        type: string
      version:
        type: string
    type: object
  rest.natsServiceInstance:
    properties:
      endpoints:
        items:
          $ref: '#/definitions/rest.natsEndpoint'
        type: array
      id:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      started:
        type: string
    type: object
  rest.natsServicesResponse:
    properties:
      services:
        items:
          $ref: '#/definitions/rest.natsService'
        type: array
    type: object
  rest.portsTableResponse:
    properties:
      rows:
        items:
          $ref: '#/definitions/domain.PortRecord'
        type: array
    type: object
  rest.refdataDemoResponse:
    properties:
      code:
        type: string
      description:
        type: string
      label:
        type: string
      source:
        description: '"kv-cache" | "api-refetch"'
        type: string
      status:
        type: string
    type: object
  rest.refdataItemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.refdataDemoResponse'
        type: array
    type: object
  rest.registerPortInput:
    properties:
      context:
        type: string
      name:
        type: string
    type: object
  rest.shipBResponse:
    properties:
      cacheHit:
        type: boolean
      ship:
        $ref: '#/definitions/domain.ShipState'
      source:
        description: '"kv-cache" or "postgres"'
        type: string
    type: object
  rest.shipResponse:
    properties:
      ship:
        $ref: '#/definitions/domain.ShipState'
    type: object
  rest.switchTenantRequest:
    properties:
      tenant:
        type: string
    type: object
  rest.tenantResponse:
    properties:
      available:
        items:
          type: string
        type: array
      tenant:
        type: string
    type: object
host: localhost:7200
info:
  contact: {}
  description: Shipping domain backend for the NATS Tech Lab POC. Demonstrates JetStream
    event sourcing, NATS KV projections (Shape A / Shape B), and pure event reconstruction
    (Shape C).
  title: EventSourcing CQRS POC — Shipping API
  version: "1.0"
paths:
  /api/admin/ports/{context}:
    get:
      description: Every row of the Postgres ports table for the fleet context — name
        and registration time. Backs the admin "Postgres Tables" panel; distinct from
        GET /api/ports/{context}, which returns names only for dropdowns.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.portsTableResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Raw ports table (admin)
      tags:
      - admin
  /api/containers/{context}:
    get:
      description: Returns every container state in the context's KV projection.
      parameters:
      - description: Fleet context (e.g. acme)
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.containersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List all containers
      tags:
      - terminal
  /api/containers/load:
    post:
      consumes:
      - application/json
      description: Crane-loads a container onto a docked ship. Enforces BR-008, BR-010,
        BR-012 and BR-014 from one atomic replay of the SHIPPING stream (both aggregates
        share it in Phase 8). Publishes a container.loaded event.
      parameters:
      - description: context, containerID, shipID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ContainerInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.containerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "404":
          description: Container not registered
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Load container onto ship
      tags:
      - containers
  /api/containers/register:
    post:
      consumes:
      - application/json
      description: 'Registers a new container in its origin port''s terminal yard
        (BR-015: a container ID can only be registered once; BR-016: container ID
        must be TCKU + 7 digits). Publishes a container.registered event.'
      parameters:
      - description: context, containerID (ISO 6346), cargo, originPort, destPort
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ContainerInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.containerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Register container
      tags:
      - containers
  /api/containers/unload:
    post:
      consumes:
      - application/json
      description: Crane-unloads a container into the terminal at the ship's current
        port. Enforces BR-009, BR-011, BR-012 and BR-013. Publishes a container.unloaded
        event.
      parameters:
      - description: context, containerID, shipID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ContainerInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.containerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "404":
          description: Container not registered
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Unload container from ship
      tags:
      - containers
  /api/jetstream/replay:
    get:
      description: 'Returns every currently-retained raw JetStream message from one
        account''s stream as a single JSON array, snapshotted at request time. Replaces
        replayJetStream''s SSE full-history half — the Admin UI now does one bootstrap
        fetch here, then subscribes to notify.{context}.shipping.raw.{entity}.{event}
        (eventhandler.publishRawNotify) for anything published afterward, instead
        of holding an SSE connection open. Because this snapshot is backend-mediated
        it works for ANY account listStreams reports, not just the browser''s own
        — but the notify.* live tail does not: NATS enforces account isolation at
        the server, so a browser can only subscribe within the account its own connection
        authenticated as.'
      parameters:
      - description: NATS account (a known tenant name, or \
        in: query
        name: account
        type: string
      - description: Stream name (default SHIPPING)
        in: query
        name: stream
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rest.jsEvent'
            type: array
        "400":
          description: Unknown account or stream
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: JetStream one-shot replay (Phase 23)
      tags:
      - streams
  /api/jetstream/streams:
    get:
      description: 'Every event stream registered across every NATS account this backend
        holds a connection to — each known tenant''s SHIPPING plus the PLATFORM account''s
        REFDATA/RPCTRACE — tagged with its account and carrying run-time status (message
        count, bytes, configured subject count, first/last sequence, consumer count).
        Deliberately NOT scoped to the topbar''s currently-selected tenant: a tenant
        switch reconnects Deps.JS for command/query traffic, but this is a read-only
        cross-account diagnostic view (same rationale as /api/kv/buckets). KV_* streams
        are NATS'' internal backing storage for KV buckets, not event streams a client
        watches for messages, so they''re excluded — /api/kv/buckets reports those
        as buckets instead.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.jsStreamsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List registered streams
      tags:
      - streams
  /api/kv/buckets:
    get:
      description: 'Every Key-Value bucket registered across every NATS account this
        backend holds a connection to — every known tenant (dict-a, dict-b, container,
        meta) plus the PLATFORM account (refdata-service''s versioned caches) — each
        tagged with its account. Deliberately NOT scoped to the topbar''s currently-selected
        tenant: a tenant switch reconnects Deps.JS for command/query traffic, but
        this is a read-only cross-account diagnostic view.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.kvBucketsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List KV buckets
      tags:
      - kv
  /api/kv/buckets/{account}/{bucket}/entries:
    get:
      description: Returns every current entry in one KV bucket as a single JSON array,
        snapshotted at request time — the bootstrap half of watchKVBucket's old SSE
        stream (Live=false entries only). Live changes after this snapshot arrive
        via notify.{context}.kv.{bucket}.{key}.changed (internal/kvstore.Store.EnableNotify)
        instead of holding a connection open.
      parameters:
      - description: NATS account (a known tenant name, or \
        in: path
        name: account
        required: true
        type: string
      - description: KV bucket name (e.g. dict-a, dict-b, container, meta)
        in: path
        name: bucket
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rest.kvChange'
            type: array
        "400":
          description: Unknown account or bucket
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: One-shot KV bucket entries (Phase 23)
      tags:
      - kv
  /api/manifest/{context}/{shipID}:
    get:
      description: Returns the containers currently on the named ship (onShipID join)
        — the ship aggregate no longer carries a manifest itself.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier
        in: path
        name: shipID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.containersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Ship manifest
      tags:
      - terminal
  /api/meta/{context}/known-containers:
    get:
      description: Every container ID ever registered in the context. Backed by the
        meta.known-containers KV projection.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Known container IDs
      tags:
      - meta
  /api/nats/account-activity:
    get:
      description: 'Per-account traffic and health, proxying the server''s own /accstatz
        monitoring endpoint, reshaped to camelCase. Complements Connections (every
        raw socket) and Services (every registered endpoint) with the account-level
        rollup: connection/subscription counts, message/byte volume, and slowConsumers,
        the one field here that means a subscriber on that account is not draining
        fast enough and the server is dropping messages to it. tenantLabel is resolved
        the same best-effort way Connections/Services do (BR-028) from a secondary
        /connz read: present when this process can identify the account, empty otherwise,
        and never something a failed /connz probe costs the caller the activity rollup
        over.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.natsAccountActivityResponse'
        "502":
          description: NATS monitoring endpoint unreachable or returned an unexpected
            body
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List NATS account activity
      tags:
      - nats
  /api/nats/connections:
    get:
      description: 'Every active connection on the NATS server, across all accounts
        — proxies the server''s own /connz monitoring endpoint (subs=true&auth=true),
        reshaped to camelCase. Independent of the active tenant: this is server-wide,
        not fleet-context-scoped. The page object passes through /connz''s paging
        envelope (total/offset/limit/numConnections) so a caller can tell a complete
        snapshot from one page of several; limit there is the server''s page size
        (default 1024), not max_connections. The server object carries the real ceiling,
        maxConnections, read from /varz — 0 when /varz was unreachable, which is a
        secondary read this endpoint absorbs rather than failing on.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.natsConnectionsResponse'
        "502":
          description: NATS monitoring endpoint unreachable or returned an unexpected
            body
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List NATS connections
      tags:
      - nats
  /api/nats/log:
    get:
      description: The last N lines of NATS's own log_file, optionally filtered by
        level ([ERR]/[WRN]/[INF]/[DBG]/[TRC]) and/or a free-text substring — REST-polled,
        not a push/follow transport. tail is capped server-side at 1000 regardless
        of what's requested. Returns 503 if NatsLogPath was never configured (e.g.
        running outside Docker).
      parameters:
      - description: error|warn|info|debug|trace — omit for all levels
        in: query
        name: level
        type: string
      - description: case-insensitive substring filter, applied in addition to level
        in: query
        name: q
        type: string
      - description: number of matching lines to return (default 200, hard-capped
          at 1000)
        in: query
        name: tail
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.natsLogResponse'
        "503":
          description: log tailing not configured
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Tail the NATS server log
      tags:
      - nats
  /api/nats/services:
    get:
      description: Every service registered via nats.go/micro (see ARCHITECTURE-COMMUNICATIONS.md
        §4), discovered by broadcasting $SRV.STATS and collecting replies for a short
        window — the same protocol `nats micro stats` uses. Queried on both the PLATFORM
        account (deps.NC, where refdata-service registers) and the active tenant's
        account (deps.TenantNC, where shipping-service's browserrpc adapter registers);
        $SRV subjects don't cross account boundaries, so a service registered on a
        different account (e.g. accounts-service, which registers on the SYS account)
        will not appear.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.natsServicesResponse'
      summary: List NATS micro services
      tags:
      - nats
  /api/ports:
    post:
      consumes:
      - application/json
      description: Adds a port to the fleet context's ports registry. Direct Postgres
        write, not an event — ports are reference data, not an event-sourced aggregate.
        Idempotent.
      parameters:
      - description: context, name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.registerPortInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Register a port
      tags:
      - ports
  /api/ports/{context}:
    get:
      description: Every port registered for the fleet context. Backed by the Postgres
        ports reference table (BR-017, BR-018) — plain master data, not event-derived.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List registered ports
      tags:
      - ports
  /api/refdata-demo/{context}/{type}/{code}:
    get:
      description: 'Demonstrates the Q5 versioned-read protocol from the consuming
        side: reads the refdata-service''s KV cache directly, falling through to its
        REST API (which also backfills the cache) on a miss or a stale entry.'
      parameters:
      - description: company/business-unit context (e.g. acme)
        in: path
        name: context
        required: true
        type: string
      - description: dictionary type key (e.g. hazard-class)
        in: path
        name: type
        required: true
        type: string
      - description: item code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.refdataDemoResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Get a reference-data item (Phase 11.3 cross-service consumer demo)
      tags:
      - refdata-demo
  /api/refdata-watch:
    get:
      description: 'Server-Sent Events stream of refdata-service''s evt.{tenant}.refdata.*.changed
        change-event pointers (the REFDATA JetStream stream) — drives live label refresh
        in the shipping UIs. This subscribes to refdata-service''s published event
        contract rather than watching its KV cache directly (BR-D08: that cache is
        internal to refdata-service). No historical replay — a client refetches its
        label map once via REST on connect, so this stream only needs to signal "something
        changed" going forward. No fleet-context param — the refdata company context
        is derived from the active tenant (Phase 16f, refdataCompanyContext), not
        a path param.'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE stream — data: {watchEvent JSON}'
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Refdata change-event stream (SSE, Phase 12.12)
      tags:
      - streams
  /api/refdata/contexts:
    get:
      description: Returns the context values visible to the currently active tenant
        — its own contexts plus the shared "_"-reserved platform roots — replacing
        the frontend's previously hardcoded context list.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List this tenant's reference-data contexts (Phase 16f)
      tags:
      - refdata
  /api/refdata/locales:
    get:
      description: Returns the locales registered for the active tenant's refdata
        company context (Phase 16f), for the frontend locale switcher.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List reference-data locales (Phase 11.6)
      tags:
      - refdata
  /api/refdata/types/{type}:
    get:
      description: Returns every item of a dictionary type under the active tenant's
        refdata company context (Phase 16f), each with its label resolved for the
        requested locale (BR-D03 fallback). Read KV-first via the Q5 protocol; per-item
        source is "kv-cache" or "api-refetch".
      parameters:
      - description: dictionary type key (e.g. ship-status)
        in: path
        name: type
        required: true
        type: string
      - description: locale to resolve labels in (e.g. en, es)
        in: query
        name: locale
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.refdataItemsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Resolve all items of a reference-data type (Phase 11.6)
      tags:
      - refdata
  /api/shape-b/cache/{context}/{shipID}:
    delete:
      description: Deletes the KV cache entry for a ship in the Shape B bucket. The
        next read will miss and fall through to Postgres, demonstrating the cache-miss
        path.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier
        in: path
        name: shipID
        required: true
        type: string
      responses:
        "204":
          description: Cache entry evicted
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Evict Shape B cache entry
      tags:
      - shape-b
  /api/shape-b/ships/{context}/{shipID}:
    get:
      description: 'Returns current ship state from the Shape B read model: checks
        KV cache first, falls through to Postgres on a miss and backfills the cache.'
      parameters:
      - description: Fleet context (e.g. acme, acme-atlantic-fleet)
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier (e.g. orient-express)
        in: path
        name: shipID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.shipBResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Get ship (Shape B — KV cache → Postgres)
      tags:
      - shape-b
  /api/shape-c/fleet:
    get:
      description: 'Replays the full JetStream event log from seq=1 and reconstructs
        current state: ship.* events fold into ShipAggregates, container.* events
        into ContainerAggregates, and each ship''s manifest is the onShipID join.
        No KV or Postgres involved.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/queries.FleetReconstruction'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Reconstruct fleet (Shape C — pure event sourcing)
      tags:
      - shape-c
  /api/ships/arrive:
    post:
      consumes:
      - application/json
      description: Ship arrives at a port. Validates domain rules (must not already
        be docked), then publishes a ship.arrived event to JetStream.
      parameters:
      - description: context, shipID, shipName (first arrival only), port
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Arrive at port
      tags:
      - ships
  /api/ships/correct-id:
    post:
      consumes:
      - application/json
      description: 'Renames a registered ship''s natural key (BR-022: newShipID must
        be valid and not currently in use by another ship in the context), preserving
        its surrogate identity. Publishes a ship.corrected event.'
      parameters:
      - description: context, shipID, newShipID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipCorrectionInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Correct a ship's shipID
      tags:
      - ships
  /api/ships/depart:
    post:
      consumes:
      - application/json
      description: Ship departs from a port. Validates that the ship is currently
        docked at the named port, then publishes a ship.departed event.
      parameters:
      - description: context, shipID, port
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Depart from port
      tags:
      - ships
  /api/ships/register:
    post:
      consumes:
      - application/json
      description: 'Mints a ship''s surrogate identity explicitly (BR-021: a shipID
        can only be registered once). Optional — ArrivePort mints one implicitly on
        a ship''s first arrival. Publishes a ship.registered event.'
      parameters:
      - description: context, shipID, shipName
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Register ship
      tags:
      - ships
  /api/tenant:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.tenantResponse'
      summary: Active tenant + switchable tenant list
      tags:
      - tenant
  /api/tenant/switch:
    post:
      consumes:
      - application/json
      description: Reconnects shipping-service's tenant-scoped NATS connection under
        a different account and rebinds every ship/container resource to it. The previous
        tenant's data becomes unreachable because the server enforces the account
        boundary, not because of an application-level filter.
      parameters:
      - description: target tenant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.switchTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.tenantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Switch the active tenant (Phase 13b)
      tags:
      - tenant
  /api/terminal/{context}/{port}:
    get:
      description: Returns the containers currently in-terminal at the given port
        (terminalPort match — no status branching).
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      - description: Port name (e.g. Hamburg)
        in: path
        name: port
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.containersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Containers in a terminal yard
      tags:
      - terminal
swagger: "2.0"
