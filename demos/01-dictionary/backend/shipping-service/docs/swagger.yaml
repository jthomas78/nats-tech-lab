basePath: /
definitions:
  domain.PortRecord:
    properties:
      createdAt:
        type: string
      name:
        type: string
    type: object
  domain.ShipState:
    properties:
      context:
        description: fleet / KV-key-prefix qualifier
        type: string
      currentPort:
        description: '"" = at sea'
        type: string
      id:
        description: surrogate key (UUID) — aggregate identity
        type: string
      shipID:
        description: mutable natural key (call-sign / fleet code)
        type: string
      shipName:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.ShipStatus'
        description: AIS navigational status
      updatedAt:
        type: string
    type: object
  domain.ShipStatus:
    enum:
    - in-transit
    - docked
    - at-anchor
    - not-under-command
    - restricted-manoeuvrability
    type: string
    x-enum-comments:
      StatusAtAnchor: amber
      StatusDocked: green
      StatusInTransit: blue
      StatusNotUnderCommand: red
      StatusRestrictedManoeuvrability: orange
    x-enum-descriptions:
    - blue
    - green
    - amber
    - red
    - orange
    x-enum-varnames:
    - StatusInTransit
    - StatusDocked
    - StatusAtAnchor
    - StatusNotUnderCommand
    - StatusRestrictedManoeuvrability
  rest.errorResponse:
    properties:
      error:
        type: string
    type: object
  rest.portsTableResponse:
    properties:
      rows:
        items:
          $ref: '#/definitions/domain.PortRecord'
        type: array
    type: object
  rest.shipBResponse:
    properties:
      cacheHit:
        type: boolean
      ship:
        $ref: '#/definitions/domain.ShipState'
      source:
        description: '"kv-cache" or "postgres"'
        type: string
    type: object
  rest.switchTenantRequest:
    properties:
      tenant:
        type: string
    type: object
  rest.tenantResponse:
    properties:
      available:
        items:
          type: string
        type: array
      tenant:
        type: string
    type: object
host: localhost:7200
info:
  contact: {}
  description: Shipping domain backend for the NATS Tech Lab POC. Demonstrates JetStream
    event sourcing with a NATS KV cache in front of a canonical Postgres projection.
  title: EventSourcing CQRS POC — Shipping API
  version: "1.0"
paths:
  /api/admin/ports/{context}:
    get:
      description: Every row of the Postgres ports table for the fleet context — name
        and registration time. Backs the admin "Postgres Tables" panel; distinct from
        GET /api/ports/{context}, which returns names only for dropdowns.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.portsTableResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Raw ports table (admin)
      tags:
      - admin
  /api/admin/read-path/cache/{context}/{shipID}:
    delete:
      description: Evicts the ship's KV cache entry to demonstrate the cache-miss
        → Postgres fallthrough → backfill path. Admin diagnostics only, not a business
        route.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier
        in: path
        name: shipID
        required: true
        type: string
      responses:
        "204":
          description: Cache entry evicted
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Evict ship cache entry (admin read-path diagnostics)
      tags:
      - admin
  /api/admin/read-path/ships/{context}/{shipID}:
    get:
      description: 'Returns current ship state from the Shape B read model: checks
        KV cache first, falls through to Postgres on a miss and backfills the cache.
        Admin diagnostics only, not a business route.'
      parameters:
      - description: Fleet context (e.g. acme, acme-atlantic-fleet)
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier (e.g. orient-express)
        in: path
        name: shipID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.shipBResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Get ship (admin read-path diagnostics — KV cache → Postgres)
      tags:
      - admin
  /api/tenant:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.tenantResponse'
      summary: Active tenant + switchable tenant list
      tags:
      - tenant
  /api/tenant/switch:
    post:
      consumes:
      - application/json
      description: Reconnects shipping-service's tenant-scoped NATS connection under
        a different account and rebinds every ship/container resource to it. The previous
        tenant's data becomes unreachable because the server enforces the account
        boundary, not because of an application-level filter.
      parameters:
      - description: target tenant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.switchTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.tenantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Switch the active tenant (Phase 13b)
      tags:
      - tenant
swagger: "2.0"
