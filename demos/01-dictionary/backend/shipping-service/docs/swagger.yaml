basePath: /
definitions:
  commands.ContainerInput:
    properties:
      cargo:
        description: register
        type: string
      containerID:
        description: ISO 6346, e.g. TCKU1234567
        type: string
      context:
        description: fleet / KV-bucket qualifier
        type: string
      destPort:
        description: register
        type: string
      originPort:
        description: register
        type: string
      shipID:
        description: load / unload
        type: string
    type: object
  commands.ShipCorrectionInput:
    properties:
      context:
        type: string
      newShipID:
        type: string
      shipID:
        type: string
    type: object
  commands.ShipInput:
    properties:
      context:
        description: fleet / KV-bucket qualifier
        type: string
      port:
        type: string
      shipID:
        type: string
      shipName:
        description: used on Register / first Arrive
        type: string
    type: object
  domain.ContainerState:
    properties:
      cargo:
        description: description of contents
        type: string
      containerID:
        description: ISO 6346 natural key, e.g. TCKU1234567
        type: string
      context:
        description: fleet / KV-bucket qualifier
        type: string
      destPort:
        type: string
      id:
        description: surrogate key (UUID) — aggregate identity
        type: string
      onShipID:
        description: set iff Status == on-ship
        type: string
      originPort:
        type: string
      status:
        $ref: '#/definitions/domain.ContainerStatus'
      terminalPort:
        description: set iff Status == in-terminal
        type: string
      updatedAt:
        type: string
    type: object
  domain.ContainerStatus:
    enum:
    - in-terminal
    - on-ship
    type: string
    x-enum-comments:
      ContainerInTerminal: in a port terminal yard
      ContainerOnShip: crane-loaded onto a ship
    x-enum-descriptions:
    - in a port terminal yard
    - crane-loaded onto a ship
    x-enum-varnames:
    - ContainerInTerminal
    - ContainerOnShip
  domain.PortRecord:
    properties:
      createdAt:
        type: string
      name:
        type: string
    type: object
  domain.ShipState:
    properties:
      context:
        description: fleet / KV-bucket qualifier
        type: string
      currentPort:
        description: '"" = at sea'
        type: string
      id:
        description: surrogate key (UUID) — aggregate identity
        type: string
      shipID:
        description: mutable natural key (call-sign / fleet code)
        type: string
      shipName:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.ShipStatus'
        description: AIS navigational status
      updatedAt:
        type: string
    type: object
  domain.ShipStatus:
    enum:
    - in-transit
    - docked
    - at-anchor
    - not-under-command
    - restricted-manoeuvrability
    type: string
    x-enum-comments:
      StatusAtAnchor: amber
      StatusDocked: green
      StatusInTransit: blue
      StatusNotUnderCommand: red
      StatusRestrictedManoeuvrability: orange
    x-enum-descriptions:
    - blue
    - green
    - amber
    - red
    - orange
    x-enum-varnames:
    - StatusInTransit
    - StatusDocked
    - StatusAtAnchor
    - StatusNotUnderCommand
    - StatusRestrictedManoeuvrability
  queries.FleetReconstruction:
    properties:
      containers:
        items:
          $ref: '#/definitions/domain.ContainerState'
        type: array
      fleet:
        items:
          $ref: '#/definitions/queries.ShipWithManifest'
        type: array
    type: object
  queries.ShipWithManifest:
    properties:
      context:
        description: fleet / KV-bucket qualifier
        type: string
      currentPort:
        description: '"" = at sea'
        type: string
      id:
        description: surrogate key (UUID) — aggregate identity
        type: string
      manifest:
        items:
          $ref: '#/definitions/domain.ContainerState'
        type: array
      shipID:
        description: mutable natural key (call-sign / fleet code)
        type: string
      shipName:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.ShipStatus'
        description: AIS navigational status
      updatedAt:
        type: string
    type: object
  rest.containerResponse:
    properties:
      container:
        $ref: '#/definitions/domain.ContainerState'
    type: object
  rest.containersResponse:
    properties:
      containers:
        items:
          $ref: '#/definitions/domain.ContainerState'
        type: array
    type: object
  rest.errorResponse:
    properties:
      error:
        type: string
    type: object
  rest.kvBucket:
    properties:
      backingStore:
        type: string
      bucket:
        type: string
      bytes:
        type: integer
      history:
        type: integer
      ttlSeconds:
        type: integer
      values:
        type: integer
    type: object
  rest.kvBucketsResponse:
    properties:
      buckets:
        items:
          $ref: '#/definitions/rest.kvBucket'
        type: array
    type: object
  rest.metaValuesResponse:
    properties:
      values:
        items:
          type: string
        type: array
    type: object
  rest.portsTableResponse:
    properties:
      rows:
        items:
          $ref: '#/definitions/domain.PortRecord'
        type: array
    type: object
  rest.refdataDemoResponse:
    properties:
      attrs:
        additionalProperties: {}
        type: object
      code:
        type: string
      label:
        type: string
      source:
        description: '"kv-cache" | "api-refetch"'
        type: string
      status:
        type: string
    type: object
  rest.refdataItemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.refdataDemoResponse'
        type: array
    type: object
  rest.registerPortInput:
    properties:
      context:
        type: string
      name:
        type: string
    type: object
  rest.shipBResponse:
    properties:
      cacheHit:
        type: boolean
      ship:
        $ref: '#/definitions/domain.ShipState'
      source:
        description: '"kv-cache" or "postgres"'
        type: string
    type: object
  rest.shipResponse:
    properties:
      ship:
        $ref: '#/definitions/domain.ShipState'
    type: object
host: localhost:7200
info:
  contact: {}
  description: Shipping domain backend for the NATS Tech Lab POC. Demonstrates JetStream
    event sourcing, NATS KV projections (Shape A / Shape B), and pure event reconstruction
    (Shape C).
  title: EventSourcing CQRS POC — Shipping API
  version: "1.0"
paths:
  /api/admin/ports/{context}:
    get:
      description: Every row of the Postgres ports table for the fleet context — name
        and registration time. Backs the admin "Postgres Tables" panel; distinct from
        GET /api/ports/{context}, which returns names only for dropdowns.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.portsTableResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Raw ports table (admin)
      tags:
      - admin
  /api/containers/{context}:
    get:
      description: Returns every container state in the context's KV projection.
      parameters:
      - description: Fleet context (e.g. global)
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.containersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List all containers
      tags:
      - terminal
  /api/containers/load:
    post:
      consumes:
      - application/json
      description: Crane-loads a container onto a docked ship. Enforces BR-008, BR-010,
        BR-012 and BR-014 from one atomic replay of the SHIPPING stream (both aggregates
        share it in Phase 8). Publishes a container.loaded event.
      parameters:
      - description: context, containerID, shipID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ContainerInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.containerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "404":
          description: Container not registered
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Load container onto ship
      tags:
      - containers
  /api/containers/register:
    post:
      consumes:
      - application/json
      description: 'Registers a new container in its origin port''s terminal yard
        (BR-015: a container ID can only be registered once; BR-016: container ID
        must be TCKU + 7 digits). Publishes a container.registered event.'
      parameters:
      - description: context, containerID (ISO 6346), cargo, originPort, destPort
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ContainerInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.containerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Register container
      tags:
      - containers
  /api/containers/unload:
    post:
      consumes:
      - application/json
      description: Crane-unloads a container into the terminal at the ship's current
        port. Enforces BR-009, BR-011, BR-012 and BR-013. Publishes a container.unloaded
        event.
      parameters:
      - description: context, containerID, shipID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ContainerInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.containerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "404":
          description: Container not registered
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Unload container from ship
      tags:
      - containers
  /api/jetstream/stream:
    get:
      description: Server-Sent Events stream of raw emea.events.acme.> messages from
        SHIPPING using DeliverAll policy — replays from seq=1, then continues live.
        Each event is a JSON-encoded jsEvent object.
      parameters:
      - description: Stream name (default SHIPPING)
        in: query
        name: stream
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE stream — data: {jsEvent JSON}'
          schema:
            type: string
        "400":
          description: Unknown stream
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: JetStream full replay + live stream (SSE)
      tags:
      - streams
  /api/jetstream/streams:
    get:
      description: Names of every event stream registered on the NATS server (not
        just SHIPPING) — lets the frontend's stream picker reflect what's actually
        provisioned. KV_* streams are NATS' internal storage for KV buckets, not event
        streams a client watches for messages, so they're excluded.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List registered streams
      tags:
      - streams
  /api/jetstream/watch:
    get:
      description: Server-Sent Events stream of raw emea.events.acme.> messages from
        SHIPPING using DeliverNew policy — only messages published after connection.
        Each event is a JSON-encoded jsEvent object.
      parameters:
      - description: Stream name (default SHIPPING)
        in: query
        name: stream
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE stream — data: {jsEvent JSON}'
          schema:
            type: string
        "400":
          description: Unknown stream
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: JetStream live watch (SSE)
      tags:
      - streams
  /api/kv/buckets:
    get:
      description: Every Key-Value bucket registered on the NATS server, with run-time
        status (value count, history depth, size, TTL, backing store). Backs the KV
        inspector's bucket rail — the raw NATS KV stores this lab provisions (dict-a/dict-b/container/meta
        per fleet context, plus refdata-service's cache).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.kvBucketsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List KV buckets
      tags:
      - kv
  /api/kv/buckets/{bucket}/watch:
    get:
      description: Server-Sent Events stream for one KV bucket by full name. Replays
        the bucket's current entries first (Live=false), sends an INIT_DONE control
        event, then streams live changes (Live=true). One connection drives both the
        contents snapshot and the live update feed — the same WatchAll semantics the
        NATS KV watch model is built on.
      parameters:
      - description: KV bucket name (e.g. dict-a-global, refdata-emea-acme)
        in: path
        name: bucket
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE stream — data: {kvChange JSON}'
          schema:
            type: string
        "400":
          description: Unknown bucket
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Watch a KV bucket (SSE)
      tags:
      - kv
  /api/manifest/{context}/{shipID}:
    get:
      description: Returns the containers currently on the named ship (onShipID join)
        — the ship aggregate no longer carries a manifest itself.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier
        in: path
        name: shipID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.containersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Ship manifest
      tags:
      - terminal
  /api/meta/{context}/known-containers:
    get:
      description: Every container ID ever registered in the context. Backed by the
        meta.known-containers KV projection.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Known container IDs
      tags:
      - meta
  /api/ports:
    post:
      consumes:
      - application/json
      description: Adds a port to the fleet context's ports registry. Direct Postgres
        write, not an event — ports are reference data, not an event-sourced aggregate.
        Idempotent.
      parameters:
      - description: context, name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.registerPortInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Register a port
      tags:
      - ports
  /api/ports/{context}:
    get:
      description: Every port registered for the fleet context. Backed by the Postgres
        ports reference table (BR-017, BR-018) — plain master data, not event-derived.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List registered ports
      tags:
      - ports
  /api/refdata-demo/{context}/{type}/{code}:
    get:
      description: 'Demonstrates the Q5 versioned-read protocol from the consuming
        side: reads the refdata-service''s KV cache directly, falling through to its
        REST API (which also backfills the cache) on a miss or a stale entry.'
      parameters:
      - description: tenant/region context (e.g. emea-acme)
        in: path
        name: context
        required: true
        type: string
      - description: dictionary type key (e.g. hazard-class)
        in: path
        name: type
        required: true
        type: string
      - description: item code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.refdataDemoResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Get a reference-data item (Phase 11.3 cross-service consumer demo)
      tags:
      - refdata-demo
  /api/refdata-watch:
    get:
      description: Server-Sent Events stream of NATS KV changes in the refdata-{emea-acme}
        cache bucket the shipping backend reads (owned by refdata-service). Drives
        live label refresh in the shipping UIs. Fixed refdata context — no fleet-context
        param.
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE stream — data: {watchEvent JSON}'
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Refdata KV watch stream (SSE, Phase 11.6)
      tags:
      - streams
  /api/refdata/locales:
    get:
      description: Returns the locales registered for the fixed refdata context, for
        the frontend locale switcher.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.metaValuesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: List reference-data locales (Phase 11.6)
      tags:
      - refdata
  /api/refdata/types/{type}:
    get:
      description: Returns every item of a dictionary type under the fixed refdata
        context, each with its label resolved for the requested locale (BR-D03 fallback).
        Read KV-first via the Q5 protocol; per-item source is "kv-cache" or "api-refetch".
      parameters:
      - description: dictionary type key (e.g. ship-status)
        in: path
        name: type
        required: true
        type: string
      - description: locale to resolve labels in (e.g. en, es)
        in: query
        name: locale
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.refdataItemsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Resolve all items of a reference-data type (Phase 11.6)
      tags:
      - refdata
  /api/rpc-watch:
    get:
      description: Server-Sent Events stream of the refdata-service natsrpc adapter's
        best-effort obs.rpc.* observability side-channel — live only, no replay/backlog
        (core NATS subscribe while the request is open). Each event carries direction
        ("request"|"reply"), a correlationId pairing a request with its reply, the
        real rpc.* subject, and the payload. See ARCHITECTURE-COMMUNICATIONS.md §6.
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'SSE stream — data: {obs.rpc.* JSON}'
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: obs.rpc.* dual-transport RPC traffic stream (SSE, Phase 12.10)
      tags:
      - streams
  /api/shape-b/cache/{context}/{shipID}:
    delete:
      description: Deletes the KV cache entry for a ship in the Shape B bucket. The
        next read will miss and fall through to Postgres, demonstrating the cache-miss
        path.
      parameters:
      - description: Fleet context
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier
        in: path
        name: shipID
        required: true
        type: string
      responses:
        "204":
          description: Cache entry evicted
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Evict Shape B cache entry
      tags:
      - shape-b
  /api/shape-b/ships/{context}/{shipID}:
    get:
      description: 'Returns current ship state from the Shape B read model: checks
        KV cache first, falls through to Postgres on a miss and backfills the cache.'
      parameters:
      - description: Fleet context (e.g. global, atlantic-fleet)
        in: path
        name: context
        required: true
        type: string
      - description: Ship identifier (e.g. orient-express)
        in: path
        name: shipID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.shipBResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Get ship (Shape B — KV cache → Postgres)
      tags:
      - shape-b
  /api/shape-c/fleet:
    get:
      description: 'Replays the full JetStream event log from seq=1 and reconstructs
        current state: ship.* events fold into ShipAggregates, container.* events
        into ContainerAggregates, and each ship''s manifest is the onShipID join.
        No KV or Postgres involved.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/queries.FleetReconstruction'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Reconstruct fleet (Shape C — pure event sourcing)
      tags:
      - shape-c
  /api/ships/arrive:
    post:
      consumes:
      - application/json
      description: Ship arrives at a port. Validates domain rules (must not already
        be docked), then publishes a ship.arrived event to JetStream.
      parameters:
      - description: context, shipID, shipName (first arrival only), port
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.errorResponse'
        "422":
          description: Domain rule violation
          schema:
            $ref: '#/definitions/rest.errorResponse'
      summary: Arrive at port
      tags:
      - ships
  /api/ships/correct-id:
    post:
      consumes:
      - application/json
      description: 'Renames a registered ship''s natural key (BR-022: newShipID must
        be valid and not currently in use by another ship in the context), preserving
        its surrogate identity. Publishes a ship.corrected event.'
      parameters:
      - description: context, shipID, newShipID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/commands.ShipCorrectionInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/rest.shipResponse'
        "400":
