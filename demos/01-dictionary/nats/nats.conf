# NATS server config for demo 01 — equivalent to the previous CLI flags
# (-js -sd /data -m 8222), plus a websocket listener for nats-ui (under
# review): the nats-ui browser page connects client-side via WebSocket to
# ws://localhost:9222 by default, which is a separate listener from the
# plain client port (4222) and only configurable via a config file — there
# is no nats-server CLI flag for it.

port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
}

websocket {
  port: 9222
  no_tls: true
}

# Phase 14a — Operator Mode (.claude/plans/Main-POC-Plan.md, Phase 14).
# Replaces Phase 13a's static accounts{} block (no_auth_user, plaintext
# user/password pairs) with decentralized JWTs: every account is now
# defined by a JWT the server resolves at runtime rather than a config
# block requiring a restart to change. Generated by ./bootstrap-operator.sh
# (nsc CLI) — see that script's header for what's regenerable and what
# would need real secret management outside a lab.
#
# DEFAULT/ACME/GLOBEX carry the identical JetStream limits Phase 13a used
# (1G/5G/20/100, 256M/1G/10/20 x2) — this phase changes the auth mechanism,
# not the tenancy shape. Every service now connects with a .creds file
# (nats/creds/*.creds) instead of a bare user/password. SYS is required for
# $SYS.REQ.CLAIMS.UPDATE/DELETE — how Phase 14b's accounts-service mints
# and revokes accounts at runtime.
operator: /etc/nats/operator.jwt
system_account: ABS6H4HBPU4ZVCTWCY6RZIVEAIE37CE7VKCQMJANMLO7YJZ2IELZAFJT

# resolver: full + resolver_preload means new accounts (Phase 14b's
# accounts-service) can be added at runtime via $SYS.REQ.CLAIMS.UPDATE —
# no nats.conf edit, no server restart. allow_delete lets a suspended
# tenant's account be revoked the same way. dir is inside the JetStream
# store_dir's volume so pushed JWTs survive a container restart (but not
# `docker compose down -v` — same as JetStream's own /data).
resolver: {
  type: full
  dir: "/data/jwt"
  allow_delete: true
  interval: "2m"
}

resolver_preload: {
