# NATS server config for demo 01 — equivalent to the previous CLI flags
# (-js -sd /data -m 8222), plus a websocket listener for nats-ui (under
# review): the nats-ui browser page connects client-side via WebSocket to
# ws://localhost:9222 by default, which is a separate listener from the
# plain client port (4222) and only configurable via a config file — there
# is no nats-server CLI flag for it.

port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
}

websocket {
  port: 9222
  no_tls: true
}

# Phase 13a — NATS Accounts Tenancy Spike (.claude/plans/Main-POC-Plan.md,
# Phase 13). Additive only: DEFAULT preserves today's behavior for
# shipping-service, refdata-service, and all three frontends via
# `no_auth_user` — none of them need code or credential changes. ACME and
# GLOBEX are spike-only tenant accounts with no exports/imports between them
# or with DEFAULT, so JetStream (streams, consumers, KV buckets) is fully
# isolated per account — proven in
# shipping-service/internal/natsaccounts/isolation_test.go, not assumed.
#
# Credentials below are local-lab spike fixtures only: plaintext, never
# reused outside this demo, never production credentials.
accounts: {
  DEFAULT: {
    jetstream: {
      max_mem: 1G
      max_file: 5G
      max_streams: 20
      max_consumers: 100
    }
    users: [
      { user: "default", password: "default-spike-pass" }
    ]
  }
  ACME: {
    jetstream: {
      max_mem: 256M
      max_file: 1G
      max_streams: 10
      max_consumers: 20
    }
    users: [
      { user: "acme", password: "acme-spike-pass" }
    ]
  }
  GLOBEX: {
    jetstream: {
      max_mem: 256M
      max_file: 1G
      max_streams: 10
      max_consumers: 20
    }
    users: [
      { user: "globex", password: "globex-spike-pass" }
    ]
  }
}

# Unauthenticated connections (every existing service/frontend) are
# transparently bound to the DEFAULT account/user — this is what makes the
# above additive rather than breaking.
no_auth_user: default
