<title>Rehydration workflow (as it runs today)</title>
<style>
:root {
  --text: #dee0e3; --muted: #b7bcc2; --dim: #737c87;
  --bg: #14171b; --panel: #1a1e23; --border: #2c3138;
  --accent: #006fff; --nested: #171c29;
  --sync: #4d94ff; --store: #2dd4bf; --evtl: #f0b429; --bad: #f87171; --hop: #8b93a1;
  --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 13px; line-height: 20px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 18px 64px; display: flex; flex-direction: column; gap: 26px; }
.head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head-txt { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 3px; }
.eyebrow { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
h1 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 68ch; }

figure { margin: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.fig-body { padding: 14px 14px 4px; overflow-x: auto; }
figure svg { display: block; width: 100%; min-width:0; max-width: 100%; height: auto; color: var(--muted); }
figcaption {
  padding: 9px 14px 11px; border-top: 1px solid var(--border);
  color: var(--muted); font-size: 12px; line-height: 18px;
}
figcaption b { color: var(--text); font-weight: 600; }
figcaption code { font-family: var(--mono); font-size: 11px; background: color-mix(in srgb, var(--text) 8%, transparent); border-radius: 3px; padding: 0 4px; }

.n  { fill: none; stroke: currentColor; stroke-width: 1; }
.nb { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 3; stroke-opacity: 0.5; }
.lbl  { font-family: var(--mono); font-size: 11px; fill: var(--text); }
.lbl2 { font-family: var(--mono); font-size: 9.5px; fill: var(--dim); }
.grp  { font-family: var(--mono); font-size: 9.5px; fill: var(--dim); letter-spacing: 0.07em; }
.edge { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); }
.flow { fill: none; stroke: var(--sync); stroke-width: 1.4; }
.proj { fill: none; stroke: var(--store); stroke-width: 1.4; }
.rep  { fill: none; stroke: var(--evtl); stroke-width: 1.4; stroke-dasharray: 5 4; }
.err  { fill: none; stroke: var(--bad); stroke-width: 1.4; }
</style>

<div class="wrap">
  <div class="head">
    <div class="head-txt">
      <span class="eyebrow">NATS Design Patterns · JetStream + KV Mechanics</span>
      <h1>Rehydration workflow (as it runs today)</h1>
      <p class="sub">Every command replays its aggregate's full history from sequence 1 — there is no snapshot store and no shortcut yet.</p>
    </div>
  </div>

  <figure>
    <div class="fig-body">
      <svg viewBox="0 0 460 620" role="img"
        aria-label="A command arrives for an aggregate. The write side creates a fresh OrderedConsumer with DeliverAllPolicy filtered to that aggregate's ID, then replays every event for it from sequence 1 off the JetStream log. Those events are folded into aggregate state via Apply and FromState. The new command is then validated and applied, appending a new event back onto the log. Finally the consumer is deleted. No snapshot store and no sequence shortcut exist anywhere in this path.">
        <defs>
          <marker id="rw-sync" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon points="0,1 8,4 0,7" fill="var(--sync)"/>
          </marker>
          <marker id="rw-proj" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon points="0,1 8,4 0,7" fill="var(--store)"/>
          </marker>
        </defs>

        <!-- node 1 -->
        <rect class="n" x="80" y="16" width="300" height="44" rx="3"/>
        <text class="lbl" x="230" y="43" text-anchor="middle">Command arrives for aggregate {id}</text>

        <path class="flow" marker-end="url(#rw-sync)" d="M230 60 L230 100"/>

        <!-- node 2 -->
        <rect class="n" x="80" y="100" width="300" height="52" rx="3"/>
        <text class="lbl" x="230" y="122" text-anchor="middle">Create OrderedConsumer</text>
        <text class="lbl2" x="230" y="138" text-anchor="middle">DeliverAllPolicy, FilterSubject scoped to {id}</text>

        <path class="flow" marker-end="url(#rw-sync)" d="M230 152 L230 192"/>

        <!-- node 3 - cylinder (stream read) -->
        <path class="n" d="M100 224 L100 264 A130 10 0 0 0 360 264 L360 224"/>
        <ellipse class="n" cx="230" cy="224" rx="130" ry="10"/>
        <text class="lbl" x="230" y="246" text-anchor="middle">Replay every event for {id}</text>
        <text class="lbl2" x="230" y="259" text-anchor="middle">from sequence 1</text>

        <path class="flow" marker-end="url(#rw-sync)" d="M230 274 L230 312"/>

        <!-- node 4 -->
        <rect class="n" x="80" y="312" width="300" height="52" rx="3"/>
        <text class="lbl" x="230" y="334" text-anchor="middle">Fold events into aggregate state</text>
        <text class="lbl2" x="230" y="350" text-anchor="middle">Apply / FromState</text>

        <path class="proj" marker-end="url(#rw-proj)" d="M230 364 L230 404"/>

        <!-- node 5 - cylinder (stream write) -->
        <path class="n" d="M90 436 L90 476 A140 10 0 0 0 370 476 L370 436"/>
        <ellipse class="n" cx="230" cy="436" rx="140" ry="10"/>
        <text class="lbl" x="230" y="458" text-anchor="middle">Validate + apply new command</text>
        <text class="lbl2" x="230" y="471" text-anchor="middle">→ append event</text>

        <path class="flow" marker-end="url(#rw-sync)" d="M230 486 L230 524"/>

        <!-- node 6 -->
        <rect class="n" x="80" y="524" width="300" height="52" rx="3"/>
        <text class="lbl" x="230" y="546" text-anchor="middle">Delete the consumer</text>
        <text class="lbl2" x="230" y="562" text-anchor="middle">dropConsumer</text>
      </svg>
    </div>
    <figcaption><b>No snapshot shortcut.</b> There is no snapshot store and no <code>seq &gt; N</code> shortcut anywhere in the write path — every command pays the full replay cost of its aggregate's history. The read side is different: <code>eventhandler/</code> keeps durable consumers running continuously and projects into Postgres and KV as events arrive, rather than replaying on every call.</figcaption>
  </figure>
</div>
