<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <!-- Render: shared/unifi-theme/render-diagram.sh THIS.svg out.png 1400 1020 -->
  <defs>
    <!--UNIFI-ICONS-->
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7480"/>
    </marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#006fff"/>
    </marker>
    <style>
      .title    { fill:#dee0e3; font-size:28px; font-weight:700; }
      .subtitle { fill:#b7bcc2; font-size:15px; }
      .col-title{ fill:#8b929b; font-size:16px; font-weight:600; letter-spacing:1px; }
      .lbl      { fill:#dee0e3; font-size:16px; font-weight:500; text-anchor:middle; }
      .lbl-l    { fill:#dee0e3; font-size:16px; font-weight:500; }
      .port     { fill:#006fff; font-size:12.5px; font-weight:700; text-anchor:middle; }
      .port-l   { fill:#006fff; font-size:12.5px; font-weight:700; }
      .edge     { fill:#8b929b; font-size:12px; }
      .edge-a   { fill:#4d9bff; font-size:12px; font-weight:600; }
      .brace-lbl{ fill:#dee0e3; font-size:20px; font-weight:600; text-anchor:middle; }
    </style>
  </defs>

  <rect width="1400" height="1020" fill="#14171b"/>

  <text x="56" y="52" class="title">nats-tech-lab — swimlane view (UniFi theme)</text>
  <text x="56" y="78" class="subtitle">the AWS reference-architecture style, rendered in our palette</text>

  <!-- swimlane columns -->
  <rect x="48"  y="108" width="356" height="762" rx="10" fill="none" stroke="#4a515b" stroke-width="1.6" stroke-dasharray="7 6"/>
  <rect x="436" y="108" width="332" height="762" rx="10" fill="none" stroke="#4a515b" stroke-width="1.6" stroke-dasharray="7 6"/>
  <rect x="800" y="108" width="552" height="762" rx="10" fill="none" stroke="#4a515b" stroke-width="1.6" stroke-dasharray="7 6"/>

  <text x="226" y="150" class="col-title" text-anchor="middle">User Interface</text>
  <text x="602" y="150" class="col-title" text-anchor="middle">Compute implementation</text>
  <text x="1076" y="150" class="col-title" text-anchor="middle">Data Store</text>

  <!-- column A: frontends (2x2) -->
  <g color="#fff">
    <rect x="98"  y="210" width="72" height="72" rx="12" fill="#006fff"/><use href="#ico-browser" x="98"  y="210" width="72" height="72"/>
    <rect x="282" y="210" width="72" height="72" rx="12" fill="#006fff"/><use href="#ico-browser" x="282" y="210" width="72" height="72"/>
    <rect x="98"  y="400" width="72" height="72" rx="12" fill="#006fff"/><use href="#ico-browser" x="98"  y="400" width="72" height="72"/>
    <rect x="282" y="400" width="72" height="72" rx="12" fill="#006fff"/><use href="#ico-browser" x="282" y="400" width="72" height="72"/>
  </g>
  <text x="134" y="304" class="lbl">Lab Shell</text>   <text x="134" y="324" class="port">:5170</text>
  <text x="318" y="304" class="lbl">Admin UI</text>    <text x="318" y="324" class="port">:5173</text>
  <text x="134" y="494" class="lbl">Port Mgmt</text>   <text x="134" y="514" class="port">:5174</text>
  <text x="318" y="494" class="lbl">Dictionary</text>  <text x="318" y="514" class="port">:5175</text>

  <!-- column B: backend services -->
  <g color="#fff">
    <rect x="566" y="238" width="72" height="72" rx="12" fill="#006fff"/><use href="#ico-service" x="566" y="238" width="72" height="72"/>
    <rect x="566" y="500" width="72" height="72" rx="12" fill="#006fff"/><use href="#ico-service" x="566" y="500" width="72" height="72"/>
  </g>
  <text x="602" y="332" class="lbl">Shipping Backend</text> <text x="602" y="352" class="port">:18080</text>
  <text x="602" y="594" class="lbl">refdata-service</text>  <text x="602" y="614" class="port">:18081</text>

  <!-- column C: infrastructure (icon left, label right) -->
  <g color="#fff">
    <rect x="852" y="238" width="72" height="72" rx="12" fill="#27c07f"/><use href="#ico-nats" x="852" y="238" width="72" height="72"/>
    <rect x="852" y="500" width="72" height="72" rx="12" fill="#27c07f"/><use href="#ico-db"   x="852" y="500" width="72" height="72"/>
  </g>
  <text x="948" y="268" class="lbl-l">NATS / JetStream</text>
  <text x="948" y="292" class="edge">SHIPPING + REFDATA streams · KV buckets</text>
  <text x="948" y="312" class="port-l">:14222</text>
  <text x="948" y="530" class="lbl-l">Postgres</text>
  <text x="948" y="554" class="edge">source of truth · shipping + refdata schemas</text>
  <text x="948" y="574" class="port-l">:15432</text>

  <!-- flow edges -->
  <path d="M 404 274 C 470 274, 500 274, 562 274" fill="none" stroke="#6b7480" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M 404 436 C 480 436, 500 536, 562 536" fill="none" stroke="#6b7480" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- cross-service dashed (shipping -> refdata) -->
  <path d="M 660 300 C 700 340, 700 470, 660 510" fill="none" stroke="#006fff" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aa)"/>
  <text x="674" y="400" class="edge-a">KV cache read</text>
  <text x="674" y="418" class="edge-a">+ REST fallback</text>

  <!-- compute -> data trunk + fan-out -->
  <path d="M 638 274 L 730 274" fill="none" stroke="#6b7480" stroke-width="1.8"/>
  <path d="M 730 274 L 730 536" fill="none" stroke="#6b7480" stroke-width="1.8"/>
  <path d="M 730 274 L 848 274" fill="none" stroke="#6b7480" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M 730 536 L 848 536" fill="none" stroke="#6b7480" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M 638 536 L 730 536" fill="none" stroke="#6b7480" stroke-width="1.8"/>

  <!-- grouping brace -->
  <path d="M 60 892 Q 60 906 74 906 L 686 906 Q 700 906 700 920 Q 700 906 714 906 L 1326 906 Q 1340 906 1340 892"
        fill="none" stroke="#6b7480" stroke-width="1.6"/>
  <text x="700" y="954" class="brace-lbl">Dictionary POC (demo 01) — one microservice bounded context</text>
</svg>
