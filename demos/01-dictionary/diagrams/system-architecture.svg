<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="960" viewBox="0 0 1480 960" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <!-- Render: shared/unifi-theme/render-diagram.sh THIS.svg out.png 1480 960 -->
  <defs>
    <!--UNIFI-ICONS-->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7480"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#006fff"/>
    </marker>
    <style>
      .title  { fill:#dee0e3; font-size:30px; font-weight:700; }
      .subtitle{ fill:#b7bcc2; font-size:15px; font-weight:400; }
      .band    { fill:#b7bcc2; font-size:13px; font-weight:700; letter-spacing:2px; }
      .card-title { fill:#dee0e3; font-size:19px; font-weight:600; }
      .card-sub   { fill:#8b929b; font-size:12.5px; font-weight:500; }
      .card-meta  { fill:#b7bcc2; font-size:12px; font-weight:400; }
      .port    { fill:#006fff; font-size:12.5px; font-weight:700; }
      .edge-lbl{ fill:#8b929b; font-size:11.5px; font-weight:500; }
      .edge-lbl-a{ fill:#4d9bff; font-size:11.5px; font-weight:600; }
    </style>
  </defs>

  <rect width="1480" height="960" fill="#14171b"/>

  <text x="60" y="58" class="title">NATS Tech Lab — Dictionary POC</text>
  <text x="60" y="84" class="subtitle">High-level system architecture · frontends, backend services, and shared infrastructure</text>
  <line x1="60" y1="104" x2="1420" y2="104" stroke="#2c3138" stroke-width="1"/>

  <!-- ============ BAND: FRONTENDS ============ -->
  <text x="60" y="150" class="band">FRONTENDS · Vue 3 + PrimeVue + Pinia (UniFi theme)</text>

  <g color="#fff">
    <rect x="60"   y="168" width="300" height="96" rx="10" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="76"   y="190" width="52" height="52" rx="10" fill="#006fff"/><use href="#ico-browser" x="76" y="190" width="52" height="52"/>
    <rect x="392"  y="168" width="300" height="96" rx="10" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="408"  y="190" width="52" height="52" rx="10" fill="#006fff"/><use href="#ico-browser" x="408" y="190" width="52" height="52"/>
    <rect x="724"  y="168" width="300" height="96" rx="10" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="740"  y="190" width="52" height="52" rx="10" fill="#006fff"/><use href="#ico-browser" x="740" y="190" width="52" height="52"/>
    <rect x="1056" y="168" width="300" height="96" rx="10" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="1072" y="190" width="52" height="52" rx="10" fill="#006fff"/><use href="#ico-browser" x="1072" y="190" width="52" height="52"/>
  </g>
  <text x="144"  y="202" class="card-title">Lab Shell</text>
  <text x="144"  y="224" class="card-sub">demo menu + intro pages</text>
  <text x="144"  y="250" class="port">:5170</text>
  <text x="476"  y="202" class="card-title">Admin / NATS Debug</text>
  <text x="476"  y="224" class="card-sub">stream feed · KV · Shapes A/B/C</text>
  <text x="476"  y="250" class="port">:5173</text>
  <text x="808"  y="202" class="card-title">Port Management</text>
  <text x="808"  y="224" class="card-sub">yard · docked ships · containers</text>
  <text x="808"  y="250" class="port">:5174</text>
  <text x="1140" y="202" class="card-title">Dictionary</text>
  <text x="1140" y="224" class="card-sub">refdata admin · localization · cache</text>
  <text x="1140" y="250" class="port">:5175</text>

  <!-- ============ BAND: BACKEND SERVICES ============ -->
  <text x="60" y="392" class="band">BACKEND SERVICES · Go (hexagonal)</text>

  <g color="#fff">
    <rect x="240" y="410" width="470" height="140" rx="10" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="262" y="436" width="60" height="60" rx="12" fill="#006fff"/><use href="#ico-service" x="262" y="436" width="60" height="60"/>
    <rect x="900" y="410" width="470" height="140" rx="10" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="922" y="436" width="60" height="60" rx="12" fill="#006fff"/><use href="#ico-service" x="922" y="436" width="60" height="60"/>
  </g>
  <text x="342" y="444" class="card-title">Shipping Backend</text>
  <text x="342" y="468" class="card-meta">Ship + Container aggregates · event-sourced</text>
  <text x="342" y="488" class="card-meta">CQRS Shapes A / B / C · REST + Swagger + SSE</text>
  <text x="342" y="508" class="card-meta">internal/refdataconsumer → refdata KV + REST</text>
  <text x="342" y="536" class="port">:18080</text>
  <text x="1002" y="444" class="card-title">refdata-service</text>
  <text x="1002" y="468" class="card-meta">reference/master data · plain Postgres CRUD</text>
  <text x="1002" y="488" class="card-meta">localization · typed refs · Q5 versioned KV cache</text>
  <text x="1002" y="508" class="card-meta">own schema · REST + Swagger + SSE</text>
  <text x="1002" y="536" class="port">:18081</text>

  <!-- ============ BAND: INFRASTRUCTURE ============ -->
  <text x="60" y="678" class="band">SHARED INFRASTRUCTURE</text>

  <g color="#fff">
    <rect x="240" y="696" width="470" height="150" rx="10" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="262" y="722" width="60" height="60" rx="12" fill="#27c07f"/><use href="#ico-nats" x="262" y="722" width="60" height="60"/>
    <rect x="900" y="696" width="470" height="150" rx="10" fill="#1a1e23" stroke="#2c3138" stroke-width="1.5"/>
    <rect x="922" y="722" width="60" height="60" rx="12" fill="#27c07f"/><use href="#ico-db" x="922" y="722" width="60" height="60"/>
  </g>
  <text x="342" y="730" class="card-title">NATS / JetStream</text>
  <text x="342" y="756" class="card-meta">Streams: SHIPPING (LimitsPolicy) · REFDATA (bounded)</text>
  <text x="342" y="776" class="card-meta">KV buckets: dict-a/b · container · refdata-{context}</text>
  <text x="342" y="796" class="card-meta">KV watch → SSE distribution</text>
  <text x="342" y="824" class="port">:14222 · monitor :18222</text>
  <text x="1002" y="730" class="card-title">Postgres</text>
  <text x="1002" y="756" class="card-meta">Source of truth · database "dictionary"</text>
  <text x="1002" y="776" class="card-meta">shipping schema — CQRS projections + ports</text>
  <text x="1002" y="796" class="card-meta">refdata schema — items · locales · references</text>
  <text x="1002" y="824" class="port">:15432</text>

  <!-- ============ EDGES ============ -->
  <path d="M 476 264 C 476 330, 430 350, 400 408" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 806 264 C 806 330, 560 350, 500 408" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="600" y="336" class="edge-lbl">proxy /api</text>
  <path d="M 1150 264 C 1150 330, 1140 350, 1135 408" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1160" y="340" class="edge-lbl">proxy /api</text>

  <path d="M 710 476 L 896 476" fill="none" stroke="#006fff" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowAccent)"/>
  <text x="803" y="466" class="edge-lbl-a" text-anchor="middle">KV cache read · REST fallback</text>
  <text x="803" y="497" class="edge-lbl" text-anchor="middle">internal/refdataconsumer</text>

  <path d="M 400 550 C 400 610, 420 640, 430 694" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 620 550 C 700 610, 980 630, 1060 694" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 990 550 C 900 610, 620 630, 540 694" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 1180 550 C 1180 610, 1170 640, 1160 694" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="628" class="edge-lbl">publish · KV · watch</text>
  <text x="1050" y="640" class="edge-lbl">read / write</text>

  <line x1="60" y1="892" x2="1420" y2="892" stroke="#2c3138" stroke-width="1"/>
  <g transform="translate(60,918)">
    <line x1="0" y1="-4" x2="34" y2="-4" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="44" y="0" class="edge-lbl">HTTP / NATS connection</text>
    <line x1="240" y1="-4" x2="274" y2="-4" stroke="#006fff" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowAccent)"/>
    <text x="284" y="0" class="edge-lbl-a">cross-service reference-data consumption</text>
    <rect x="640" y="-14" width="14" height="14" rx="3" fill="#1a1e23" stroke="#27c07f" stroke-width="2"/>
    <text x="662" y="0" class="edge-lbl">stateful infrastructure</text>
  </g>
</svg>
