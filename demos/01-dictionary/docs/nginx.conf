# No /api/ proxy rules — unlike the other lab frontends, this is a fully
# static site with no backend calls. `cleanUrls: true` in .vitepress/config.mts
# writes output as e.g. architecture/accounts.html (no directory-index form),
# so direct navigation needs the .html fallback below to find it — matches
# VitePress's own documented nginx config for cleanUrls.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Preserves a real 404 status while still serving VitePress's built
    # 404.html content (a bare "/404.html" fallback above would 200 it).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
