server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Phase 15c — auth-service (mints browser NATS WebSocket credentials).
    # nginx's longest-prefix-match means this is picked over /api/ below
    # regardless of declaration order, but it stays first for readability.
    location /api/auth/ {
        proxy_pass http://auth-service:8080/api/auth/;
    }

    location /api/ {
        proxy_pass http://shipping-service:8080;
        proxy_http_version 1.1;
        # SSE: no buffering, long-lived connections
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 1h;
    }
}
