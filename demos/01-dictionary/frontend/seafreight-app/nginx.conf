server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Phase 45 — the browser's NATS WebSocket connection, proxied same-origin
    # instead of dialling the NATS server's host port directly. accounts-
    # service returns the path `/nats` in connectInfo and the browser resolves
    # it against this page's own origin (shared/nats/resolveWsUrl.js), so the
    # one config value works on a laptop-local stack and behind a remote TLS
    # proxy alike — a hardcoded `ws://localhost:9222` worked only on the
    # former, and was additionally blocked as mixed content from an https://
    # page. proxy_pass strips the /nats prefix (trailing slash on both sides);
    # the NATS websocket listener serves at the root of its own port.
    #
    # Note this is NOT under /api/ — that prefix is proxied to a backend
    # service in every app here, and this is the message bus itself.
    location /nats/ {
        proxy_pass http://nats:9222/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A NATS client connection is long-lived and can sit idle between
        # messages; nginx's 60s default would drop it mid-session.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # nats-core dials the exact URL it is given, with no trailing slash, so
    # the handshake arrives as /nats — which the prefix rule above does not
    # match. An nginx redirect would drop the Upgrade header, so this exact-
    # match rule serves the handshake directly instead.
    location = /nats {
        proxy_pass http://nats:9222/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Phase 15c — mints browser NATS WebSocket credentials. Originally a
    # standalone auth-service; folded into accounts-service's own `auth`
    # sub-package in Phase 19 (see BUSINESS_RULES-ACCOUNTS.md), so this now
    # proxies to the same host as the other accounts-service routes.
    # nginx's longest-prefix-match means this is picked over /api/ below
    # regardless of declaration order, but it stays first for readability.
    location /api/auth/ {
        proxy_pass http://accounts-service:8080/api/auth/;
    }

    # Business unit listing — read-only path from accounts-service. Reuses the
    # same proxy prefix as the admin frontend so the Authorization header
    # injection stays in one place. No trailing slash on either side: nginx
    # substitutes the literal prefix, preserving the /{name}/business-units
    # suffix intact (same rule as admin/nginx.conf).
    location /api/platform/accounts {
        proxy_pass http://accounts-service:8080/api/accounts;
        proxy_set_header Authorization "Basic YWRtaW46YWNjb3VudHMtc3Bpa2UtcGFzcw==";
    }

    location /api/ {
        proxy_pass http://shipping-service:8080;
        proxy_http_version 1.1;
        # SSE: no buffering, long-lived connections
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 1h;
    }
}
