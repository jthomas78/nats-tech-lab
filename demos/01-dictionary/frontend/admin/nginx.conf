server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Phase 14c — accounts-service (tenant provisioning). nginx's longest-
    # prefix-match means this is picked over /api/ below regardless of
    # declaration order, but it stays first for readability. Both sides
    # deliberately have no trailing slash: nginx then substitutes only the
    # literal "/api/platform/accounts" prefix, preserving whatever suffix
    # follows (e.g. "/initech" for the item routes) rather than the
    # trailing-slash rewrite rules that would otherwise apply. Injects the
    # shared basic-auth secret here so the browser never needs to know it —
    # see accounts/middleware.go.
    location /api/platform/accounts {
        proxy_pass http://accounts-service:8080/api/accounts;
        proxy_set_header Authorization "Basic YWRtaW46YWNjb3VudHMtc3Bpa2UtcGFzcw==";
    }

    location /api/ {
        proxy_pass http://shipping-service:8080;
        proxy_http_version 1.1;
        # SSE: no buffering, long-lived connections
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 1h;
    }
}
