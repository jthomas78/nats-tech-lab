server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Phase 32 — accounts-service's auth routes (refdataAdminConnectInfo
    # mints this app's PLATFORM-account NATS credential). More specific than
    # /api/ below, so nginx's longest-prefix match picks it first — mirrors
    # frontend/admin's nginx.conf and vite.config.js's dev-proxy rule.
    location /api/auth/ {
        proxy_pass http://accounts-service:8080;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://refdata-service:8080;
        proxy_http_version 1.1;
        # SSE: no buffering, long-lived connections
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 1h;
    }
}
