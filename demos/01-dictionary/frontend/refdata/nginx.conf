server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Phase 45 — the browser's NATS WebSocket connection, proxied same-origin
    # instead of dialling the NATS server's host port directly. accounts-
    # service returns the path `/nats` in connectInfo and the browser resolves
    # it against this page's own origin (shared/nats/resolveWsUrl.js), so the
    # one config value works on a laptop-local stack and behind a remote TLS
    # proxy alike — a hardcoded `ws://localhost:9222` worked only on the
    # former, and was additionally blocked as mixed content from an https://
    # page. proxy_pass strips the /nats prefix (trailing slash on both sides);
    # the NATS websocket listener serves at the root of its own port.
    #
    # Note this is NOT under /api/ — that prefix is proxied to a backend
    # service in every app here, and this is the message bus itself.
    location /nats/ {
        proxy_pass http://nats:9222/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A NATS client connection is long-lived and can sit idle between
        # messages; nginx's 60s default would drop it mid-session.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # nats-core dials the exact URL it is given, with no trailing slash, so
    # the handshake arrives as /nats — which the prefix rule above does not
    # match. An nginx redirect would drop the Upgrade header, so this exact-
    # match rule serves the handshake directly instead.
    location = /nats {
        proxy_pass http://nats:9222/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Phase 32 — accounts-service's auth routes (refdataAdminConnectInfo
    # mints this app's PLATFORM-account NATS credential). More specific than
    # /api/ below, so nginx's longest-prefix match picks it first — mirrors
    # frontend/admin's nginx.conf and vite.config.js's dev-proxy rule.
    location /api/auth/ {
        proxy_pass http://accounts-service:8080;
        proxy_http_version 1.1;
    }

    # Phase 38c-ii — organizations-service's compliance document byte
    # ingress (BR-TP40). Deliberately outside /api/: that prefix means
    # "refdata-service's REST surface" everywhere in this app, and these two
    # routes are neither refdata nor a business API — they carry file bytes
    # only, authorized by a ticket minted over NATS (BR-TP41).
    location /files/ {
        proxy_pass http://organizations-service:8080;
        proxy_http_version 1.1;
        # nginx defaults client_max_body_size to 1m, which would reject a
        # legitimate upload with a 413 that never reaches the service — so the
        # operator would see the size refusal without the service's own cap
        # ever being consulted. Matched to domain.MaxDocumentFileBytes, with
        # the service remaining the authority that enforces it.
        client_max_body_size 10m;
        # Stream the body straight through rather than spooling the whole file
        # to disk first; the service reads it as a stream.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://refdata-service:8080;
        proxy_http_version 1.1;
        # SSE: no buffering, long-lived connections
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 1h;
    }
}
