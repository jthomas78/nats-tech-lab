# Grafana Tempo — Phase 54 (decision 2).
#
# Monolithic mode (one process, -target=all) on local disk. A lab setup, not
# a production one: production Tempo 3.x needs a Kafka-compatible queue and
# object storage, and the V3 trace store is a separate V3 decision.
#
# Image pinned in deploy/cell/compose.otel.yaml (grafana/tempo 3.1.0). Based
# on Tempo's own single-binary example at that tag, minus the metrics
# generator (no Prometheus until Phase 55).
#
# Reached only inside the Docker network: by the Collector (ingest), by
# Grafana, and by observability-service's trace query gateway (decision 9).
# Never published on the host, so no client can bypass the gateway.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  # BR-036 caps a captured body at 4096 bytes (otelnats.MaxBodyBytes) and
  # sets `truncated` when it cuts. Tempo's default here is 2048, which cut
  # the body again with no flag (found in 54b-7b). Keep this at least as
  # large as MaxBodyBytes. Tempo's ingest limits stay at their defaults.
  max_attribute_bytes: 4096
  receivers:
    otlp:
      protocols:
        # The Collector exports OTLP/gRPC. No HTTP receiver: Tempo takes
        # spans from the Collector only.
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
