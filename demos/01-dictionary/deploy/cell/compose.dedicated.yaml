# GENERATED-BY-HAND, then kept by hand. Split out of
# demos/01-dictionary/docker-compose.yml on 2026-09-08.
#
# The micro-frontend plugin fixtures and their shared build host. Deliberately
# NOT in compose.yaml's include: list -- they are test fixtures, not part of a
# cell. Run them with an extra -f when you want them.
#
# They stay in one file because example-plugin-frontend defines the YAML anchor
# &plugin_dependencies that the others use, and a YAML anchor does not cross a
# file boundary. mfe-plugin-host is here for the same reason: the plugins name
# it as a build context with `service:mfe-plugin-host`.
#
# Every host port is a variable. deploy/environments/local-za-1.env and
# local-au-1.env supply the per-cell offsets, so two cells can run at the
# same time. container_name is gone for the same reason: a fixed name can
# only exist once on one Docker engine.

services:
  # Build-only service used as a named Docker build context by each announced
  # frontend plugin. The profile keeps it out of the runtime topology; its
  # product is the shared PID-1 image, not another container.
  mfe-plugin-host:
    image: mfe-plugin-host:latest
    deploy:
      replicas: 0
    build:
      context: ../../../..
      dockerfile: shared/mfe-plugin-host/Dockerfile

  # The BR-AS15 proof plugin's remote, served from its own image on its own
  # port. It is listed here so `docker compose up` brings up a complete,
  # working stack — NOT because the shell needs it at build time. The shell
  # image contains no reference to this service, the two builds share only
  # the theme directory, and the shell still learns this URL at runtime from
  # the curated registry (BR-AS03). Adding a second plugin means adding a
  # service here and a registry row; it does not mean rebuilding the shell.
  #
  # Its origin must appear in mfe-registry-service's REGISTRY_ALLOWED_ORIGINS
  # or every entry pointing at it is refused on write and filtered on read
  # (BR-AS20).
  example-plugin-frontend:
    build:
      context: ../../../..
      dockerfile: lab-shell/plugins/example-plugin/Dockerfile
      additional_contexts:
        mfe-plugin-host: service:mfe-plugin-host
    ports:
      - "${PLUGIN_EXAMPLE_PORT:-7111}:8080"
    labels:
      com.nats-tech-lab.mfe.source: announced
    # `backend` only. A plugin container used to join `frontend` as well so
    # the registry could dial its /healthz from inside the network; nothing
    # dials it now (Phase 15c). The browser still reaches it, on the published
    # host port above — which is what it always used, never this network.
    networks:
      - backend
    environment:
      HTTP_ADDR: ":8080"
      ASSET_ROOT: /srv
      ASSET_ALLOWED_ORIGIN: http://localhost:${APP_SHELL_PORT:-7110}
      PLUGIN_PUBLIC_ORIGIN: http://localhost:${PLUGIN_EXAMPLE_PORT:-7111}
      HEALTH_SELF_URL: http://127.0.0.1:8080/healthz
      NATS_URL: nats://nats:4222
      NATS_CREDS_PATH: /etc/nats/creds/plugin.creds
      NATS_CONNECTION_NAME: example-plugin
      PUBLISHER_ID: example-plugin
      PLUGIN_MANIFEST_PATH: /srv/manifest.json
      PUBLISHER_SIGNING_SEED_PATH: /etc/plugin/signing.nk
      RELEASE_STATE_PATH: /var/lib/announcer/release.json
    volumes:
      - ../../nats/creds/plugins/example-plugin.creds:/etc/nats/creds/plugin.creds:ro
      - ../../nats/keys/publisher-example-plugin.nk:/etc/plugin/signing.nk:ro
      - example-plugin-release:/var/lib/announcer
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on: &plugin_dependencies
      nats:
        condition: service_started
      mfe-registry-service:
        condition: service_started
      registry-publisher-seed:
        condition: service_completed_successfully

  # The catalogue plugin. Preloaded, never announced — the operator curates
  # it — so it holds no signing key and no announce grant. Since Phase 15c it
  # runs the same shared Go host as every other plugin, in HEALTH_ONLY mode:
  # it serves its assets and reports its own health, and that is all it can
  # do. Its credential is the narrowest in the deployment (see
  # nats/bootstrap-operator.sh), and it cannot announce or unregister
  # anything even if this file said otherwise.
  demo-catalog-frontend:
    build:
      context: ../../../..
      dockerfile: lab-shell/plugins/demo-catalog/Dockerfile
      additional_contexts:
        mfe-plugin-host: service:mfe-plugin-host
    ports:
      - "${PLUGIN_CATALOG_PORT:-7112}:8080"
    networks:
      - backend
    labels:
      com.nats-tech-lab.mfe.source: preload
    environment:
      HTTP_ADDR: ":8080"
      ASSET_ROOT: /srv
      ASSET_ALLOWED_ORIGIN: http://localhost:${APP_SHELL_PORT:-7110}
      HEALTH_ONLY: "true"
      HEALTH_SELF_URL: http://127.0.0.1:8080/healthz
      NATS_URL: nats://nats:4222
      NATS_CREDS_PATH: /etc/nats/creds/plugin.creds
      NATS_CONNECTION_NAME: demo-catalog
      PUBLISHER_ID: demo-catalog
    volumes:
      - ../../nats/creds/plugins/demo-catalog.creds:/etc/nats/creds/plugin.creds:ro
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on: *plugin_dependencies

  example-plugin-slow-frontend:
    build:
      context: ../../../..
      dockerfile: lab-shell/plugins/example-plugin-slow/Dockerfile
      additional_contexts:
        mfe-plugin-host: service:mfe-plugin-host
    ports:
      - "${PLUGIN_SLOW_PORT:-7113}:8080"
    # `backend` only. A plugin container used to join `frontend` as well so
    # the registry could dial its /healthz from inside the network; nothing
    # dials it now (Phase 15c). The browser still reaches it, on the published
    # host port above — which is what it always used, never this network.
    networks:
      - backend
    labels:
      com.nats-tech-lab.mfe.source: announced
    environment:
      HTTP_ADDR: ":8080"
      ASSET_ROOT: /srv
      ASSET_ALLOWED_ORIGIN: http://localhost:${APP_SHELL_PORT:-7110}
      PLUGIN_PUBLIC_ORIGIN: http://localhost:${PLUGIN_SLOW_PORT:-7113}
      HEALTH_SELF_URL: http://127.0.0.1:8080/healthz
      NATS_URL: nats://nats:4222
      NATS_CREDS_PATH: /etc/nats/creds/plugin.creds
      NATS_CONNECTION_NAME: example-plugin-slow
      PUBLISHER_ID: example-plugin-slow
      PLUGIN_MANIFEST_PATH: /srv/manifest.json
      PUBLISHER_SIGNING_SEED_PATH: /etc/plugin/signing.nk
      RELEASE_STATE_PATH: /var/lib/announcer/release.json
    volumes:
      - ../../nats/creds/plugins/example-plugin-slow.creds:/etc/nats/creds/plugin.creds:ro
      - ../../nats/keys/publisher-example-plugin-slow.nk:/etc/plugin/signing.nk:ro
      - example-plugin-slow-release:/var/lib/announcer
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on: *plugin_dependencies

  example-plugin-activate-throws-frontend:
    build:
      context: ../../../..
      dockerfile: lab-shell/plugins/example-plugin-activate-throws/Dockerfile
      additional_contexts:
        mfe-plugin-host: service:mfe-plugin-host
    ports:
      - "${PLUGIN_THROWS_PORT:-7114}:8080"
    # `backend` only. A plugin container used to join `frontend` as well so
    # the registry could dial its /healthz from inside the network; nothing
    # dials it now (Phase 15c). The browser still reaches it, on the published
    # host port above — which is what it always used, never this network.
    networks:
      - backend
    labels:
      com.nats-tech-lab.mfe.source: announced
    environment:
      HTTP_ADDR: ":8080"
      ASSET_ROOT: /srv
      ASSET_ALLOWED_ORIGIN: http://localhost:${APP_SHELL_PORT:-7110}
      PLUGIN_PUBLIC_ORIGIN: http://localhost:${PLUGIN_THROWS_PORT:-7114}
      HEALTH_SELF_URL: http://127.0.0.1:8080/healthz
      NATS_URL: nats://nats:4222
      NATS_CREDS_PATH: /etc/nats/creds/plugin.creds
      NATS_CONNECTION_NAME: example-plugin-activate-throws
      PUBLISHER_ID: example-plugin-activate-throws
      PLUGIN_MANIFEST_PATH: /srv/manifest.json
