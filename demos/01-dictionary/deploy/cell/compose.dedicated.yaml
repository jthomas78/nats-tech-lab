    stop_grace_period: 30s
    restart: unless-stopped
    depends_on: *plugin_dependencies

  # Announcer-only: this fixture has no code and no web server, by design
  # (see lab-shell/plugins/example-plugin-unreachable/README.md). It is a
  # manifest pointing at a dead path on example-plugin's port, so the shell's
  # 404 failure path has something to fail on. It still gets its own
  # publisher: letting example-plugin's host announce it too would put two
  # plugins under one publisher, against decision 4.
  example-plugin-unreachable-announcer:
    build:
      context: ../../../..
      dockerfile: demos/01-dictionary/backend/mfe-registry-service/Dockerfile
    entrypoint: ["announce-plugin"]
    networks:
      - backend
    environment:
      NATS_URL: nats://nats:4222
      NATS_CREDS_PATH: /etc/nats/creds/plugin.creds
      # Set explicitly rather than left to announce-plugin's default so
      # nats.Name() equals the credential's own name — the repo's credential
      # naming rule, and what makes a Name/Credential mismatch in the Admin UI
      # Connections panel a signal rather than noise.
      NATS_CONNECTION_NAME: example-plugin-unreachable
      PUBLISHER_ID: example-plugin-unreachable
      PLUGIN_PUBLIC_ORIGIN: http://localhost:${PLUGIN_EXAMPLE_PORT:-7111}
      # This fixture has no web server at all, so its self-check has nothing
      # to answer it. Port 9 is the discard port and nothing is listening: the
      # check fails, and after the second consecutive failure the fixture
      # reports itself unhealthy (BR-AS63). That is the point — it is the one
      # plugin in the deployment that is genuinely broken, and now it says so
      # itself instead of being found out by a probe.
      HEALTH_SELF_URL: http://127.0.0.1:9/healthz
      PLUGIN_MANIFEST_PATH: /etc/plugin/manifest.json
      PUBLISHER_SIGNING_SEED_PATH: /etc/plugin/signing.nk
      RELEASE_STATE_PATH: /var/lib/announcer/release.json
    volumes:
      - ../../nats/creds/plugins/example-plugin-unreachable.creds:/etc/nats/creds/plugin.creds:ro
      # Read-only, and mounted at runtime rather than copied in: a signing seed
      # must never enter an image layer (decision 8).
      - ../../nats/keys/publisher-example-plugin-unreachable.nk:/etc/plugin/signing.nk:ro
      - ../../../../lab-shell/plugins/example-plugin-unreachable/public/manifest.json:/etc/plugin/manifest.json:ro
      - example-plugin-unreachable-release:/var/lib/announcer
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
      mfe-registry-service:
        condition: service_started
      # Decision 6's boot gate. Starting before the trust table exists earns
      # `not-owned` or `key-not-trusted`, not a plugin.
      registry-publisher-seed:
        condition: service_completed_successfully

networks:
  # Trust-tier split (not per-service-pair): anything needing NATS/Postgres
  # joins `backend`; anything the browser talks to joins `frontend`. Compose
  # namespaces both by project, so lb-za-1 and lb-au-1 get their own pair and
  # cannot see each other -- which is exactly the region isolation we want to
  # prove locally.
  backend:
  frontend:

volumes:
  example-plugin-release:
  example-plugin-slow-release:
  example-plugin-unreachable-release:
  example-plugin-activate-throws-release:
  example-plugin-incompatible-release:
