# Demo 04 — the whole server config.
#
# This used to be a list of flags in compose.yaml. It moved here because a
# `websocket { }` block has no command-line flag, and the browser UI on port
# 20401 cannot speak the NATS TCP protocol. Nothing else changed.

server_name: lab4-nats

# 4222 in the container, published as 4422 on the host.
port: 4222

# Monitoring — /healthz, /jsz, /varz. Published as 8422.
http_port: 8222

jetstream {
  store_dir: /data
}

# The browser door. Published as 20403.
#
# no_tls is for this demo only: the server is on the host's loopback, the demo
# has no accounts and no secrets, and a self-signed cert would add a browser
# trust step that teaches nothing about CQRS.
#
# same_origin must be false — the page is served from 20401 and connects to
# 20403, so the Origin header never matches.
websocket {
  port: 8080
  no_tls: true
  same_origin: false
  allowed_origins: [
    "http://localhost:20401"
    "http://127.0.0.1:20401"
  ]
}
