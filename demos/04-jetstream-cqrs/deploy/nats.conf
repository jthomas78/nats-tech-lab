# Demo 04 — the whole server config.
#
# This used to be a list of flags in compose.yaml. It moved here because a
# `websocket { }` block has no command-line flag, and the browser UI on port
# 20401 cannot speak the NATS TCP protocol. Nothing else changed.

server_name: lab4-nats

# 4222 in the container, published as 4422 on the host.
port: 4222

# Monitoring — /healthz, /jsz, /varz. Published as 8422.
http_port: 8222

jetstream {
  store_dir: /data
}

# The browser door. Published as 20403.
#
# no_tls is for this demo only: the server is on the host's loopback, the demo
# has no accounts and no secrets, and a self-signed cert would add a browser
# trust step that teaches nothing about CQRS.
#
# same_origin must be false — the page is served from 20401 and connects to
# 20403, so the Origin header never matches.
#
# Two pages may open this door, and they are listed separately because they are
# two different deployments of the same app:
#
#   20401 — the standalone demo, served by its own dev server.
#   7110  — the same app embedded in lab-shell as a plugin, where the page sits
#           on the SHELL's origin.
#
# The shell entry is NOT the same decision as the command API on 20402. That one
# is HTTP, gated by CORS, and is proxied same-origin by the shell precisely so
# no CORS grant has to widen (app-shell BR-AS82, and this demo's CLAUDE.md).
# A WebSocket is not subject to CORS at all, so a proxy would not have helped
# here: this list is the only gate, and an origin either appears in it or is
# refused. Added 2026-09-24 so the embedded page can show live state.
#
# Loopback only, and this demo has no accounts and no secrets. Do not add a
# non-loopback origin here without deciding that separately.
websocket {
  port: 8080
  no_tls: true
  same_origin: false
  allowed_origins: [
    "http://localhost:20401"
    "http://127.0.0.1:20401"
    "http://localhost:7110"
    "http://127.0.0.1:7110"
  ]
}
