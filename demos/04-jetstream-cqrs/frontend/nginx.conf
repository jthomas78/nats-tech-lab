# Demo 04's frontend image.
#
# Everything this image serves lives under `/plugins/demo-04/`, because
# `vite.config.js` sets `base: '/plugins/demo-04/'` — one public path layout
# for the plugin, shared by the dev server, the lab shell's build-mode copy
# and this image (app-shell BR-AS77). The built `dist/` is therefore placed at
# `html/plugins/demo-04/`, and a request arrives here at the SAME path the
# browser asked the shell for. Nothing is rewritten on the way in or out.
#
# This image is reached two ways and both are the same path:
#
#   - through the lab shell, which proxies /plugins/demo-04/ to this container
#   - directly, on its own published port, for a look without the shell
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        # `=404`, NEVER an SPA fallback. This is the rule the whole task turns
        # on: a missing chunk that answers 200 with a page of HTML fails later,
        # inside the module loader, as a syntax error — which reads as a broken
        # plugin rather than a missing file. `$uri/index.html` covers only a
        # DIRECTORY request, so /plugins/demo-04/ still opens the standalone
        # app while /plugins/demo-04/assets/gone.js is a plain 404.
        try_files $uri $uri/index.html =404;
    }
}
