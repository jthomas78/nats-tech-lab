# One NATS server in one regional cluster. Shared by all six servers.
#
# Everything that differs between a server or a cluster arrives as an
# environment variable, set in deploy/compose.za.yaml and compose.au.yaml. Same decision as demo 01's
# nats/nats-cluster.conf, and for the same reason: near-identical config files
# drift, and NATS expands $VARS in any value.
#
# This is deliberately SMALLER than demo 01's. No websocket listener (nothing
# here is a browser), no log file (there is no Admin UI to read it), no hub.
# The lab is for watching cluster and gateway behaviour, nothing else.

server_name: $NATS_SERVER_NAME

port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"

  # ONE domain for BOTH clusters, on purpose. Set to `lb` in compose.za.yaml
  # and compose.au.yaml alike.
  #
  # A JetStream domain names ONE JetStream system. The NATS docs are explicit:
  # every server in a cluster AND in a supercluster must carry the SAME domain
  # name, and the name may only change across a LEAF NODE link. A gateway is
  # not a leaf link.
  #
  # We tried `za` and `au` here first (2026-09-08). It looked reasonable and it
  # silently broke JetStream. Setting a domain suppresses JetStream traffic on
  # the system account, so the two clusters never learned each other's server
  # names: za's meta leader listed the three au servers as "Server name unknown
  # ... offline: true", au never elected a leader of its own, and
  # `stream add --cluster au` failed with "no suitable peers for placement
  # (10005)". No error at startup. Reversed 2026-09-09.
  #
  # So: one supercluster, one JetStream namespace. To pin a stream to a region
  # use PLACEMENT (`--cluster za` / `--cluster au`), not a domain. To keep two
  # regions apart for real, use separate ACCOUNTS -- that is lab/03-odometer.sh.
  domain: $NATS_JS_DOMAIN
}

# The cluster -- how three servers in ONE region find each other.
# This is a ROUTE. Routes are internal to a cluster and carry everything.
cluster {
  name: $NATS_CLUSTER_NAME
  port: 6222

  # Unlike demo 01, service names here are already globally unique
  # (za-1, au-2 ...), so no `.rt` alias trick is needed -- there is one
  # Compose project and one network, and nothing to confuse.
  # The WHOLE url is one variable, not `nats://$PEER:6222`. NATS expands a
  # $VAR that stands alone; it does not substitute inside a longer string, so
  # the embedded form is passed through literally and DNS then tries to
  # resolve a host called "$NATS_PEER_1". Demo 01 hit the same thing.
  routes = [
    $NATS_ROUTE_1
    $NATS_ROUTE_2
    $NATS_ROUTE_3
  ]
}

# The gateway -- how two SEPARATE clusters join into a supercluster.
# This is the whole point of the lab. A route joins servers; a gateway joins
# clusters. They are different ports, different protocols, different rules.
#
# A gateway carries INTEREST, not data by default: a subscription in za
# becomes visible to a publisher in au. What it will NOT do is cross an
# account boundary. That is lab/01-the-wall.sh.
gateway {
  name: $NATS_CLUSTER_NAME
  port: 7222

  # A server refuses to start when its own cluster is in its own gateway
  # list -- "cluster name conflicts between cluster and gateway definitions".
  # So the list differs per cluster and lives in its own file; compose mounts
  # the right one onto this fixed path.
  include "gateway-remotes.conf"
}

# Operator mode. Accounts are the only hard wall in NATS, so the lab needs
# real accounts, which means a real trust chain. nats/bootstrap.sh mints it.
operator: /etc/nats/operator.jwt

resolver: {
  type: full
  dir: "/data/jwt"
  allow_delete: true
  interval: "2m"
}

# system_account + the account JWTs. Written by nats/bootstrap.sh.
include "resolver-preload.generated.conf"
