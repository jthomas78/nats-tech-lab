# The remote gateways for the `za` cluster -- everything EXCEPT itself.
#
# A NATS server refuses to start when its own cluster appears here:
#   nats-server: cluster name conflicts between cluster and gateway definitions
#
# That is why this is one file per cluster rather than a line in nats.conf.
#
# The addresses end in `.gw`. That is the name each server carries on the
# `wan` network only -- see deploy/compose.za.yaml. A gateway therefore has to
# travel the wan. It cannot use the regional network, because `au-1`
# (no suffix) does not live there.
gateways [
  {
    name: au
    urls: [
      nats://au-1.gw:7222
      nats://au-2.gw:7222
      nats://au-3.gw:7222
    ]
  }
]
