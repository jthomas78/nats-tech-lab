# Exercise 01 — operator mode, full resolver.
# Start with: lab/up.sh ex01-nats-operator
# There is no user list here, and no account list. The server trusts one
# operator JWT (in .run/trust.conf) and learns accounts when they are pushed.
server_name: d06-server
listen: 127.0.0.1:4922
http: 127.0.0.1:8922

# `include` is relative to this file. `dir` below is relative to the
# server's working directory, which lab/up.sh sets to the demo folder.
include "../../.run/trust.conf"

resolver {
  type: full
  dir: ".run/resolver"
  allow_delete: false
  interval: "2m"
}
