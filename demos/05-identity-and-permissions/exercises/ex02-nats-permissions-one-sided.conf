# Exercise 02, first half: each user lists ONE side only.
# order-svc lists publish. analytics-reader lists subscribe.
# The side a user does not list stays open. That is the trap.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    {
      user: order-svc
      password: $D05_ORDER_SVC_PASSWORD
      permissions: { publish: { allow: "orders.>" } }
    }
    {
      user: analytics-reader
      password: $D05_ANALYTICS_READER_PASSWORD
      permissions: { subscribe: { allow: "orders.>" } }
    }
  ]
}
