# Exercise 05b: an NKey user that ALSO has a password. Meant to be REJECTED.
# Server source (v2.14.6, opts.go) says: "Nkey users do not take usernames or
# passwords". Check it with nats-server -t. Do not expect this server to start.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    {
      nkey: $D05_ORDER_SVC_NKEY
      password: $D05_ORDER_SVC_PASSWORD
    }
  ]
}
