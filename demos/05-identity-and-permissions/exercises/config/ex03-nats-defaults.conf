# Exercise 03c: default_permissions.
# analytics-reader has NO permissions block, so it gets the defaults.
# order-svc has its own block (publish side only). Docs claim: its block REPLACES the defaults, not merges.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  default_permissions: {
    subscribe: { allow: "orders.>" }
    publish:   { deny: ">" }
  }
  users: [
    {
      user: order-svc
      password: $D05_ORDER_SVC_PASSWORD
      permissions: {
        publish: { allow: "orders.>" }
      }
    }
    {
      user: analytics-reader
      password: $D05_ANALYTICS_READER_PASSWORD
    }
  ]
}
