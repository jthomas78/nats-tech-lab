# Exercise 03b: an EMPTY allow list.
# order-svc has "publish: { allow: [] }". Docs claim: empty means no restriction, not deny all.
# analytics-reader may subscribe to everything, so a listener can see any message that gets through.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    {
      user: order-svc
      password: $D05_ORDER_SVC_PASSWORD
      permissions: {
        publish:   { allow: [] }
        subscribe: { deny: ">" }
      }
    }
    {
      user: analytics-reader
      password: $D05_ANALYTICS_READER_PASSWORD
      permissions: {
        subscribe: { allow: ">" }
        publish:   { deny: ">" }
      }
    }
  ]
}
