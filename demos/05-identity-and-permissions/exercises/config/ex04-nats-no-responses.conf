# Exercise 04b: request / reply, the responder may publish NOTHING.
# order-svc has no publish grant at all, so it cannot send the reply.
# analytics-reader keeps its inbox, so only the responder side is missing.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    {
      user: order-svc
      password: $D05_ORDER_SVC_PASSWORD
      permissions: {
        subscribe: { allow: ["orders.summary"] }
        publish:   { deny: ">" }
      }
    }
    {
      user: analytics-reader
      password: $D05_ANALYTICS_READER_PASSWORD
      permissions: {
        publish:   { allow: ["orders.summary"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
  ]
}
