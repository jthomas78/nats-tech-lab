# Exercise 05b: NKey users, with the same permissions as exercise 02b.
# The server stores only PUBLIC keys. They come from .run/nkeys.env, written by
# lab/nkeys.sh. The seeds (private halves) stay with the clients, in .run/nkeys/.
# The client signs a one-time random value (a nonce) from the server; the
# server checks the signature against the public key.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    {
      nkey: $D05_ORDER_SVC_NKEY
      permissions: {
        publish:   { allow: ["orders.>"] }
        subscribe: { deny: ">" }
      }
    }
    {
      nkey: $D05_ANALYTICS_READER_NKEY
      permissions: {
        subscribe: { allow: ["orders.>"] }
        publish:   { deny: ">" }
      }
    }
  ]
}
