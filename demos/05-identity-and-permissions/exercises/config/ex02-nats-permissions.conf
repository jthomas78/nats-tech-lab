# Exercise 02, second half: each user has BOTH sides set.
# order-svc may publish orders.> and may not subscribe to anything.
# analytics-reader may subscribe orders.> and may not publish anything.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    {
      user: order-svc
      password: $D05_ORDER_SVC_PASSWORD
      permissions: {
        publish:   { allow: "orders.>" }
        subscribe: { deny: ">" }
      }
    }
    {
      user: analytics-reader
      password: $D05_ANALYTICS_READER_PASSWORD
      permissions: {
        subscribe: { allow: "orders.>" }
        publish:   { deny: ">" }
      }
    }
  ]
}
