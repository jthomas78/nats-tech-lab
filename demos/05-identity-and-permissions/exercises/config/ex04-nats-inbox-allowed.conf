# Exercise 04a: request / reply, the requester's inbox ALLOWED.
# analytics-reader asks order-svc for a summary on orders.summary.
# The reply goes to the requester's private inbox, _INBOX.<random>. So:
#   analytics-reader may publish the request and subscribe to _INBOX.>.
#   order-svc may subscribe to the request and publish to _INBOX.> (a broad grant).
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    {
      user: order-svc
      password: $D05_ORDER_SVC_PASSWORD
      permissions: {
        subscribe: { allow: ["orders.summary"] }
        publish:   { allow: ["_INBOX.>"] }
      }
    }
    {
      user: analytics-reader
      password: $D05_ANALYTICS_READER_PASSWORD
      permissions: {
        publish:   { allow: ["orders.summary"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
  ]
}
