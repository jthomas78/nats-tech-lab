# Exercise 04a: request / reply, the requester's inbox DENIED.
# Same as ex04-nats-inbox-allowed.conf, except analytics-reader may subscribe to nothing.
# Docs claim: the reply has nowhere to go, and the request times out.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    {
      user: order-svc
      password: $D05_ORDER_SVC_PASSWORD
      permissions: {
        subscribe: { allow: ["orders.summary"] }
        publish:   { allow: ["_INBOX.>"] }
      }
    }
    {
      user: analytics-reader
      password: $D05_ANALYTICS_READER_PASSWORD
      permissions: {
        publish:   { allow: ["orders.summary"] }
        subscribe: { deny: ">" }
      }
    }
  ]
}
