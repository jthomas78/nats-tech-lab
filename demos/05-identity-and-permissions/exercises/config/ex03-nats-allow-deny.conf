# Exercise 03a: allow, deny and wildcards.
# order-svc may publish orders.> EXCEPT orders.internal.> (deny wins), and subscribes to nothing.
# analytics-reader may subscribe to orders.* (exactly one token after "orders") and publishes nothing.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    {
      user: order-svc
      password: $D05_ORDER_SVC_PASSWORD
      permissions: {
        publish:   { allow: ["orders.>"], deny: ["orders.internal.>"] }
        subscribe: { deny: ">" }
      }
    }
    {
      user: analytics-reader
      password: $D05_ANALYTICS_READER_PASSWORD
      permissions: {
        subscribe: { allow: ["orders.*"] }
        publish:   { deny: ">" }
      }
    }
    {
      # Observer: sees all of orders.> so delivery proves what order-svc may publish.
      user: audit-observer
      password: $D05_AUDIT_OBSERVER_PASSWORD
      permissions: {
        subscribe: { allow: ["orders.>"] }
        publish:   { deny: ">" }
      }
    }
  ]
}
