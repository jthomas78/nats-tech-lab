# Exercise 04b: request / reply with allow_responses.
# Same as ex04-nats-no-responses.conf, plus allow_responses on order-svc.
# Docs claim: order-svc may now publish ONE reply to the reply subject of each
# request it received, and nothing else. No broad _INBOX.> grant is needed.
# Server source (v2.14.6): the reply check runs after allow and deny say no,
# so deny ">" does not block a reply. Defaults: 1 reply, valid 2 minutes.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    {
      user: order-svc
      password: $D05_ORDER_SVC_PASSWORD
      permissions: {
        subscribe: { allow: ["orders.summary"] }
        publish:   { deny: ">" }
        allow_responses: true
      }
    }
    {
      user: analytics-reader
      password: $D05_ANALYTICS_READER_PASSWORD
      permissions: {
        publish:   { allow: ["orders.summary"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
  ]
}
