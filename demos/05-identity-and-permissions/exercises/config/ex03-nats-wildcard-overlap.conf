# Exercise 03d: a wildcard subscription that overlaps a deny.
# analytics-reader may subscribe orders.> but not orders.internal.>.
# order-svc may publish all of orders.> (no deny), so it can send the denied subject too.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    {
      user: order-svc
      password: $D05_ORDER_SVC_PASSWORD
      permissions: {
        publish:   { allow: ["orders.>"] }
        subscribe: { deny: ">" }
      }
    }
    {
      user: analytics-reader
      password: $D05_ANALYTICS_READER_PASSWORD
      permissions: {
        subscribe: { allow: ["orders.>"], deny: ["orders.internal.>"] }
        publish:   { deny: ">" }
      }
    }
  ]
}
