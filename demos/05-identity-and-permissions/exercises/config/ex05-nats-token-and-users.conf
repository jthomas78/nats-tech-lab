# Exercise 05a: a token AND a users list. Meant to be REJECTED.
# Can a token sit next to named users with permissions? Server source
# (v2.14.6, opts.go) says no: "Can not have a token and a users array".
# Check it with nats-server -t. Do not expect this server to start.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  token: $D05_TOKEN
  users: [
    {
      user: order-svc
      password: $D05_ORDER_SVC_PASSWORD
      permissions: {
        publish:   { allow: ["orders.>"] }
        subscribe: { deny: ">" }
      }
    }
  ]
}
