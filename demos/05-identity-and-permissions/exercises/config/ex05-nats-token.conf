# Exercise 05a: one shared token for the whole server.
# Any client that sends this token is admitted. There is no user name, so no
# per-user permissions: every token holder may publish and subscribe anything.
server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  token: $D05_TOKEN
}
