# Exercise 01b — username / password AUTHENTICATION.
#
# This answers "who are you?" only. Both users may still publish and
# subscribe to anything; limiting that is authorization (exercise 02).
#
# The passwords are NOT in this file. nats-server reads each $D05_...
# variable from its environment at start-up, and refuses to start when one
# is missing. Create them with lab/secrets.sh, then:
#   source .run/secrets.env
#
# The server still holds them as plaintext in memory, and logs
# "Plaintext passwords detected, use nkeys or bcrypt". Exercise 06 fixes
# that with bcrypt; exercise 05 removes the password with an NKey.

server_name: d05-server
listen: 127.0.0.1:4522
http: 127.0.0.1:8522

authorization {
  users: [
    { user: order-svc,        password: $D05_ORDER_SVC_PASSWORD }
    { user: analytics-reader, password: $D05_ANALYTICS_READER_PASSWORD }
  ]
}
