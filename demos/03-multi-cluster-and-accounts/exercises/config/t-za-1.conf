# t-za-1 -- server 1 of cluster `za` (ZA region cluster).
# Exercise 10, T4 rig: za + au + arb, 3 servers each, joined by gateways only.
# One meta group of 9; quorum is 5.
#
# Ports: client 4231, monitor 8231, route 6231, gateway 7231.
# Edit this file by hand. ./lab/rig-t4.sh up copies it into lab/run/ and starts
# it from there, so the JetStream store lands in lab/run/js/ (gitignored).
# Keep the `t-` prefix on the file name and server_name: the kill pattern
# `nats-server -c t-` depends on it.

server_name: t-za-1
listen: 127.0.0.1:4231
http: 127.0.0.1:8231
jetstream { store_dir: "./js/za-1" }

cluster {
  name: za
  listen: 127.0.0.1:6231
  routes: [ nats://127.0.0.1:6232, nats://127.0.0.1:6233 ]
}

gateway {
  name: za
  listen: 127.0.0.1:7231
  gateways: [
    { name: au,  urls: [ nats://127.0.0.1:7241, nats://127.0.0.1:7242, nats://127.0.0.1:7243 ] },
    { name: arb, urls: [ nats://127.0.0.1:7541, nats://127.0.0.1:7542, nats://127.0.0.1:7543 ] },
  ]
}

include ./accounts.conf
