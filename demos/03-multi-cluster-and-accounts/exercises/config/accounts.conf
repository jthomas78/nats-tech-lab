# Accounts for every server in exercise 10. Included by each t-*.conf here.
# Held still on purpose -- the same four accounts as every lab/ script.
#   $SYS   system account (admin)
#   LB     the SHARED account; every exercise 10 fixture lives here (lb)
#   LB_ZA  ZA's own account (za)
#   LB_AU  AU's own account (au)
# user == password everywhere. Lab only, 127.0.0.1 only.
accounts {
  $SYS { users: [ { user: admin, password: admin } ] }
  LB_ZA { jetstream: enabled, users: [ { user: za, password: za } ] }
  LB_AU { jetstream: enabled, users: [ { user: au, password: au } ] }
  LB    { jetstream: enabled, users: [ { user: lb, password: lb } ] }
}
